  if(tipo==="gradiente")return<div style={{borderRadius:14,overflow:"hidden",height:70,margin:"12px 0",background:"linear-gradient(135deg,#ef4444,#f97316,#fbbf24,#34d399,#3b82f6,#8b5cf6,#ec4899)"}}/>;
  if(tipo==="mandala")return<div style={{display:"flex",justifyContent:"center",padding:"8px 0"}}><div style={{position:"relative",width:110,height:110}}>{[0,1,2,3,4,5,6,7].map(i=><div key={i} style={{position:"absolute",inset:0,display:"flex",justifyContent:"center"}}><div style={{width:4,height:50,background:`hsl(${i*45},70%,60%)`,borderRadius:4,transformOrigin:"bottom center",transform:`rotate(${i*45}deg) translateY(-5px)`,opacity:.7}}/></div>)}{[0,1,2].map(i=><div key={i} style={{position:"absolute",inset:i*16+8,borderRadius:"50%",border:`1.5px solid hsl(${i*60+200},60%,65%)`,animation:`girar ${6+i*2}s linear infinite ${i%2===0?"":" reverse"}`}}/>)}<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:14,height:14,borderRadius:"50%",background:color,animation:"pulso 2s ease-in-out infinite"}}/></div></div></div>;

function GruposTab({patients}){
  const [grupos,setGrupos]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [view,setView]=useState(null);
  const [dispMsg,setDispMsg]=useState("");

  useEffect(()=>{
    const u=fbListen("grupos",d=>{setGrupos(d?Object.values(d):[]);setLoaded(true);});
    return()=>u();
  },[]);

  async function deleteGrupo(id){await fbSet(`grupos/${id}`,null);}

  async function disparar(g){
    const tasks=g.tasks?Object.values(g.tasks):[];
    const membros=g.membros||[];
    if(!tasks.length){alert("Adicione tarefas ao grupo primeiro.");return;}
    if(!membros.length){alert("Adicione pacientes ao grupo primeiro.");return;}
    for(const pid of membros){
      for(const task of tasks){
        const id="t"+Date.now()+Math.random().toString(36).slice(2,5);
        await fbSet(`patients/${pid}/tasks/${id}`,{id,type:task.type,title:task.title,note:task.note||"",response:null,createdAt:new Date().toLocaleDateString("pt-BR"),fromGroup:g.nome});
      }
    }
    setDispMsg(`✅ Tarefas disparadas para ${membros.length} paciente(s)!`);
    setTimeout(()=>setDispMsg(""),3000);
  }

  if(view){return<GrupoForm grupo={view==="new"?null:view} patients={patients} onClose={()=>setView(null)}/>;}

  return<div>
    {dispMsg&&<div style={{background:"#d1fae5",borderRadius:12,padding:14,marginBottom:16,color:"#065f46",fontWeight:700,fontSize:14,textAlign:"center"}}>{dispMsg}</div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <h2 style={h2s}>Grupos</h2>
      <button onClick={()=>setView("new")} style={{...btn(),padding:"9px 16px",borderRadius:10}}>+ Novo</button>
    </div>
    {!loaded&&<Spinner/>}
    {loaded&&grupos.length===0&&<EmptyState icon="👥" text="Nenhum grupo criado ainda."/>}
    {grupos.map(g=>{
      const membros=g.membros||[];
      const tasks=g.tasks?Object.values(g.tasks):[];
      return<div key={g.id} style={{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:40,height:40,borderRadius:12,background:"#ede9fe",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{g.emoji||"👥"}</div>
            <div>
              <div style={{fontWeight:800,color:"#1f2937",fontSize:16}}>{g.nome}</div>
              <div style={{display:"flex",gap:6,marginTop:4}}>
                <span style={{fontSize:11,background:"#ede9fe",color:"#6d28d9",padding:"2px 8px",borderRadius:20,fontWeight:700}}>{membros.length} paciente(s)</span>
                <span style={{fontSize:11,background:"#d1fae5",color:"#065f46",padding:"2px 8px",borderRadius:20,fontWeight:700}}>{tasks.length} tarefa(s)</span>
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setView(g)} style={{...btn("#ede9fe"),color:"#6d28d9",padding:"6px 10px"}}>✏️</button>
            <button onClick={()=>deleteGrupo(g.id)} style={{...btn("#fee2e2"),padding:"6px 10px"}}>🗑</button>
          </div>
        </div>
        {membros.length>0&&<div style={{marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",marginBottom:6,textTransform:"uppercase",letterSpacing:".5px"}}>Pacientes</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{membros.map(pid=>{const p=patients.find(p=>p.id===pid);return p?<span key={pid} style={{fontSize:12,background:"#f3f4f6",color:"#374151",padding:"4px 10px",borderRadius:20,fontWeight:600}}>{p.name}</span>:null;})}</div>
        </div>}
        {tasks.length>0&&<div style={{marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",marginBottom:6,textTransform:"uppercase",letterSpacing:".5px"}}>Tarefas padrão</div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>{tasks.map((t,i)=>{const ti=getTypeInfo(t.type);return<div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}><span style={{width:8,height:8,borderRadius:"50%",background:ti.color||"#888",display:"inline-block",flexShrink:0}}/><span style={{fontWeight:700,color:ti.color||"#888"}}>{ti.label||t.type}</span><span style={{color:"#9ca3af"}}>—</span><span style={{color:"#374151"}}>{t.title}</span></div>;})}</div>
        </div>}
        <button onClick={()=>disparar(g)} style={{...btn(),width:"100%",padding:"11px 0",boxShadow:"0 4px 12px rgba(109,40,217,.3)"}}>🚀 Disparar tarefas para todos</button>
      </div>;
    })}
  </div>;
}

function GrupoForm({grupo,patients,onClose}){
  const isEdit=!!grupo;
  const [nome,setNome]=useState(grupo?.nome||"");
  const [emoji,setEmoji]=useState(grupo?.emoji||"👥");
  const [membros,setMembros]=useState(grupo?.membros||[]);
  const [tasks,setTasks]=useState(grupo?.tasks?Object.values(grupo.tasks):[]);
  const [showTF,setShowTF]=useState(false);
  const [tt,setTt]=useState("");const [ttitle,setTtitle]=useState("");const [tnote,setTnote]=useState("");
  const [saving,setSaving]=useState(false);
  const EMOJIS=["👥","🏋️","🧠","🎯","💪","🌱","⭐","🔥","🏆","🌟","💡","🎨"];
  function toggleMembro(pid){setMembros(m=>m.includes(pid)?m.filter(i=>i!==pid):[...m,pid]);}
  function addTask(){if(!tt||!ttitle)return;setTasks(t=>[...t,{type:tt,title:ttitle,note:tnote}]);setTt("");setTtitle("");setTnote("");setShowTF(false);}
  function removeTask(i){setTasks(t=>t.filter((_,idx)=>idx!==i));}
  async function save(){
    if(!nome.trim()){alert("Digite um nome.");return;}
    setSaving(true);
    const id=grupo?.id||"g"+Date.now();
    const tasksObj={};tasks.forEach((t,i)=>{tasksObj[`task_${i}`]=t;});
    await fbSet(`grupos/${id}`,{id,nome,emoji,membros,tasks:tasksObj});
    setSaving(false);onClose();
  }
  return<div style={aw}>
    <Header title={isEdit?"Editar Grupo":"Novo Grupo"} subtitle={nome||"Sem nome"} onBack={onClose} backLabel="← Voltar"/>
    <div style={ct}>
      <div style={{...crd,marginBottom:14}}>
        <label style={lbl}>Nome do grupo</label>
        <input className="inp" value={nome} onChange={e=>setNome(e.target.value)} placeholder="ex: Grupo Ansiedade, Turma TCC..."/>
        <label style={lbl}>Ícone</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{EMOJIS.map(e=><button key={e} onClick={()=>setEmoji(e)} style={{width:40,height:40,borderRadius:10,border:`2px solid ${emoji===e?"#6d28d9":"#e5e7eb"}`,background:emoji===e?"#ede9fe":"#fff",fontSize:20,cursor:"pointer"}}>{e}</button>)}</div>
      </div>
      <div style={{...crd,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937"}}>👤 Pacientes</h3>
          <span style={{fontSize:12,color:"#6d28d9",fontWeight:700}}>{membros.length} selecionado(s)</span>
        </div>
        {patients.length===0&&<p style={{fontSize:13,color:"#9ca3af"}}>Nenhum paciente cadastrado.</p>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {patients.map(p=>{const sel=membros.includes(p.id);return<div key={p.id} onClick={()=>toggleMembro(p.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,border:`1.5px solid ${sel?"#6d28d9":"#e5e7eb"}`,background:sel?"#ede9fe":"#fff",cursor:"pointer",transition:"all .15s"}}>
            <div style={{width:32,height:32,borderRadius:10,background:sel?"#6d28d9":"#f3f4f6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:sel?"#fff":"#9ca3af",fontWeight:800}}>{sel?"✓":"+"}</div>
            <div style={{fontWeight:700,color:sel?"#6d28d9":"#1f2937"}}>{p.name}</div>
          </div>;})}
        </div>
      </div>
      <div style={{...crd,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937"}}>📋 Tarefas Padrão</h3>
          <button onClick={()=>setShowTF(true)} style={{...btn(),padding:"7px 12px",fontSize:12}}>+ Adicionar</button>
        </div>
        {showTF&&<div style={{background:"#f9fafb",borderRadius:12,padding:14,marginBottom:12}}>
          <select value={tt} onChange={e=>setTt(e.target.value)} className="inp"><option value="">Tipo...</option>{TASK_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
          <input className="inp" placeholder="Título" value={ttitle} onChange={e=>setTtitle(e.target.value)}/>
          <textarea className="inp" placeholder="Instruções (opcional)" value={tnote} onChange={e=>setTnote(e.target.value)} style={{minHeight:50,resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}><button onClick={addTask} style={btn()}>Confirmar</button><button onClick={()=>setShowTF(false)} style={btn("#e5e7eb")}>Cancelar</button></div>
        </div>}
        {tasks.length===0&&<p style={{fontSize:13,color:"#9ca3af"}}>Nenhuma tarefa configurada.</p>}
        {tasks.map((t,i)=>{const ti=getTypeInfo(t.type);return<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"#f9fafb",borderRadius:10,marginBottom:6}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:ti.color||"#888",flexShrink:0}}/>
          <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:ti.color||"#888"}}>{ti.label||t.type}</div><div style={{fontSize:13,color:"#374151",fontWeight:600}}>{t.title}</div></div>
          <button onClick={()=>removeTask(i)} style={{background:"none",border:"none",cursor:"pointer",color:"#e11d48",fontSize:16}}>🗑</button>
        </div>;})}
      </div>
      <button className="btn-main" onClick={save} disabled={saving}>{saving?"Salvando...":isEdit?"Salvar":"Criar Grupo"}</button>
    </div>
  </div>;
}

function LoginScreen({onLogin}){
  const [role,setRole]=useState("therapist");const [pid,setPid]=useState("");const [pass,setPass]=useState("");const [err,setErr]=useState("");const [loading,setLoading]=useState(false);
  async function handle(){
    setErr("");setLoading(true);
    try{
      if(role==="therapist"){const d=await fbGet("therapist");if(pass===(d?.password||"1234"))onLogin("therapist",null);else setErr("Senha incorreta.");}
      else{const all=await fbGet("patients");if(!all){setErr("Nenhum paciente cadastrado.");setLoading(false);return;}
        const found=Object.values(all).find(p=>p.name.trim().toLowerCase()===pid.trim().toLowerCase());
        if(!found){setErr("Paciente não encontrado.");setLoading(false);return;}
        if(found.password&&found.password!==pass){setErr("Senha incorreta.");setLoading(false);return;}
        onLogin("patient",found.id);}
    }catch(e){setErr("Erro de conexão.");}
    setLoading(false);
  }
  return<div style={{minHeight:"100vh",background:"linear-gradient(160deg,#1e1b4b,#4c1d95,#0c4a6e)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

        <div style={{width:72,height:72,borderRadius:22,background:"linear-gradient(135deg,#7c3aed,#0ea5e9)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",boxShadow:"0 8px 32px rgba(124,58,237,.5)",fontSize:36}}>🧠</div>
        <h1 style={{color:"#fff",fontSize:28,fontWeight:900,letterSpacing:"-1px",marginBottom:4}}>MeuPsi</h1>
        <p style={{color:"rgba(255,255,255,.6)",fontSize:12,lineHeight:1.6}}>João Rosa · Psicólogo TCC<br/>CRP 06/227336</p>
      </div>
      <div style={{background:"rgba(255,255,255,.95)",borderRadius:24,padding:28,boxShadow:"0 24px 60px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",marginBottom:22,borderRadius:12,overflow:"hidden",background:"#f3f4f6",padding:4,gap:4}}>
          {["therapist","patient"].map(r=><button key={r} onClick={()=>{setRole(r);setErr("");}} style={{flex:1,padding:"9px 0",background:role===r?"#fff":"transparent",color:role===r?"#6d28d9":"#9ca3af",border:"none",cursor:"pointer",fontWeight:700,fontSize:13,borderRadius:9,boxShadow:role===r?"0 2px 8px rgba(0,0,0,.1)":"none",transition:"all .2s"}}>{r==="therapist"?"Terapeuta":"Paciente"}</button>)}
        </div>
        {role==="patient"&&<input className="inp" placeholder="Seu nome completo" value={pid} onChange={e=>setPid(e.target.value)}/>}
        <input type="password" className="inp" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} style={{marginBottom:16}}/>
        {err&&<p style={{color:"#e11d48",fontSize:12,marginBottom:10}}>{err}</p>}
        <button className="btn-main" onClick={handle} disabled={loading}>{loading?"Entrando...":"Entrar"}</button>
      </div>
    </div>
  </div>;
}

// ── Therapist ──
function TherapistApp({onLogout}){
  const [tab,setTab]=useState("patients");
  const [patients,setPatients]=useState(null);
  const [sel,setSel]=useState(null);
  const [modal,setModal]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);

  useEffect(()=>{const u=fbListen("patients",d=>setPatients(d?Object.values(d):[]));return()=>u();},[]);

  async function savePatient(name,pass){
    if(!name.trim())return;
    const all=await fbGet("patients");const list=all?Object.values(all):[];
    if(!modal?.id&&list.find(p=>p.name.trim().toLowerCase()===name.trim().toLowerCase())){alert(`Já existe um paciente com o nome "${name}".`);return;}
    if(modal?.id){
      const updates={name};if(pass)updates.password=pass;
      await fbUpdate(`patients/${modal.id}`,updates);
    }else{
      const id="p"+Date.now();
      await fbSet(`patients/${id}`,{id,name,password:pass||"1234",tasks:{},prontuario:{identificacao:{},demanda:{},evolucao_reg:{},encerramento:{},historia:{},evolucao:{}}});
    }
    setModal(null);
  }

  async function deletePatient(id){await fbSet(`patients/${id}`,null);setConfirmDel(null);}

  if(patients===null)return<div style={aw}><Header title="MeuPsi" subtitle="Painel do Terapeuta" onBack={onLogout}/><Spinner/></div>;
  if(sel){const p=patients.find(p=>p.id===sel);if(p)return<PatientDetail patient={p} onBack={()=>setSel(null)}/>;}

  return<div style={aw}>
    {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.name}"?`} onConfirm={()=>deletePatient(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
    {modal&&<PatientModal patient={modal==="new"?null:modal} onClose={()=>setModal(null)} onSave={savePatient}/>}
    <Header title="MeuPsi" subtitle="Painel do Terapeuta" onBack={onLogout}/>
    <TabBar tabs={[["patients","👥 Pacientes"],["groups","🗂 Grupos"],["dashboard","📊 Dashboard"],["overview","📈 Visão Geral"],["config","⚙️ Config"]]} active={tab} onChange={setTab}/>

// ── Patient Detail ──
function PatientDetail({patient,onBack}){
  const [tab,setTab]=useState("tasks");const [lp,setLp]=useState(patient);
  const [showAdd,setShowAdd]=useState(false);const [tt,setTt]=useState("");const [ttitle,setTtitle]=useState("");const [tnote,setTnote]=useState("");
  const [confirmDel,setConfirmDel]=useState(null);const [viewTask,setViewTask]=useState(null);
  useEffect(()=>{const u=fbListen(`patients/${patient.id}`,d=>{if(d)setLp(d);});return()=>u();},[patient.id]);
  async function addTask(){
    if(!tt)return;
    const id="t"+Date.now();
    const ti=getTypeInfo(tt);
    await fbSet(`patients/${patient.id}/tasks/${id}`,{id,type:tt,title:ti.label||tt,note:tnote,response:null,createdAt:new Date().toLocaleDateString("pt-BR")});
    setTt("");setTnote("");setShowAdd(false);
  }
  async function deleteTask(tid){await fbSet(`patients/${patient.id}/tasks/${tid}`,null);setConfirmDel(null);setViewTask(null);}
  const tasks=lp.tasks?Object.values(lp.tasks):[];
  const diarios=lp.diarios?Object.values(lp.diarios).reverse():[];

  if(viewTask){const ti=getTypeInfo(viewTask.type);return<div style={aw}>
    {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}

    <div style={ct}><div style={crd}>
      <span style={{fontSize:11,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label}</span>
      <h2 style={{fontSize:17,fontWeight:800,color:"#1f2937",margin:"12px 0 4px"}}>{viewTask.title}</h2>
      {viewTask.note&&<div style={{background:"#f3f4f6",borderRadius:10,padding:12,marginBottom:12}}><p style={{fontSize:13,color:"#555"}}><strong>Instruções:</strong> {viewTask.note}</p></div>}
      <span style={{fontSize:13,padding:"4px 10px",borderRadius:20,background:viewTask.response?"#d1fae5":"#fef3c7",color:viewTask.response?"#065f46":"#92400e",fontWeight:600}}>{viewTask.response?"✅ Respondida":"⏳ Pendente"}</span>
      {viewTask.response&&<div style={{marginTop:16}}><h3 style={{fontSize:14,fontWeight:700,color:"#374151",marginBottom:10}}>Resposta:</h3><ResponseView response={viewTask.response} type={viewTask.type}/></div>}
      <div style={{marginTop:20}}><button onClick={()=>setConfirmDel(viewTask)} style={{...btn("#fee2e2"),width:"100%"}}>🗑 Apagar</button></div>
    </div></div>
  </div>;}

  return<div style={aw}>
    {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
    <Header title={`👤 ${patient.name}`} subtitle="Detalhes" onBack={onBack} backLabel="← Voltar"/>
    <TabBar tabs={[["tasks","📋 Tarefas"],["responses","✅ Respostas"],["diario","📔 Diário"],["prontuario","📁 Prontuário"]]} active={tab} onChange={setTab}/>
    <div className="fade-in" style={ct}>
      {tab==="tasks"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h2 style={h2s}>Tarefas ({tasks.length})</h2>
          <button onClick={()=>setShowAdd(true)} style={{...btn(),padding:"9px 16px",borderRadius:10}}>+ Nova</button>
        </div>
        {showAdd&&<div style={{...crd,marginBottom:16}}>
          <select value={tt} onChange={e=>setTt(e.target.value)} className="inp"><option value="">Tipo de tarefa...</option>{TASK_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
          <textarea className="inp" placeholder="Instruções (opcional)" value={tnote} onChange={e=>setTnote(e.target.value)} style={{minHeight:60,resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}><button onClick={addTask} style={btn()}>Adicionar</button><button onClick={()=>setShowAdd(false)} style={btn("#e5e7eb")}>Cancelar</button></div>
        </div>}
        {tasks.length===0&&<EmptyState icon="📋" text="Nenhuma tarefa ainda."/>}
        {tasks.map(task=>{const ti=getTypeInfo(task.type);return<div key={task.id} className="card-hover" onClick={()=>setViewTask(task)} style={{background:"#fff",borderRadius:16,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,.05)",borderLeft:`4px solid ${ti.color||"#888"}`}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <span style={{fontSize:11,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label||task.type}</span>
              <div style={{fontWeight:700,marginTop:8,color:"#1f2937",fontSize:14}}>{task.title}</div>
              {task.note&&<div style={{fontSize:12,color:"#9ca3af",marginTop:3}}>{task.note}</div>}
              {task.fromGroup&&<div style={{fontSize:11,color:"#6d28d9",marginTop:4}}>📦 Grupo: {task.fromGroup}</div>}
            </div>
            <span style={{fontSize:11,padding:"3px 10px",borderRadius:20,background:task.response?"#d1fae5":"#fef3c7",color:task.response?"#065f46":"#92400e",fontWeight:700,marginLeft:8,height:"fit-content"}}>{task.response?"✅":"⏳"}</span>

      </>}
      {tab==="responses"&&<>
        <h2 style={h2s}>Respostas</h2>
        {tasks.filter(t=>t.response).length===0&&<EmptyState icon="✅" text="Nenhuma resposta ainda."/>}
        {tasks.filter(t=>t.response).map(task=>{const ti=getTypeInfo(task.type);return<div key={task.id} style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,.05)"}}>
          <span style={{fontSize:11,fontWeight:700,color:ti.color}}>{ti.label||task.type}</span>
          <div style={{fontWeight:700,marginBottom:10,color:"#1f2937"}}>{task.title}</div>
          <ResponseView response={task.response} type={task.type}/>
          {task.answeredAt&&<div style={{fontSize:11,color:"#9ca3af",marginTop:8}}>Respondida em {task.answeredAt}</div>}
        </div>;})}
      </>}
      {tab==="diario"&&<>
        <h2 style={h2s}>📔 Diário ({diarios.length})</h2>
        {diarios.length===0&&<EmptyState icon="📔" text="Nenhum registro ainda."/>}
        {diarios.map((d,i)=>{const em=EMOCOES.find(e=>e.nome===d.emocao)||{emoji:"😐",color:"#888"};return<div key={i} style={{background:"#fff",borderRadius:16,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,.05)",borderLeft:`4px solid ${em.color}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <div style={{width:40,height:40,borderRadius:12,background:`${em.color}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{em.emoji}</div>
            <div><div style={{fontWeight:700,color:em.color,fontSize:14}}>{d.emocao}</div><div style={{fontSize:11,color:"#9ca3af"}}>{d.data} {d.hora}</div></div>
            <div style={{marginLeft:"auto",background:`${em.color}15`,color:em.color,fontSize:12,fontWeight:700,padding:"4px 10px",borderRadius:20}}>Int. {d.intensidade}/10</div>
          </div>
          {d.contexto&&<div style={{fontSize:13,color:"#6b7280",background:"#f9fafb",borderRadius:10,padding:"8px 12px"}}>{d.contexto}</div>}
        </div>;})}
      </>}
      {tab==="prontuario"&&<ProntuarioTab patientId={patient.id} prontuario={lp.prontuario||{}}/>}
    </div>
  </div>;
}

        {ph?<textarea className="inp" placeholder={ph} value={(data[ptab]||{})[f]||""} onChange={e=>setData({...data,[ptab]:{...(data[ptab]||{}),[f]:e.target.value}})} style={{minHeight:70,resize:"vertical",marginBottom:0}}/>
          :<input className="inp" placeholder={`Digite...`} value={(data[ptab]||{})[f]||""} onChange={e=>setData({...data,[ptab]:{...(data[ptab]||{}),[f]:e.target.value}})} style={{marginBottom:0}}/>}
      </div>)}

    </div>}
    {ptab==="anexos"&&<div className="fade-in" style={{...crd,marginBottom:14}}>

      <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937",marginBottom:4}}>🗂 História Clínica</h3>
      {[["familiar","História familiar","Dinâmica familiar..."],["social","História social","Escolaridade, trabalho..."],["saude","Histórico de saúde","Doenças, tratamentos..."],["psico","Histórico psicológico","Tratamentos anteriores..."]].map(([f,l,ph])=><div key={f} style={{marginBottom:14}}>

// ── Escalas Psicológicas ──
function EscalaPsiForm({tipo,color,onSubmit}){
  const ed=getEscalaData(tipo);
  const [respostas,setRespostas]=useState({});
  const [enviado,setEnviado]=useState(false);
  if(!ed)return null;
  const respondidos=Object.keys(respostas).length;
  const total=ed.itens.length;
  const pct=Math.round((respondidos/total)*100);
  if(enviado){
    const {totais}=calcEscala(ed,respostas);
    return<div style={crd}><div style={{textAlign:"center",padding:"20px 0"}}><div style={{fontSize:52,marginBottom:12}}>✅</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Respostas enviadas!</h3><p style={{fontSize:14,color:"#6b7280"}}>Seu terapeuta irá analisar em breve.</p></div><button className="btn-main" style={{background:color,marginTop:8}} onClick={()=>onSubmit({respostas,totais,escala:ed.nome})}>Concluir</button></div>;
  }
  return<div style={crd}>
    <h3 style={{fontSize:15,fontWeight:800,color,marginBottom:4}}>{ed.nome}</h3>
    <p style={{fontSize:12,color:"#9ca3af",marginBottom:12}}>{ed.itens.length} itens · {Object.keys(ed.subescalas).length} subescalas</p>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,color:"#9ca3af"}}>{respondidos}/{total}</span><span style={{fontSize:12,fontWeight:700,color}}>{pct}%</span></div>
    <div style={{background:"#f3f4f6",borderRadius:20,height:8,overflow:"hidden",marginBottom:16}}><div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:20,transition:"width .3s"}}/></div>
    {ed.itens.map(item=><div key={item.id} style={{background:"#f9fafb",borderRadius:12,padding:14,marginBottom:10}}>
      <p style={{fontSize:13,color:"#1f2937",fontWeight:600,marginBottom:10,lineHeight:1.5}}><span style={{color,fontWeight:800,marginRight:6}}>{item.id}.</span>{item.texto}</p>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {ed.escala.map((op,i)=><button key={i} onClick={()=>setRespostas(r=>({...r,[item.id]:i+1}))} style={{border:`1.5px solid ${respostas[item.id]===i+1?color:"#e5e7eb"}`,borderRadius:10,padding:"9px 14px",cursor:"pointer",fontWeight:600,fontSize:13,textAlign:"left",background:respostas[item.id]===i+1?`${color}15`:"#fff",color:respostas[item.id]===i+1?color:"#374151",transition:"all .15s"}}><span style={{fontWeight:800,marginRight:8}}>{i+1}.</span>{op}</button>)}
      </div>
    </div>)}
    <button className="btn-main" style={{background:respondidos<total?"#e5e7eb":color,color:respondidos<total?"#9ca3af":"#fff"}} onClick={()=>{if(respondidos>=total)setEnviado(true);else alert(`Faltam ${total-respondidos} item(s).`);}}>{respondidos<total?`Faltam ${total-respondidos}`:"Ver Resultado"}</button>
  </div>;
}

// ── Patient App ──
function PatientApp({patientId,onLogout}){
  const [patient,setPatient]=useState(null);const [tab,setTab]=useState("tasks");const [sel,setSel]=useState(null);const [viewTask,setViewTask]=useState(null);

  async function submitResponse(taskId,response){await fbUpdate(`patients/${patientId}/tasks/${taskId}`,{response,answeredAt:new Date().toLocaleDateString("pt-BR")});setSel(null);}
  if(!patient)return<div style={aw}><Spinner/></div>;
  const tasks=patient.tasks?Object.values(patient.tasks):[];
  const pending=tasks.filter(t=>!t.response);const done=tasks.filter(t=>t.response);

        <div style={{fontSize:52,marginBottom:12}}>✅</div>

        <p style={{fontSize:14,color:"#6b7280",lineHeight:1.6}}>Tarefa concluída!<br/>Seu terapeuta irá analisar suas respostas.</p>

      </div>
    </div></div>
  </div>;}
  return<div style={aw}>
    <Header title={`Olá, ${patient.name}! 👋`} subtitle="MeuPsi · João Rosa" onBack={onLogout}/>
    <TabBar tabs={[["tasks","📋 Tarefas"],["diario","📔 Diário"],["baralhos","🃏 Baralhos"],["config","⚙️"]]} active={tab} onChange={setTab}/>
    <div className="fade-in" style={ct}>
      {tab==="tasks"&&<>
        {tasks.length===0&&<EmptyState icon="🎉" text="Nenhuma tarefa ainda."/>}
        {pending.length>0&&<><h2 style={h2s}>⏳ Pendentes ({pending.length})</h2>

// Tempo de Reação
function TRForm({color,onSubmit}){
  const TOTAL=20;
  const [fase,setFase]=useState("intro");
  const [trial,setTrial]=useState(0);
  const [tempos,setTempos]=useState([]);
  const [falsosPos,setFalsosPos]=useState(0);
  const [omissoes,setOmissoes]=useState(0);
  const [alvoVis,setAlvoVis]=useState(false);
  const [feedback,setFeedback]=useState(null);
  const [tempoIni,setTempoIni]=useState(null);
  const [ultimoTR,setUltimoTR]=useState(null);
  const tRef=useRef(null),aRef=useRef(null);
  function comecar(){
    setFase("espera");setAlvoVis(false);setFeedback(null);
    const e=1000+Math.random()*3000;
    tRef.current=setTimeout(()=>{setAlvoVis(true);setTempoIni(Date.now());setFase("alvo");
      aRef.current=setTimeout(()=>{setAlvoVis(false);setOmissoes(o=>o+1);setFeedback("omissao");setFase("feedback");setTimeout(()=>prox(),1200);},1500);
    },e);
  }
  function prox(){const n=trial+1;if(n>=TOTAL)setFase("resultado");else{setTrial(n);comecar();}}
  function click(){
    if(fase==="espera"){clearTimeout(tRef.current);setFalsosPos(f=>f+1);setFeedback("falso");setFase("feedback");setTimeout(()=>prox(),1200);}
    else if(fase==="alvo"){clearTimeout(aRef.current);const tr=Date.now()-tempoIni;setUltimoTR(tr);setTempos(t=>[...t,tr]);setAlvoVis(false);setFeedback("certo");setFase("feedback");setTimeout(()=>prox(),800);}
  }
  useEffect(()=>()=>{clearTimeout(tRef.current);clearTimeout(aRef.current);},[]);
  if(fase==="intro")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:52,marginBottom:12}}>⚡</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Tempo de Reação</h3><p style={{fontSize:13,color:"#6b7280",marginBottom:20,lineHeight:1.6}}>Toque quando aparecer o círculo verde. <strong>Não toque antes!</strong></p><button className="btn-main" style={{background:color}} onClick={()=>{setTrial(0);setTempos([]);setFalsosPos(0);setOmissoes(0);comecar();}}>Começar</button></div>;
  if(fase==="resultado"){
    const media=tempos.length?Math.round(tempos.reduce((a,b)=>a+b,0)/tempos.length):0;
    const desvio=tempos.length>1?Math.round(Math.sqrt(tempos.reduce((a,b)=>a+(b-media)**2,0)/tempos.length)):0;
    const score=Math.max(0,100-Math.round((media-200)/5)-falsosPos*5-omissoes*3);
    return<div style={crd}><div style={{textAlign:"center",marginBottom:16}}><div style={{fontSize:48,marginBottom:8}}>{score>=75?"🏆":score>=50?"🎯":"💪"}</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937"}}>{score>=75?"Excelente!":score>=50?"Muito bem!":"Continue!"}</h3></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[[media+"ms","TR Médio",color],[desvio+"ms","Desvio",color],[tempos.length,"Acertos","#059669"],[falsosPos,"Falsos","#e11d48"]].map(([v,l,c])=><div key={l} style={{background:"#f9fafb",borderRadius:12,padding:10,textAlign:"center"}}><div style={{fontSize:18,fontWeight:900,color:c}}>{v}</div><div style={{fontSize:10,color:"#9ca3af"}}>{l}</div></div>)}
      </div>
      <button className="btn-main" style={{background:color}} onClick={()=>onSubmit({media,desvio,acertos:tempos.length,falsosPos,omissoes,score,tipo:"tr"})}>Salvar resultado</button>
    </div>;
  }
  const bg=feedback==="certo"?"#d1fae5":feedback==="falso"?"#fee2e2":feedback==="omissao"?"#fef3c7":alvoVis?"#d1fae5":"#f9fafb";
  const pct=Math.round((trial/TOTAL)*100);
  return<div onClick={click} style={{cursor:"pointer"}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{trial+1}/{TOTAL}</span><span style={{fontSize:12,fontWeight:700,color}}>{pct}%</span></div>
    <div style={{background:"#f3f4f6",borderRadius:20,height:8,overflow:"hidden",marginBottom:14}}><div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:20}}/></div>
    <div style={{background:bg,borderRadius:16,padding:40,textAlign:"center",minHeight:150,display:"flex",alignItems:"center",justifyContent:"center",transition:"background .15s",marginBottom:12}}>
      {alvoVis&&<div style={{width:100,height:100,borderRadius:"50%",background:"linear-gradient(135deg,#059669,#34d399)",boxShadow:"0 0 40px rgba(5,150,105,.6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:32}}>👆</div>}
      {!alvoVis&&!feedback&&<div style={{textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>⏳</div><p style={{fontSize:14,color:"#9ca3af",fontWeight:700}}>Aguarde...</p></div>}
      {feedback==="certo"&&<div style={{textAlign:"center"}}><div style={{fontSize:52}}>✅</div><div style={{fontSize:22,fontWeight:900,color:"#059669"}}>{ultimoTR}ms</div></div>}
      {feedback==="falso"&&<div style={{textAlign:"center"}}><div style={{fontSize:52}}>⚠️</div><div style={{fontSize:16,fontWeight:800,color:"#e11d48"}}>Muito cedo!</div></div>}
      {feedback==="omissao"&&<div style={{textAlign:"center"}}><div style={{fontSize:52}}>😴</div><div style={{fontSize:16,fontWeight:800,color:"#d97706"}}>Perdeu!</div></div>}
    </div>
  </div>;
}

// Stroop
function StroopForm({color,onSubmit}){
  const TOTAL=24;
  const [fase,setFase]=useState("intro");
  const [trial,setTrial]=useState(0);
  const [item,setItem]=useState(null);
  const [acertos,setAcertos]=useState(0);
  const [erros,setErros]=useState(0);
  const [tempos,setTempos]=useState([]);
  const [feedback,setFeedback]=useState(null);
  const tRef=useRef(null);
  function gerar(){const p=CORES_STROOP[Math.floor(Math.random()*4)];const c=CORES_STROOP[Math.floor(Math.random()*4)];return{palavra:p,cor:c,inicio:Date.now()};}
  function prox(t,a,e,ts){if(t>=TOTAL){onSubmit({acertos:a,erros:e,media:ts.length?Math.round(ts.reduce((x,y)=>x+y,0)/ts.length):0,total:TOTAL,tipo:"stroop"});setFase("fim");return;}setFeedback(null);setTrial(t);setItem(gerar());}
  function responder(c){
    const tr=Date.now()-item.inicio;
    if(c===item.cor){setAcertos(a=>{const nt=[...tempos,tr];setTempos(nt);setFeedback("certo");setTimeout(()=>prox(trial+1,a+1,erros,nt),500);return a+1;});}
    else{setErros(e=>{setFeedback("errado");setTimeout(()=>prox(trial+1,acertos,e+1,tempos),500);return e+1;});}
  }
  if(fase==="fim")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>✅</div><p style={{fontSize:15,fontWeight:700,color:"#6b7280"}}>Respostas enviadas ao terapeuta.</p></div>;
  if(fase==="intro")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:52,marginBottom:12}}>🎨</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Teste de Stroop</h3><p style={{fontSize:13,color:"#6b7280",marginBottom:16,lineHeight:1.6}}>Selecione a <strong>COR DA TINTA</strong>, ignorando o significado da palavra.</p><div style={{background:"#ede9fe",borderRadius:12,padding:14,marginBottom:20}}><p style={{fontSize:28,fontWeight:900,color:"#ef4444",marginBottom:6}}>AZUL</p><p style={{fontSize:13,color:"#6d28d9"}}>Resposta: <strong>Vermelho</strong></p></div><button className="btn-main" style={{background:color}} onClick={()=>prox(0,0,0,[])}>Começar</button></div>;
  const pct=Math.round((trial/TOTAL)*100);
  const bg=feedback==="certo"?"#d1fae5":feedback==="errado"?"#fee2e2":"#f9fafb";
  return<div><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{trial+1}/{TOTAL}</span><span style={{fontSize:12,fontWeight:700,color}}>{pct}%</span></div>
    <div style={{background:"#f3f4f6",borderRadius:20,height:8,overflow:"hidden",marginBottom:14}}><div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:20}}/></div>
    <div style={{background:bg,borderRadius:16,padding:32,textAlign:"center",marginBottom:14,minHeight:100,display:"flex",alignItems:"center",justifyContent:"center",transition:"background .15s"}}>{item&&<div style={{fontSize:42,fontWeight:900,color:CORES_CSS[item.cor]}}>{item.palavra.toUpperCase()}</div>}</div>
    <p style={{textAlign:"center",fontSize:13,fontWeight:700,color:"#9ca3af",marginBottom:10}}>Cor da tinta:</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{CORES_STROOP.map(c=><button key={c} onClick={()=>responder(c)} style={{padding:"12px 0",borderRadius:10,border:`2px solid ${CORES_CSS[c]}`,background:`${CORES_CSS[c]}15`,color:CORES_CSS[c],fontWeight:800,fontSize:14,cursor:"pointer"}}>{c.charAt(0).toUpperCase()+c.slice(1)}</button>)}</div>
    <div style={{display:"flex",justifyContent:"space-around",marginTop:10}}><span style={{fontSize:12,color:"#059669",fontWeight:700}}>✓ {acertos}</span><span style={{fontSize:12,color:"#e11d48",fontWeight:700}}>✗ {erros}</span></div>
  </div>;
}

// TMT
function TMTForm({color,onSubmit}){
  const [parte,setParte]=useState("A");
  const [fase,setFase]=useState("intro");
  const [proximo,setProximo]=useState(0);
  const [erros,setErros]=useState(0);
  const [inicio,setInicio]=useState(null);
  const [tempoA,setTempoA]=useState(null);
  const [posicoes,setPosicoes]=useState([]);
  const [linhas,setLinhas]=useState([]);
  const N=10;
  function gerarPos(){const pos=[];for(let i=0;i<N;i++){let x,y,ok;do{x=8+Math.random()*80;y=8+Math.random()*80;ok=pos.every(p=>Math.hypot(p.x-x,p.y-y)>14);}while(!ok);pos.push({x,y});}return pos;}
  function iniciarParte(p){
    const pos=gerarPos();
    const labels=p==="A"?Array.from({length:N},(_,i)=>`${i+1}`):Array.from({length:N},(_,i)=>i%2===0?`${Math.floor(i/2)+1}`:"ABCDEFGHIJ"[Math.floor(i/2)]);
    setPosicoes(pos.map((p,i)=>({...p,label:labels[i]})));
    setProximo(0);setErros(0);setLinhas([]);setInicio(Date.now());setFase("jogo");
  }
  function tocar(idx){
    if(idx!==proximo){setErros(e=>e+1);return;}
    if(proximo>0)setLinhas(l=>[...l,{from:proximo-1,to:proximo}]);
    if(proximo+1>=N){
      const t=Math.round((Date.now()-inicio)/1000);
      if(parte==="A"){setTempoA(t);setParte("B");setFase("entre");}
      else{onSubmit({tempoA,tempoB:t,erros,tipo:"tmt"});setFase("fim");}
    }else setProximo(p=>p+1);
  }
  if(fase==="fim")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>✅</div><p style={{fontSize:15,fontWeight:700,color:"#6b7280"}}>Respostas enviadas ao terapeuta.</p></div>;
  if(fase==="intro")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:52,marginBottom:12}}>🔢</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Trail Making Test</h3><div style={{background:"#e0f2fe",borderRadius:10,padding:12,marginBottom:8,textAlign:"left"}}><p style={{fontSize:13,fontWeight:700,color:"#0369a1"}}>Parte A: conecte 1→2→3→...→10</p></div><div style={{background:"#fef3c7",borderRadius:10,padding:12,marginBottom:16,textAlign:"left"}}><p style={{fontSize:13,fontWeight:700,color:"#92400e"}}>Parte B: alterne 1→A→2→B→...</p></div><button className="btn-main" style={{background:color}} onClick={()=>iniciarParte("A")}>Começar Parte A</button></div>;
  if(fase==="entre")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>✅</div><h3 style={{fontSize:16,fontWeight:800,color:"#1f2937",marginBottom:4}}>Parte A: {tempoA}s</h3><p style={{fontSize:13,color:"#6b7280",marginBottom:16}}>Agora alterne números e letras</p><button className="btn-main" style={{background:color}} onClick={()=>iniciarParte("B")}>Parte B</button></div>;
  return<div><div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:800,color}}>{parte==="A"?"Parte A — números":"Parte B — alterne"}</span><span style={{fontSize:13,fontWeight:700,color:"#374151"}}>Próximo: <strong style={{color}}>{posicoes[proximo]?.label}</strong></span><span style={{fontSize:12,color:"#e11d48",fontWeight:700}}>✗{erros}</span></div>
    <div style={{position:"relative",width:"100%",paddingBottom:"100%",background:"#f9fafb",borderRadius:16,overflow:"hidden",border:"1px solid #e5e7eb"}}>
      <svg style={{position:"absolute",inset:0,width:"100%",height:"100%"}}>
        {linhas.map((l,i)=>{const f=posicoes[l.from],t=posicoes[l.to];return<line key={i} x1={`${f.x}%`} y1={`${f.y}%`} x2={`${t.x}%`} y2={`${t.y}%`} stroke={color} strokeWidth="2.5" strokeLinecap="round"/>;  })}
        {posicoes.map((p,i)=>{const done=i<proximo,next=i===proximo;return<g key={i}><circle cx={`${p.x}%`} cy={`${p.y}%`} r="5.5%" fill={done?color:next?`${color}20`:"#fff"} stroke={next?color:"#d1d5db"} strokeWidth={next?"2.5":"1.5"} style={{cursor:"pointer"}} onClick={()=>tocar(i)}/><text x={`${p.x}%`} y={`${p.y}%`} textAnchor="middle" dominantBaseline="middle" fontSize="3.5%" fontWeight="800" fill={done?"#fff":next?color:"#374151"} style={{pointerEvents:"none"}}>{p.label}</text></g>;  })}
      </svg>
    </div>
  </div>;
}

// N-Back
function NBackForm({color,onSubmit}){
  const N=2,TOTAL=25;
  const [fase,setFase]=useState("intro");
  const [seq,setSeq]=useState([]);
  const [pos,setPos]=useState(0);
  const [mostrando,setMostrando]=useState(false);
  const [acertos,setAcertos]=useState(0);
  const [erros,setErros]=useState(0);
  const [omissoes,setOmissoes]=useState(0);
  const tRef=useRef(null);
  const stateRef=useRef({pos:0,acertos:0,erros:0,omissoes:0,seq:[]});
  function gerar(){const s=Array.from({length:TOTAL},()=>LETRAS_NBACK[Math.floor(Math.random()*LETRAS_NBACK.length)]);for(let i=N;i<TOTAL;i++)if(Math.random()<.3)s[i]=s[i-N];return s;}
  function rodar(s,i,a,e,om){
    if(i>=TOTAL){onSubmit({acertos:a,erros:e,omissoes:om,total:TOTAL,tipo:"nback"});setFase("fim");return;}
    stateRef.current={pos:i,acertos:a,erros:e,omissoes:om,seq:s};
    setPos(i);setMostrando(true);setFase("jogo");
    tRef.current=setTimeout(()=>{
      setMostrando(false);
      if(i>=N&&s[i]===s[i-N]){const no=om+1;stateRef.current.omissoes=no;setOmissoes(no);setTimeout(()=>rodar(s,i+1,a,e,no),500);}
      else setTimeout(()=>rodar(s,i+1,a,e,om),500);
    },1500);
  }
  function responder(){
    const {pos:i,acertos:a,erros:e,omissoes:om,seq:s}=stateRef.current;
    if(!mostrando||i<N)return;
    clearTimeout(tRef.current);setMostrando(false);
    if(s[i]===s[i-N]){const na=a+1;stateRef.current.acertos=na;setAcertos(na);setTimeout(()=>rodar(s,i+1,na,e,om),400);}
    else{const ne=e+1;stateRef.current.erros=ne;setErros(ne);setTimeout(()=>rodar(s,i+1,a,ne,om),400);}
  }
  function iniciar(){const s=gerar();setSeq(s);setAcertos(0);setErros(0);setOmissoes(0);rodar(s,0,0,0,0);}
  useEffect(()=>()=>clearTimeout(tRef.current),[]);
  if(fase==="fim")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>✅</div><p style={{fontSize:15,fontWeight:700,color:"#6b7280"}}>Respostas enviadas ao terapeuta.</p></div>;
  if(fase==="intro")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:52,marginBottom:12}}>🧩</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>N-Back (2-Back)</h3><p style={{fontSize:13,color:"#6b7280",lineHeight:1.6,marginBottom:16}}>Pressione quando a letra atual for <strong>igual à de 2 posições atrás</strong>.</p><div style={{background:"#fef3c7",borderRadius:12,padding:14,marginBottom:16}}><div style={{display:"flex",gap:6,justifyContent:"center"}}>{["B","K","B","L","B"].map((l,i)=><div key={i} style={{width:34,height:34,borderRadius:8,background:i===4?"#d97706":"#fff",border:"2px solid #f59e0b",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,color:i===4?"#fff":"#374151"}}>{l}</div>)}</div><p style={{fontSize:12,color:"#92400e",marginTop:6}}>5ª letra = 3ª → pressione!</p></div><button className="btn-main" style={{background:color}} onClick={iniciar}>Começar</button></div>;
  const pct=Math.round((pos/TOTAL)*100);
  return<div><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{pos+1}/{TOTAL}</span><span style={{fontSize:12,fontWeight:700,color}}>{pct}%</span></div>
    <div style={{background:"#f3f4f6",borderRadius:20,height:8,overflow:"hidden",marginBottom:14}}><div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:20}}/></div>
    <div style={{background:"#fff",borderRadius:16,padding:32,textAlign:"center",marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,.06)",minHeight:120,display:"flex",alignItems:"center",justifyContent:"center"}}>
      {mostrando?<div style={{fontSize:64,fontWeight:900,color}}>{seq[pos]}</div>:<div style={{fontSize:32,color:"#d1d5db"}}>?</div>}
    </div>
    <button onClick={responder} disabled={!mostrando||pos<N} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:mostrando&&pos>=N?`linear-gradient(135deg,${color},${color}cc)`:"#e5e7eb",color:mostrando&&pos>=N?"#fff":"#9ca3af",fontWeight:700,fontSize:15,cursor:mostrando&&pos>=N?"pointer":"default"}}>✓ É igual ao de 2 atrás!</button>
    <div style={{display:"flex",justifyContent:"space-around",marginTop:10}}><span style={{fontSize:12,color:"#059669",fontWeight:700}}>✓{acertos}</span><span style={{fontSize:12,color:"#e11d48",fontWeight:700}}>✗{erros}</span><span style={{fontSize:12,color:"#d97706",fontWeight:700}}>○{omissoes}</span></div>
  </div>;
}

// Go/No-Go
function GoNoGoForm({color,onSubmit}){
  const TOTAL=30;
  const [fase,setFase]=useState("intro");
  const [trial,setTrial]=useState(0);
  const [stim,setStim]=useState(null);
  const [acertos,setAcertos]=useState(0);
  const [falsosGo,setFalsosGo]=useState(0);
  const [omissoes,setOmissoes]=useState(0);
  const [tempos,setTempos]=useState([]);
  const [feedback,setFeedback]=useState(null);
  const tRef=useRef(null);
  const iniRef=useRef(null);
  const stateRef=useRef({trial:0,acertos:0,falsosGo:0,omissoes:0,tempos:[]});
  function prox(t,a,fg,om,ts){
    if(t>=TOTAL){onSubmit({acertos:a,falsosGo:fg,omissoes:om,mediaTempos:ts.length?Math.round(ts.reduce((x,y)=>x+y,0)/ts.length):0,total:TOTAL,tipo:"gonogo"});setFase("fim");return;}
    setFeedback(null);const isGo=Math.random()<.7;setStim(isGo?"🟢":"🔴");iniRef.current=Date.now();setTrial(t);
    stateRef.current={trial:t,acertos:a,falsosGo:fg,omissoes:om,tempos:ts,isGo};
    tRef.current=setTimeout(()=>{
      if(isGo){const no=om+1;stateRef.current.omissoes=no;setOmissoes(no);setFeedback("omissao");setTimeout(()=>prox(t+1,a,fg,no,ts),600);}
      else{setFeedback("correto_nogo");setTimeout(()=>prox(t+1,a,fg,om,ts),600);}
    },1000);
  }
  function responder(){
    clearTimeout(tRef.current);
    const{trial:t,acertos:a,falsosGo:fg,omissoes:om,tempos:ts,isGo}=stateRef.current;
    const tr=Date.now()-iniRef.current;
    if(isGo){const na=a+1,nt=[...ts,tr];stateRef.current.acertos=na;setAcertos(na);setTempos(nt);setFeedback("certo");setTimeout(()=>prox(t+1,na,fg,om,nt),600);}
    else{const nf=fg+1;stateRef.current.falsosGo=nf;setFalsosGo(nf);setFeedback("falso");setTimeout(()=>prox(t+1,a,nf,om,ts),600);}
  }
  useEffect(()=>()=>clearTimeout(tRef.current),[]);
  if(fase==="fim")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>✅</div><p style={{fontSize:15,fontWeight:700,color:"#6b7280"}}>Respostas enviadas ao terapeuta.</p></div>;
  if(fase==="intro")return<div style={{...crd,textAlign:"center"}}><div style={{fontSize:52,marginBottom:12}}>🚦</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Go / No-Go</h3><div style={{display:"flex",gap:10,marginBottom:20}}><div style={{flex:1,background:"#d1fae5",borderRadius:12,padding:14}}><div style={{fontSize:28}}>🟢</div><div style={{fontSize:13,fontWeight:700,color:"#065f46",marginTop:4}}>GO — Toque!</div></div><div style={{flex:1,background:"#fee2e2",borderRadius:12,padding:14}}><div style={{fontSize:28}}>🔴</div><div style={{fontSize:13,fontWeight:700,color:"#991b1b",marginTop:4}}>NO-GO — Aguarde!</div></div></div><button className="btn-main" style={{background:color}} onClick={()=>prox(0,0,0,0,[])}>Começar</button></div>;
  const pct=Math.round((trial/TOTAL)*100);
  const bg=feedback==="certo"?"#d1fae5":feedback==="falso"?"#fee2e2":feedback==="omissao"?"#fef3c7":feedback==="correto_nogo"?"#d1fae5":"#f9fafb";
  return<div onClick={responder}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{trial+1}/{TOTAL}</span><span style={{fontSize:12,fontWeight:700,color}}>{pct}%</span></div>
    <div style={{background:"#f3f4f6",borderRadius:20,height:8,overflow:"hidden",marginBottom:14}}><div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:20}}/></div>
    <div style={{background:bg,borderRadius:16,padding:40,textAlign:"center",minHeight:150,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"background .15s",marginBottom:10}}>
      {stim&&!feedback?<div style={{fontSize:80}}>{stim}</div>
      :feedback==="certo"?<div><div style={{fontSize:48}}>✅</div><div style={{fontWeight:800,color:"#059669"}}>Ótimo!</div></div>
      :feedback==="falso"?<div><div style={{fontSize:48}}>⚠️</div><div style={{fontWeight:800,color:"#e11d48"}}>Não era pra tocar!</div></div>
      :feedback==="omissao"?<div><div style={{fontSize:48}}>😴</div><div style={{fontWeight:800,color:"#d97706"}}>Perdeu!</div></div>
      :feedback==="correto_nogo"?<div><div style={{fontSize:48}}>🛑</div><div style={{fontWeight:800,color:"#059669"}}>Correto!</div></div>
      :<div style={{fontSize:32,color:"#d1d5db"}}>⏳</div>}
    </div>
    <div style={{display:"flex",justifyContent:"space-around"}}><span style={{fontSize:12,color:"#059669",fontWeight:700}}>✓{acertos}</span><span style={{fontSize:12,color:"#e11d48",fontWeight:700}}>✗{falsosGo}</span><span style={{fontSize:12,color:"#d97706",fontWeight:700}}>○{omissoes}</span></div>
  </div>;
}

  const TARGETS=["quadrado","triangulo"];
  function getDiff(p){if(p===1)return{cols:5,rows:6,ratio:.35,size:38};if(p===2)return{cols:6,rows:7,ratio:.30,size:33};if(p===3)return{cols:6,rows:8,ratio:.25,size:30};if(p===4)return{cols:7,rows:8,ratio:.22,size:27};return{cols:7,rows:9,ratio:.20,size:24};}
  function drawShape(type,color,size){const s=size;if(type==="quadrado")return`<rect x="2" y="2" width="${s-4}" height="${s-4}" rx="3" fill="${color}"/>`;if(type==="circulo")return`<circle cx="${s/2}" cy="${s/2}" r="${s/2-2}" fill="${color}"/>`;if(type==="triangulo")return`<polygon points="${s/2},2 ${s-2},${s-2} 2,${s-2}" fill="${color}"/>`;if(type==="losango")return`<polygon points="${s/2},2 ${s-2},${s/2} ${s/2},${s-2} 2,${s/2}" fill="${color}"/>`;const cx=s/2,cy=s/2,r1=s/2-2,r2=s/4;let pts="";for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2===0?r1:r2;pts+=`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} `;}return`<polygon points="${pts}" fill="${color}"/>`;}
  function buildPage(page){
    pageClickedRef.current=new Set();
    const d=getDiff(page);const total=d.cols*d.rows;const nT=Math.max(4,Math.floor(total*d.ratio));
    const arr=[];for(let i=0;i<nT;i++)arr.push(TARGETS[i%2]);
    while(arr.length<total)arr.push(SHAPES.filter(s=>!TARGETS.includes(s))[Math.floor(Math.random()*3)]);
    arr.sort(()=>Math.random()-.5);
    pageTargetsRef.current=nT;targetsRef.current+=nT;
    setItems(arr.map((type,i)=>({type,i,color:COLORS[Math.floor(Math.random()*COLORS.length)],size:d.size+Math.floor(Math.random()*8)-4,cols:d.cols,state:"idle"})));
    setCurrentPage(page);window.scrollTo(0,0);
  }
  function startGame(){
    scoreRef.current=0;missesRef.current=0;targetsRef.current=0;timeRef.current=40;pageRef.current=1;
    setTotalScore(0);setTotalMisses(0);setTimeLeft(40);setCurrentPage(1);
    buildPage(1);setFase("game");
    timerRef.current=setInterval(()=>{timeRef.current--;setTimeLeft(timeRef.current);if(timeRef.current<=0)endGame();},1000);
  }
  function handleClick(idx,type){
    if(pageClickedRef.current.has(idx))return;
    pageClickedRef.current.add(idx);
    if(TARGETS.includes(type)){
      scoreRef.current++;setTotalScore(scoreRef.current);
      setItems(prev=>prev.map((it,i)=>i===idx?{...it,state:"correct"}:it));
      const pa=[...pageClickedRef.current].filter(i=>{const it=items[i];return it&&TARGETS.includes(it.type);}).length;
      if(pa+1>=pageTargetsRef.current)setTimeout(()=>doPageTurn(),300);
    }else{missesRef.current++;setTotalMisses(missesRef.current);setItems(prev=>prev.map((it,i)=>i===idx?{...it,state:"wrong"}:it));}
  }
  function doPageTurn(){
    if(timeRef.current<=0)return;
    setShowTurn(true);const next=pageRef.current+1;pageRef.current=next;
    setTimeout(()=>{buildPage(next);setTimeout(()=>setShowTurn(false),500);},400);
  }
  function endGame(){
    clearInterval(timerRef.current);
    const precisao=(scoreRef.current+missesRef.current)>0?Math.round(scoreRef.current/(scoreRef.current+missesRef.current)*100):0;
    setResult({paginas:pageRef.current,acertos:scoreRef.current,erros:missesRef.current,precisao});
    setFase("result");
  }
  const cols=items[0]?.cols||5;const urgent=timeLeft<=10;
  if(fase==="intro")return<div style={{...crd,textAlign:"center"}}>
    <div style={{fontSize:52,marginBottom:12}}>🎯</div>
    <h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Teste de Atenção</h3>
    <p style={{fontSize:13,color:"#6b7280",marginBottom:20,lineHeight:1.6}}>Toque em todos os <strong>quadrados</strong> e <strong>triângulos</strong>!</p>
    <div style={{display:"flex",justifyContent:"center",gap:24,marginBottom:20}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}><svg width="48" height="48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#6d28d9"/></svg><span style={{fontSize:11,fontWeight:700}}>Quadrado ✅</span></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}><svg width="48" height="48"><polygon points="24,4 46,44 2,44" fill="#0891b2"/></svg><span style={{fontSize:11,fontWeight:700}}>Triângulo ✅</span></div>
    </div>
    <div style={{background:"#fef3c7",borderRadius:10,padding:12,fontSize:13,color:"#92400e",fontWeight:600,marginBottom:20}}>⏱ <strong>40 segundos</strong></div>
    <button className="btn-main" style={{background:color}} onClick={startGame}>Começar!</button>
  </div>;
  if(fase==="result")return<div style={crd}>
    <div style={{textAlign:"center",marginBottom:16}}><div style={{fontSize:48,marginBottom:8}}>{result.precisao>=80?"🏆":result.precisao>=60?"🎉":"💪"}</div><h3 style={{fontSize:18,fontWeight:800,color:"#1f2937"}}>{result.precisao>=80?"Excelente!":result.precisao>=60?"Muito bem!":"Continue!"}</h3></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      {[[result.paginas,"Páginas","#6d28d9"],[result.acertos,"Acertos","#059669"],[result.erros,"Erros","#e11d48"],[`${result.precisao}%`,"Precisão","#0891b2"]].map(([v,l,c])=><div key={l} style={{background:"#f9fafb",borderRadius:12,padding:12,textAlign:"center"}}><div style={{fontSize:24,fontWeight:900,color:c}}>{v}</div><div style={{fontSize:11,color:"#888"}}>{l}</div></div>)}
    </div>
    <button className="btn-main" style={{background:color,marginBottom:8}} onClick={()=>onSubmit(result)}>Salvar</button>
    <button style={{...btn("#e5e7eb"),width:"100%"}} onClick={startGame}>Tentar novamente</button>
  </div>;
  return<div style={{position:"relative"}}>
    {showTurn&&<div style={{position:"fixed",inset:0,zIndex:100,pointerEvents:"none",overflow:"hidden"}}>
      <div style={{position:"absolute",inset:0,background:"linear-gradient(to right,#fafafa,#fff)",animation:"slideOut .9s cubic-bezier(.77,0,.18,1) forwards"}}/>
      <div style={{position:"absolute",inset:0,background:"#fff",transform:"translateX(100%)",animation:"slideIn .9s cubic-bezier(.77,0,.18,1) forwards"}}/>
    </div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 4px",marginBottom:8}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:26,fontWeight:900,color:urgent?"#e11d48":"#6d28d9"}}>{timeLeft}</div><div style={{fontSize:10,color:"#aaa"}}>seg</div></div>
      <div style={{background:"#ede9fe",color:"#6d28d9",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:800}}>Página {currentPage}</div>
      <div style={{textAlign:"right"}}><div style={{fontSize:20,fontWeight:800,color:"#059669"}}>{totalScore}</div><div style={{fontSize:10,color:"#aaa"}}>acertos</div><div style={{fontSize:12,fontWeight:700,color:"#e11d48"}}>{totalMisses} erro(s)</div></div>
    </div>
    <div style={{background:"#ede9fe",borderRadius:10,padding:"7px 12px",marginBottom:10,fontSize:12,color:"#5b21b6",fontWeight:600,textAlign:"center"}}>Toque nos <strong>quadrados</strong> e <strong>triângulos</strong>!</div>
    <div style={{display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gap:6}}>
      {items.map((it,idx)=><button key={idx} onClick={()=>handleClick(idx,it.type)} style={{background:it.state==="correct"?"#d1fae5":it.state==="wrong"?"#fee2e2":"transparent",border:"none",cursor:"pointer",padding:2,borderRadius:8,aspectRatio:"1",opacity:it.state==="missed"?.35:1,transition:"background .2s"}}>
        <svg width={it.size} height={it.size} dangerouslySetInnerHTML={{__html:drawShape(it.type,it.color,it.size)}}/>
      </button>)}
    </div>
  </div>;
}

// ── Response View (somente terapeuta) ──
function ResponseView({response,type}){
  if(!response)return null;
  const items=[];
  if(type==="pensamentos")items.push(["Situação",response.situacao],["Pensamento",response.pensamento],["Emoção",response.emocao],["Intensidade",`${response.intensidade}/10`],["Alternativo",response.pensamentoAlternativo]);
  if(type==="atencao")items.push(["Páginas",response.paginas],["Acertos",response.acertos],["Erros",response.erros],["Precisão",`${response.precisao}%`]);
  if(type==="experimento")items.push(["Hipótese",response.hipotese],["Ação",response.acao],["Resultado",response.resultado],["Aprendizado",response.aprendizado]);
  if(type==="escala"){ESCALAS_DEF.forEach(s=>items.push([s.nome,`${response[s.id]}%`]));if(response.obs)items.push(["Obs",response.obs]);}
  if(["csai2r","sas","acsi28"].includes(type)&&response.totais){
    const ed=getEscalaData(type);if(!ed)return null;
    return<div style={{display:"flex",flexDirection:"column",gap:8}}>{Object.entries(ed.subescalas).map(([key,info])=>{const total=response.totais[key]||0;const contagem=ed.itens.filter(i=>i.sub===key).length;const max=contagem*ed.escala.length;const pct=max>0?Math.round((total/max)*100):0;return<div key={key} style={{background:"#f9fafb",borderRadius:10,padding:12}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{info.nome}</span><span style={{fontSize:13,fontWeight:800,color:info.cor}}>{total}/{max}</span></div><div style={{background:"#e5e7eb",borderRadius:20,height:8,overflow:"hidden"}}><div style={{width:`${pct}%`,background:info.cor,height:"100%",borderRadius:20}}/></div><div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{pct}%</div></div>;})}</div>;
  }
  return<div style={{display:"flex",flexDirection:"column",gap:6}}>{items.filter(([,v])=>v!=null&&v!=="").map(([k,v])=><div key={k} style={{fontSize:13,padding:"8px 12px",background:"#f9fafb",borderRadius:10}}><strong style={{color:"#374151"}}>{k}:</strong> <span style={{color:"#555"}}>{v}</span></div>)}</div>;
}

// ── Exportar CSV ──
function exportarCSV(patient){
  function toCSV(rows){return rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(",")).join("\n");}
  function download(nome,conteudo){const blob=new Blob(["\uFEFF"+conteudo],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();URL.revokeObjectURL(a.href);}
  let csv="";
  csv+="RESUMO\n"+toCSV([["Campo","Valor"],["Paciente",patient.name],["Data de exportação",new Date().toLocaleDateString("pt-BR")],["Registros no diário",(patient.diarios||[]).length]])+"\n\n";
  const esc=patient.escalaResp;
  if(esc){csv+="ESCALA DE BEM-ESTAR\n"+toCSV([["Dimensão","Valor (%)"],["Humor",esc.humor],["Ansiedade",esc.ansiedade],["Sono",esc.sono],["Estresse",esc.estresse],["Tristeza",esc.tristeza]])+"\n\n";}
  if(patient.csai2r){const t=patient.csai2r;csv+="CSAI-2R\n"+toCSV([["Subescala","Pontuação","Máximo","% do Máximo"],["Ansiedade Cognitiva",t.cognitiva,32,Math.round((t.cognitiva/32)*100)],["Ansiedade Somática",t.somatica,28,Math.round((t.somatica/28)*100)],["Autoconfiança",t.autoconfianca,20,Math.round((t.autoconfianca/20)*100)]])+"\n\n";}
  if(patient.sas){const t=patient.sas;csv+="SAS\n"+toCSV([["Subescala","Pontuação","Máximo","% do Máximo"],["Ansiedade Somática",t.somatica,28,Math.round((t.somatica/28)*100)],["Preocupação",t.preocupacao,28,Math.round((t.preocupacao/28)*100)],["Perturbação da Concentração",t.concentracao,28,Math.round((t.concentracao/28)*100)]])+"\n\n";}
  if(patient.acsi28){const t=patient.acsi28;csv+="ACSI-28\n"+toCSV([["Subescala","Pontuação","Máximo","% do Máximo"],["Coping com Adversidade",t.adversidade,16,Math.round((t.adversidade/16)*100)],["Rendimento sob Pressão",t.pressao,16,Math.round((t.pressao/16)*100)],["Metas e Preparação",t.metas,16,Math.round((t.metas/16)*100)],["Concentração",t.concentracao,16,Math.round((t.concentracao/16)*100)],["Ausência de Preocupação",t.preocupacao,16,Math.round((t.preocupacao/16)*100)],["Confiança e Motivação",t.confianca,16,Math.round((t.confianca/16)*100)],["Treinabilidade",t.treinabilidade,16,Math.round((t.treinabilidade/16)*100)]])+"\n\n";}
  if((patient.diarios||[]).length){csv+="DIÁRIO DE EMOÇÕES\n"+toCSV([["Emoção","Intensidade","Data","Horário","Contexto","Pensamento"],...(patient.diarios||[]).map(d=>[d.emocao,d.intensidade,d.data||"—",d.hora||"—",d.contexto||"—",d.pensamento||"—"])]);}
  download(`MeuPsi_${patient.name.replace(/\s+/g,"_")}_${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.csv`,csv);
}

// ── Radar Chart ──
function RadarChart({labels,values,colors,size=220}){
  const cx=size/2,cy=size/2+10,r=size/2-45,n=labels.length;
  const angle=i=>((2*Math.PI*i)/n)-Math.PI/2;
  const pt=(i,radius)=>({x:cx+radius*Math.cos(angle(i)),y:cy+radius*Math.sin(angle(i))});
  const norm=values.map(v=>Math.min(100,Math.max(0,v)));
  const polyPts=norm.map((v,i)=>{const p=pt(i,r*(v/100));return`${p.x},${p.y}`;}).join(" ");
  return(
    <svg width={size} height={size+10} style={{overflow:"visible",display:"block",margin:"0 auto"}}>
      {[20,40,60,80,100].map(g=><polygon key={g} points={Array.from({length:n},(_,i)=>{const p=pt(i,r*(g/100));return`${p.x},${p.y}`;}).join(" ")} fill="none" stroke="#e5e7eb" strokeWidth="1"/>)}
      {Array.from({length:n},(_,i)=>{const p=pt(i,r);return<line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#e5e7eb" strokeWidth="1"/>;  })}
      <polygon points={polyPts} fill={`${colors[0]}25`} stroke={colors[0]} strokeWidth="2.5" strokeLinejoin="round"/>
      {norm.map((v,i)=>{const p=pt(i,r*(v/100));return<circle key={i} cx={p.x} cy={p.y} r="4" fill={colors[i]||colors[0]} stroke="#fff" strokeWidth="2"/>;  })}
      {labels.map((l,i)=>{const p=pt(i,r+22);const anchor=p.x<cx-5?"end":p.x>cx+5?"start":"middle";return<text key={i} x={p.x} y={p.y} textAnchor={anchor} fontSize="10" fontWeight="700" fill="#374151">{l}</text>;  })}
    </svg>
  );
}

      <div style={{...crd,marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:800,color:"#6d28d9",marginBottom:2}}>📋 CSAI-2R</div>
        <div style={{fontSize:12,color:"#9ca3af",marginBottom:10}}>Ansiedade cognitiva, somática e autoconfiança</div>
        {csaiResp?<RadarChart labels={["Ans. Cognitiva","Ans. Somática","Autoconfiança"]} values={csaiValues} colors={["#6d28d9","#e11d48","#059669"]} size={200}/>:<EmptyState icon="📋" text="CSAI-2R não respondido ainda."/>}
      </div>
      {/* ACSI-28 */}
      <div style={crd}>
        <div style={{fontSize:14,fontWeight:800,color:"#059669",marginBottom:2}}>📋 ACSI-28</div>
        <div style={{fontSize:12,color:"#9ca3af",marginBottom:10}}>7 subescalas de habilidades de coping</div>
        {acsiResp?<RadarChart labels={["Adversid.","Pressão","Metas","Concentr.","Preocup.","Confiança","Treinab."]} values={acsiValues} colors={["#ef4444","#f97316","#eab308","#22c55e","#06b6d4","#8b5cf6","#ec4899"]} size={240}/>:<EmptyState icon="📋" text="ACSI-28 não respondido ainda."/>}
      </div>
    </div>}

    {subTab==="escalas"&&<div>
      <div style={{...crd,marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:800,color:"#6d28d9",marginBottom:12}}>📋 CSAI-2R</div>
        {csaiResp?<><MiniBar label="Ansiedade Cognitiva" value={csaiResp.cognitiva} max={32} color="#6d28d9"/><MiniBar label="Ansiedade Somática" value={csaiResp.somatica} max={28} color="#e11d48"/><MiniBar label="Autoconfiança" value={csaiResp.autoconfianca} max={20} color="#059669"/></>:<p style={{fontSize:13,color:"#9ca3af"}}>Nenhuma resposta ainda.</p>}
      </div>
      <div style={{...crd,marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:800,color:"#0891b2",marginBottom:12}}>📋 SAS</div>
        {sasResp?<><MiniBar label="Ansiedade Somática" value={sasResp.somatica} max={28} color="#e11d48"/><MiniBar label="Preocupação" value={sasResp.preocupacao} max={28} color="#d97706"/><MiniBar label="Perturbação Concentração" value={sasResp.concentracao} max={28} color="#7c3aed"/></>:<p style={{fontSize:13,color:"#9ca3af"}}>Nenhuma resposta ainda.</p>}
      </div>
      <div style={crd}>
        <div style={{fontSize:14,fontWeight:800,color:"#059669",marginBottom:12}}>📋 ACSI-28</div>
        {acsiResp?[["adversidade","Coping Adversidade","#ef4444",16],["pressao","Pressão","#f97316",16],["metas","Metas","#eab308",16],["concentracao","Concentração","#22c55e",16],["preocupacao","Preocupação","#06b6d4",16],["confianca","Confiança","#8b5cf6",16],["treinabilidade","Treinabilidade","#ec4899",16]].map(([k,l,c,m])=><MiniBar key={k} label={l} value={acsiResp[k]||0} max={m} color={c}/>):<p style={{fontSize:13,color:"#9ca3af"}}>Nenhuma resposta ainda.</p>}
      </div>
    </div>}

    {subTab==="emocoes"&&<div>
      <div style={{...crd,marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:800,color:"#1f2937",marginBottom:4}}>😊 Frequência das Emoções</div>
        <div style={{fontSize:12,color:"#9ca3af",marginBottom:12}}>{diarios.length} registro(s) no diário</div>
        {diarios.length===0?<EmptyState icon="📔" text="Nenhum registro no diário ainda."/>:
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {emoSorted.map(([nome,count])=><div key={nome} style={{display:"flex",alignItems:"center",gap:5,background:"#f9fafb",borderRadius:20,padding:"5px 10px"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:ECORES[nome]||"#888",flexShrink:0}}/>
            <span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{nome}</span>
            <span style={{fontSize:11,color:"#9ca3af"}}>{Math.round((count/diarios.length)*100)}%</span>
          </div>)}
        </div>}
      </div>
      {diarios.length>0&&<div style={{...crd,marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:800,color:"#1f2937",marginBottom:12}}>📈 Intensidade Média</div>
        {Object.entries(diarios.reduce((acc,d)=>{if(!acc[d.emocao])acc[d.emocao]={total:0,count:0};acc[d.emocao].total+=d.intensidade;acc[d.emocao].count++;return acc;},{})).map(([nome,{total,count}])=>(
          <MiniBar key={nome} label={nome} value={Math.round((total/count)*10)} max={100} color={ECORES[nome]||"#888"}/>
        ))}
      </div>}
      {escResp&&<div style={crd}>
        <div style={{fontSize:14,fontWeight:800,color:"#1f2937",marginBottom:12}}>📊 Escala de Bem-Estar</div>
        {[["humor","Humor","#f59e0b"],["ansiedade","Ansiedade","#8b5cf6"],["sono","Sono","#3b82f6"],["estresse","Estresse","#ef4444"],["tristeza","Tristeza","#60a5fa"]].map(([k,l,c])=><MiniBar key={k} label={l} value={escResp[k]} max={100} color={c}/>)}
      </div>}
    </div>}
  </div>;
}
function ConfigTab({role,patientId,onLogout}){
  const [oldPass,setOldPass]=useState("");
  const [newPass,setNewPass]=useState("");
  const [confirmPass,setConfirmPass]=useState("");
  const [msg,setMsg]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  async function changePass(){
    setMsg("");setErr("");
    if(!oldPass||!newPass||!confirmPass){setErr("Preencha todos os campos.");return;}
    if(newPass!==confirmPass){setErr("A nova senha e a confirmação não coincidem.");return;}
    if(newPass.length<4){setErr("A nova senha deve ter pelo menos 4 caracteres.");return;}
    setLoading(true);
    try{
      if(role==="therapist"){
        const d=await fbGet("therapist");
        const stored=d?.password||"1234";
        if(oldPass!==stored){setErr("Senha atual incorreta.");setLoading(false);return;}
        await fbSet("therapist",{...d,password:newPass});
        setMsg("✅ Senha do terapeuta alterada com sucesso!");
      }else{
        const p=await fbGet(`patients/${patientId}`);
        if(!p){setErr("Paciente não encontrado.");setLoading(false);return;}
        if(oldPass!==(p.password||"1234")){setErr("Senha atual incorreta.");setLoading(false);return;}
        await fbUpdate(`patients/${patientId}`,{password:newPass});
        setMsg("✅ Sua senha foi alterada com sucesso!");
      }
      setOldPass("");setNewPass("");setConfirmPass("");
    }catch(e){setErr("Erro ao alterar senha. Tente novamente.");}
    setLoading(false);
  }

  return<div>
    <h2 style={h2s}>⚙️ Configurações</h2>
    <div style={crd}>
      <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937",marginBottom:4}}>🔑 Alterar Senha</h3>
      <p style={{fontSize:12,color:"#9ca3af",marginBottom:16}}>{role==="therapist"?"Altere a senha de acesso do terapeuta":"Altere sua senha de acesso"}</p>
      <label style={lbl}>Senha atual</label>
      <input type="password" className="inp" value={oldPass} onChange={e=>setOldPass(e.target.value)} placeholder="Digite a senha atual"/>
      <label style={lbl}>Nova senha</label>
      <input type="password" className="inp" value={newPass} onChange={e=>setNewPass(e.target.value)} placeholder="Digite a nova senha"/>
      <label style={lbl}>Confirmar nova senha</label>
      <input type="password" className="inp" value={confirmPass} onChange={e=>setConfirmPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&changePass()} placeholder="Repita a nova senha"/>
      {err&&<div style={{background:"#fee2e2",borderRadius:10,padding:"10px 14px",marginBottom:10,fontSize:13,color:"#e11d48",fontWeight:600}}>{err}</div>}
      {msg&&<div style={{background:"#d1fae5",borderRadius:10,padding:"10px 14px",marginBottom:10,fontSize:13,color:"#065f46",fontWeight:600}}>{msg}</div>}
      <button className="btn-main" onClick={changePass} disabled={loading}>{loading?"Salvando...":"Alterar Senha"}</button>
    </div>
    <div style={{...crd,marginTop:14}}>
      <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937",marginBottom:4}}>🚪 Sair</h3>
      <p style={{fontSize:12,color:"#9ca3af",marginBottom:14}}>Encerrar sessão atual</p>
      <button onClick={onLogout} style={{...btn("#fee2e2"),width:"100%",padding:"12px 0"}}>Sair do app</button>
    </div>
  </div>;
}

// ── Root ──
function App(){
  const [ready,setReady]=useState(window._firebaseReady||false);
  const [session,setSession]=useState({role:null,patientId:null});
  useEffect(()=>{if(!ready){const h=()=>setReady(true);window.addEventListener("firebaseReady",h);return()=>window.removeEventListener("firebaseReady",h);}},[ready]);
  if(!ready)return<div style={{minHeight:"100vh",background:"linear-gradient(160deg,#1e1b4b,#4c1d95,#0c4a6e)",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{color:"#fff",textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>🧠</div><div style={{fontSize:16,fontWeight:700}}>MeuPsi</div><div style={{fontSize:13,marginTop:8,opacity:.8}}>Conectando...</div></div></div>;
  if(!session.role)return<LoginScreen onLogin={(role,pid)=>setSession({role,patientId:pid})}/>;
  if(session.role==="therapist")return<TherapistApp onLogout={()=>setSession({role:null,patientId:null})}/>;
  return<PatientApp patientId={session.patientId} onLogout={()=>setSession({role:null,patientId:null})}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
