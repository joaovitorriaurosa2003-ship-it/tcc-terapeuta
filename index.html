<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC Terapeuta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; max-width: 480px; margin: 0 auto; }
    input, textarea, select, button { font-family: inherit; font-size: 16px; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
<div id="root"><div style="min-height:100vh;background:linear-gradient(135deg,#6d28d9,#0ea5e9);display:flex;align-items:center;justify-content:center"><div style="color:#fff;text-align:center"><div style="font-size:40px;margin-bottom:12px">🧠</div><div style="font-size:16px;font-weight:700">TCC Terapeuta</div><div style="font-size:13px;margin-top:8px;opacity:.8">Carregando...</div></div></div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDrQDc6-GANiIcU_Eg2X5J7XMLRQwh7UQo",
    authDomain: "meupsi-91fad.firebaseapp.com",
    projectId: "meupsi-91fad",
    storageBucket: "meupsi-91fad.firebasestorage.app",
    messagingSenderId: "70457582233",
    appId: "1:70457582233:web:4114186b782d888d9e8e08",
    databaseURL: "https://terapeutaj-rosa-default-rtdb.firebaseio.com"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window._db=db; window._ref=ref; window._set=set; window._get=get; window._update=update; window._onValue=onValue;
  window._firebaseReady=true; window.dispatchEvent(new Event("firebaseReady"));
</script>

<script type="text/babel" data-presets="react">
  const { useState, useEffect } = React;

  const TASK_TYPES = [
    { id:"diario", label:"📔 Diário de Emoções", color:"#7c3aed" },
    { id:"pensamentos", label:"💭 Pensamentos Automáticos", color:"#0891b2" },
    { id:"atencao", label:"🎯 Teste de Atenção", color:"#d97706" },
    { id:"experimento", label:"🔬 Experimento Comportamental", color:"#059669" },
    { id:"escala", label:"📊 Escala de Humor/Ansiedade", color:"#e11d48" },
  ];
  function getTypeInfo(id) { return TASK_TYPES.find(t=>t.id===id)||{}; }

  async function fbGet(path) { const s=await window._get(window._ref(window._db,path)); return s.exists()?s.val():null; }
  async function fbSet(path,val) { await window._set(window._ref(window._db,path),val); }
  async function fbUpdate(path,val) { await window._update(window._ref(window._db,path),val); }
  function fbListen(path,cb) { return window._onValue(window._ref(window._db,path),s=>cb(s.exists()?s.val():null)); }

  // ── Styles ──
  const aw={minHeight:"100vh",background:"#f3f4f6",display:"flex",flexDirection:"column"};
  const ct={padding:"16px 16px 40px",flex:1,overflowY:"auto"};
  const tb={display:"flex",background:"#fff",borderBottom:"1px solid #e5e7eb",overflowX:"auto"};
  const tBtn=a=>({padding:"12px 16px",border:"none",background:"none",cursor:"pointer",fontWeight:600,fontSize:13,color:a?"#6d28d9":"#888",borderBottom:a?"2px solid #6d28d9":"2px solid transparent",whiteSpace:"nowrap"});
  const h2s={fontSize:16,fontWeight:800,color:"#1f2937",margin:"0 0 12px"};
  const inp={width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:15,marginBottom:10,outline:"none",background:"#fafafa",display:"block"};
  const btn=(bg="#6d28d9")=>({background:bg,color:bg==="#e5e7eb"?"#374151":bg==="#fee2e2"?"#e11d48":"#fff",border:"none",borderRadius:10,padding:"10px 18px",cursor:"pointer",fontWeight:700,fontSize:14});
  const lbl={fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:4};
  const crd={background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,.08)"};

  function Header({title,subtitle,onLogout,logoutLabel="Sair"}) {
    return <div style={{background:"linear-gradient(135deg,#6d28d9,#0ea5e9)",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{color:"#fff",fontWeight:800,fontSize:17}}>{title}</div><div style={{color:"rgba(255,255,255,.7)",fontSize:12}}>{subtitle}</div></div>
      <button onClick={onLogout} style={{background:"rgba(255,255,255,.2)",border:"none",color:"#fff",padding:"6px 12px",borderRadius:8,cursor:"pointer",fontSize:12}}>{logoutLabel}</button>
    </div>;
  }
  function EmptyState({icon,text}) { return <div style={{textAlign:"center",padding:"40px 20px",color:"#aaa"}}><div style={{fontSize:40,marginBottom:8}}>{icon}</div><p style={{fontSize:14}}>{text}</p></div>; }
  function Spinner() { return <div style={{textAlign:"center",padding:40,color:"#6d28d9"}}>⏳ Carregando...</div>; }

  // Modal de confirmação
  function ConfirmModal({msg,onConfirm,onCancel}) {
    return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
      <div style={{background:"#fff",borderRadius:16,padding:24,maxWidth:300,width:"100%"}}>
        <p style={{fontSize:15,color:"#1f2937",marginBottom:20,textAlign:"center"}}>{msg}</p>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onCancel} style={{...btn("#e5e7eb"),flex:1}}>Cancelar</button>
          <button onClick={onConfirm} style={{...btn("#fee2e2"),flex:1}}>🗑 Apagar</button>
        </div>
      </div>
    </div>;
  }

  // ── Login ──
  function LoginScreen({onLogin}) {
    const [role,setRole]=useState("therapist"); const [pid,setPid]=useState(""); const [pass,setPass]=useState(""); const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
    async function handle() {
      setErr(""); setLoading(true);
      try {
        if (role==="therapist") {
          const d=await fbGet("therapist");
          if (pass===(d?.password||"1234")) onLogin("therapist",null); else setErr("Senha incorreta.");
        } else {
          const p=await fbGet(`patients/${pid}`);
          if (!p) { setErr("Paciente não encontrado."); setLoading(false); return; }
          if (p.password&&p.password!==pass) { setErr("Senha incorreta."); setLoading(false); return; }
          onLogin("patient",pid);
        }
      } catch(e) { setErr("Erro de conexão."); }
      setLoading(false);
    }
    return <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#6d28d9,#0ea5e9)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:20,padding:36,width:"100%",maxWidth:340,boxShadow:"0 20px 60px rgba(0,0,0,.2)"}}>
        <h1 style={{textAlign:"center",marginBottom:6,color:"#6d28d9",fontSize:22}}>🧠 TCC Terapeuta</h1>
        <p style={{textAlign:"center",color:"#888",marginBottom:24,fontSize:13}}>Tarefas terapêuticas TCC</p>
        <div style={{display:"flex",marginBottom:20,borderRadius:10,overflow:"hidden",border:"1px solid #e5e7eb"}}>
          {["therapist","patient"].map(r=><button key={r} onClick={()=>{setRole(r);setErr("");}} style={{flex:1,padding:"10px 0",background:role===r?"#6d28d9":"#fff",color:role===r?"#fff":"#666",border:"none",cursor:"pointer",fontWeight:600,fontSize:13}}>{r==="therapist"?"Terapeuta":"Paciente"}</button>)}
        </div>
        {role==="patient"&&<input placeholder="ID do paciente" value={pid} onChange={e=>setPid(e.target.value)} style={inp}/>}
        <input type="password" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} style={inp}/>
        {err&&<p style={{color:"#e11d48",fontSize:12,marginBottom:8}}>{err}</p>}
        <button onClick={handle} disabled={loading} style={{...btn(),width:"100%"}}>{loading?"Entrando...":"Entrar"}</button>
        {role==="therapist"&&<p style={{textAlign:"center",fontSize:11,color:"#aaa",marginTop:8}}>Senha padrão: 1234</p>}
      </div>
    </div>;
  }

  // ── Therapist ──
  function TherapistApp({onLogout}) {
    const [tab,setTab]=useState("patients"); const [patients,setPatients]=useState(null); const [sel,setSel]=useState(null);
    const [confirmDel,setConfirmDel]=useState(null);
    useEffect(()=>{ const u=fbListen("patients",d=>setPatients(d?Object.values(d):[])); return ()=>u(); },[]);

    async function addPatient() {
      const name=prompt("Nome do paciente:"); if(!name) return;
      const password=prompt("Senha do paciente:")||"1234";
      const id="p"+Date.now();
      await fbSet(`patients/${id}`,{id,name,password,tasks:{},prontuario:{diagnostico:"",medicacoes:"",historico:"",anotacoes:"",evolucao:{}}});
    }

    async function deletePatient(id) {
      await fbSet(`patients/${id}`,null);
      setConfirmDel(null);
    }

    if (patients===null) return <div style={aw}><Header title="🧠 TCC Terapeuta" subtitle="Painel do Terapeuta" onLogout={onLogout}/><Spinner/></div>;
    if (sel) { const p=patients.find(p=>p.id===sel); if(p) return <PatientDetail patient={p} onBack={()=>setSel(null)}/>; }

    return <div style={aw}>
      {confirmDel&&<ConfirmModal msg={`Apagar o paciente "${confirmDel.name}" e todas as suas tarefas?`} onConfirm={()=>deletePatient(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
      <Header title="🧠 TCC Terapeuta" subtitle="Painel do Terapeuta" onLogout={onLogout}/>
      <div style={tb}>{[["patients","👥 Pacientes"],["overview","📈 Visão Geral"]].map(([id,label])=><button key={id} onClick={()=>setTab(id)} style={tBtn(tab===id)}>{label}</button>)}</div>
      <div style={ct}>
        {tab==="patients"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <h2 style={h2s}>Meus Pacientes</h2>
            <button onClick={addPatient} style={btn()}>+ Novo</button>
          </div>
          {patients.length===0&&<EmptyState icon="👤" text="Nenhum paciente ainda."/>}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {patients.map(p=><div key={p.id} style={{background:"#fff",borderRadius:12,padding:"14px 18px",boxShadow:"0 2px 8px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div onClick={()=>setSel(p.id)} style={{flex:1,cursor:"pointer"}}>
                <div style={{fontWeight:700,color:"#1f2937"}}>{p.name}</div>
                <div style={{fontSize:12,color:"#888",marginTop:2}}>ID: {p.id} · {p.tasks?Object.keys(p.tasks).length:0} tarefa(s)</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <button onClick={()=>setConfirmDel(p)} style={{background:"#fee2e2",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:13,color:"#e11d48",fontWeight:700}}>🗑</button>
                <span onClick={()=>setSel(p.id)} style={{fontSize:20,cursor:"pointer",color:"#888"}}>›</span>
              </div>
            </div>)}
          </div>
        </>}
        {tab==="overview"&&<div>
          <h2 style={h2s}>Visão Geral</h2>
          {patients.length===0&&<EmptyState icon="📊" text="Nenhum dado ainda."/>}
          {patients.map(p=>{ const tasks=p.tasks?Object.values(p.tasks):[]; const done=tasks.filter(t=>t.response).length;
            return <div key={p.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
              <div style={{fontWeight:700,marginBottom:6}}>{p.name}</div>
              <div style={{fontSize:13,color:"#666"}}>Tarefas: {done}/{tasks.length} respondidas</div>
              <div style={{background:"#f3f4f6",borderRadius:8,height:8,marginTop:8,overflow:"hidden"}}><div style={{width:tasks.length?`${(done/tasks.length)*100}%`:"0%",background:"#6d28d9",height:"100%",borderRadius:8}}/></div>
            </div>;
          })}
        </div>}
      </div>
    </div>;
  }

  // ── Patient Detail ──
  function PatientDetail({patient,onBack}) {
    const [tab,setTab]=useState("tasks"); const [lp,setLp]=useState(patient);
    const [showAdd,setShowAdd]=useState(false); const [tt,setTt]=useState(""); const [ttitle,setTtitle]=useState(""); const [tnote,setTnote]=useState("");
    const [pron,setPron]=useState(patient.prontuario||{}); const [saved,setSaved]=useState(false); const [evo,setEvo]=useState("");
    const [confirmDel,setConfirmDel]=useState(null); const [viewTask,setViewTask]=useState(null);

    useEffect(()=>{ const u=fbListen(`patients/${patient.id}`,d=>{ if(d){setLp(d);setPron(d.prontuario||{});} }); return ()=>u(); },[patient.id]);

    async function addTask() {
      if(!tt||!ttitle) return;
      const id="t"+Date.now();
      await fbSet(`patients/${patient.id}/tasks/${id}`,{id,type:tt,title:ttitle,note:tnote,response:null,createdAt:new Date().toLocaleDateString("pt-BR")});
      setTt(""); setTtitle(""); setTnote(""); setShowAdd(false);
    }
    async function deleteTask(tid) { await fbSet(`patients/${patient.id}/tasks/${tid}`,null); setConfirmDel(null); setViewTask(null); }
    async function savePron() { await fbSet(`patients/${patient.id}/prontuario`,pron); setSaved(true); setTimeout(()=>setSaved(false),2000); }
    async function addEvo() {
      if(!evo.trim()) return;
      const id="e"+Date.now();
      await fbSet(`patients/${patient.id}/prontuario/evolucao/${id}`,{date:new Date().toLocaleDateString("pt-BR"),text:evo});
      setEvo("");
    }

    const tasks=lp.tasks?Object.values(lp.tasks):[];
    const evolucao=pron.evolucao?Object.values(pron.evolucao).reverse():[];

    // Modal de detalhes da tarefa
    if (viewTask) {
      const ti=getTypeInfo(viewTask.type);
      return <div style={aw}>
        {confirmDel&&<ConfirmModal msg={`Apagar a tarefa "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
        <Header title="Detalhes da Tarefa" subtitle={viewTask.title} onLogout={()=>setViewTask(null)} logoutLabel="← Voltar"/>
        <div style={ct}>
          <div style={crd}>
            <span style={{fontSize:12,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label}</span>
            <h2 style={{fontSize:17,fontWeight:800,color:"#1f2937",margin:"12px 0 4px"}}>{viewTask.title}</h2>
            <p style={{fontSize:12,color:"#aaa",marginBottom:12}}>Criada em {viewTask.createdAt}</p>
            {viewTask.note&&<div style={{background:"#f3f4f6",borderRadius:10,padding:12,marginBottom:12}}><p style={{fontSize:13,color:"#555"}}><strong>Instruções:</strong> {viewTask.note}</p></div>}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
              <span style={{fontSize:13,padding:"4px 10px",borderRadius:20,background:viewTask.response?"#d1fae5":"#fef3c7",color:viewTask.response?"#065f46":"#92400e",fontWeight:600}}>
                {viewTask.response?"✅ Respondida":"⏳ Pendente"}
              </span>
            </div>
            {viewTask.response&&<><h3 style={{fontSize:14,fontWeight:700,color:"#374151",marginBottom:10}}>Resposta do paciente:</h3><ResponseView response={viewTask.response} type={viewTask.type}/></>}
            <div style={{marginTop:20}}>
              <button onClick={()=>setConfirmDel(viewTask)} style={{...btn("#fee2e2"),width:"100%"}}>🗑 Apagar Tarefa</button>
            </div>
          </div>
        </div>
      </div>;
    }

    return <div style={aw}>
      {confirmDel&&<ConfirmModal msg={`Apagar a tarefa "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
      <Header title={`👤 ${patient.name}`} subtitle={`ID: ${patient.id}`} onLogout={onBack} logoutLabel="← Voltar"/>
      <div style={tb}>{[["tasks","📋 Tarefas"],["responses","✅ Respostas"],["prontuario","📁 Prontuário"]].map(([id,label])=><button key={id} onClick={()=>setTab(id)} style={tBtn(tab===id)}>{label}</button>)}</div>
      <div style={ct}>
        {tab==="tasks"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <h2 style={h2s}>Tarefas ({tasks.length})</h2>
            <button onClick={()=>setShowAdd(true)} style={btn()}>+ Nova</button>
          </div>
          {showAdd&&<div style={{...crd,marginBottom:16}}>
            <select value={tt} onChange={e=>setTt(e.target.value)} style={inp}><option value="">Tipo...</option>{TASK_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
            <input placeholder="Título da tarefa" value={ttitle} onChange={e=>setTtitle(e.target.value)} style={inp}/>
            <textarea placeholder="Instruções (opcional)" value={tnote} onChange={e=>setTnote(e.target.value)} style={{...inp,minHeight:60,resize:"vertical"}}/>
            <div style={{display:"flex",gap:8}}><button onClick={addTask} style={btn()}>Adicionar</button><button onClick={()=>setShowAdd(false)} style={btn("#e5e7eb")}>Cancelar</button></div>
          </div>}
          {tasks.length===0&&<EmptyState icon="📋" text="Nenhuma tarefa ainda."/>}
          {tasks.map(task=>{ const ti=getTypeInfo(task.type); return <div key={task.id} style={{background:"#fff",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)",border:`2px solid ${ti.color}22`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div onClick={()=>setViewTask(task)} style={{flex:1,cursor:"pointer"}}>
                <span style={{fontSize:11,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"2px 8px",borderRadius:20}}>{ti.label}</span>
                <div style={{fontWeight:700,marginTop:6,color:"#1f2937"}}>{task.title}</div>
                {task.note&&<div style={{fontSize:12,color:"#888",marginTop:3}}>{task.note}</div>}
                <div style={{fontSize:11,color:"#aaa",marginTop:4}}>Criada em {task.createdAt}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,marginLeft:8}}>
                <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:task.response?"#d1fae5":"#fef3c7",color:task.response?"#065f46":"#92400e",whiteSpace:"nowrap"}}>
                  {task.response?"✅ Respondida":"⏳ Pendente"}
                </span>
                <button onClick={()=>setConfirmDel(task)} style={{background:"#fee2e2",border:"none",borderRadius:8,padding:"4px 8px",cursor:"pointer",fontSize:12,color:"#e11d48",fontWeight:700}}>🗑</button>
              </div>
            </div>
          </div>; })}
        </>}
        {tab==="responses"&&<>
          <h2 style={h2s}>Respostas ({tasks.filter(t=>t.response).length})</h2>
          {tasks.filter(t=>t.response).length===0&&<EmptyState icon="✅" text="Nenhuma resposta ainda."/>}
          {tasks.filter(t=>t.response).map(task=>{ const ti=getTypeInfo(task.type); return <div key={task.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
            <span style={{fontSize:11,fontWeight:700,color:ti.color}}>{ti.label}</span>
            <div style={{fontWeight:700,marginBottom:8,color:"#1f2937"}}>{task.title}</div>
            <ResponseView response={task.response} type={task.type}/>
            {task.answeredAt&&<div style={{fontSize:11,color:"#aaa",marginTop:8}}>Respondida em {task.answeredAt}</div>}
          </div>; })}
        </>}
        {tab==="prontuario"&&<div>
          <h2 style={h2s}>📁 Prontuário</h2>
          <div style={{...crd,marginBottom:16}}>
            {[["diagnostico","Diagnóstico","CID, hipóteses..."],["medicacoes","Medicações","Medicações em uso..."],["historico","Histórico Clínico","Histórico relevante..."],["anotacoes","Anotações","Observações clínicas..."]].map(([f,l,ph])=><div key={f}><label style={lbl}>{l}</label><textarea value={pron[f]||""} onChange={e=>setPron({...pron,[f]:e.target.value})} placeholder={ph} style={{...inp,minHeight:70,resize:"vertical"}}/></div>)}
            <button onClick={savePron} style={btn()}>{saved?"✅ Salvo!":"Salvar Prontuário"}</button>
          </div>
          <div style={crd}>
            <h3 style={{fontSize:15,marginBottom:12,color:"#1f2937"}}>📝 Evolução em Sessão</h3>
            <textarea value={evo} onChange={e=>setEvo(e.target.value)} placeholder="Registro de sessão..." style={{...inp,minHeight:80,resize:"vertical"}}/>
            <button onClick={addEvo} style={btn()}>+ Adicionar</button>
            <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
              {evolucao.length===0&&<p style={{color:"#aaa",fontSize:13}}>Nenhum registro ainda.</p>}
              {evolucao.map((ev,i)=><div key={i} style={{background:"#f9fafb",borderRadius:10,padding:12,borderLeft:"3px solid #6d28d9"}}><div style={{fontSize:11,color:"#888",marginBottom:4}}>{ev.date}</div><div style={{fontSize:13,color:"#374151",whiteSpace:"pre-wrap"}}>{ev.text}</div></div>)}
            </div>
          </div>
        </div>}
      </div>
    </div>;
  }

  // ── Patient App ──
  function PatientApp({patientId,onLogout}) {
    const [patient,setPatient]=useState(null); const [sel,setSel]=useState(null); const [viewTask,setViewTask]=useState(null);
    useEffect(()=>{ const u=fbListen(`patients/${patientId}`,d=>setPatient(d)); return ()=>u(); },[patientId]);
    async function submit(taskId,response) { await fbUpdate(`patients/${patientId}/tasks/${taskId}`,{response,answeredAt:new Date().toLocaleDateString("pt-BR")}); setSel(null); }
    if (!patient) return <div style={aw}><Spinner/></div>;
    const tasks=patient.tasks?Object.values(patient.tasks):[];
    const pending=tasks.filter(t=>!t.response); const done=tasks.filter(t=>t.response);

    if (sel) { const task=tasks.find(t=>t.id===sel); if(task) return <TaskForm task={task} onSubmit={r=>submit(task.id,r)} onBack={()=>setSel(null)}/>; }

    // Ver detalhes de tarefa concluída
    if (viewTask) {
      const ti=getTypeInfo(viewTask.type);
      return <div style={aw}>
        <Header title="Detalhes" subtitle={viewTask.title} onLogout={()=>setViewTask(null)} logoutLabel="← Voltar"/>
        <div style={ct}>
          <div style={crd}>
            <span style={{fontSize:12,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label}</span>
            <h2 style={{fontSize:17,fontWeight:800,color:"#1f2937",margin:"12px 0 4px"}}>{viewTask.title}</h2>
            {viewTask.note&&<div style={{background:"#f3f4f6",borderRadius:10,padding:12,marginBottom:12,marginTop:8}}><p style={{fontSize:13,color:"#555"}}><strong>Instruções:</strong> {viewTask.note}</p></div>}
            <h3 style={{fontSize:14,fontWeight:700,color:"#374151",marginBottom:10,marginTop:8}}>Sua resposta:</h3>
            <ResponseView response={viewTask.response} type={viewTask.type}/>
            {viewTask.answeredAt&&<div style={{fontSize:11,color:"#aaa",marginTop:12}}>Respondida em {viewTask.answeredAt}</div>}
          </div>
        </div>
      </div>;
    }

    return <div style={aw}>
      <Header title={`Olá, ${patient.name}! 👋`} subtitle="Suas tarefas terapêuticas" onLogout={onLogout}/>
      <div style={ct}>
        {tasks.length===0&&<EmptyState icon="🎉" text="Nenhuma tarefa ainda. Fale com seu terapeuta."/>}
        {pending.length>0&&<><h2 style={h2s}>⏳ Pendentes ({pending.length})</h2>
          {pending.map(task=>{ const ti=getTypeInfo(task.type); return <div key={task.id} onClick={()=>setSel(task.id)} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,.08)",borderLeft:`4px solid ${ti.color}`}}>
            <span style={{fontSize:11,fontWeight:700,color:ti.color}}>{ti.label}</span>
            <div style={{fontWeight:700,color:"#1f2937",marginTop:4}}>{task.title}</div>
            {task.note&&<div style={{fontSize:12,color:"#888",marginTop:3}}>{task.note}</div>}
            <div style={{marginTop:8,fontSize:12,color:ti.color,fontWeight:600}}>Toque para responder →</div>
          </div>; })}
        </>}
        {done.length>0&&<><h2 style={{...h2s,marginTop:20}}>✅ Concluídas ({done.length})</h2>
          {done.map(task=>{ const ti=getTypeInfo(task.type); return <div key={task.id} onClick={()=>setViewTask(task)} style={{background:"#f9fafb",borderRadius:12,padding:14,marginBottom:8,borderLeft:`4px solid ${ti.color}`,cursor:"pointer"}}>
            <span style={{fontSize:11,color:ti.color,fontWeight:700}}>{ti.label}</span>
            <div style={{fontWeight:600,color:"#374151"}}>{task.title}</div>
            <div style={{fontSize:11,color:"#aaa"}}>Respondida em {task.answeredAt} · Toque para ver →</div>
          </div>; })}
        </>}
      </div>
    </div>;
  }

  // ── Task Forms ──
  function TaskForm({task,onSubmit,onBack}) {
    const ti=getTypeInfo(task.type);
    return <div style={aw}>
      <Header title={ti.label} subtitle={task.title} onLogout={onBack} logoutLabel="← Voltar"/>
      <div style={ct}>
        {task.note&&<div style={{background:`${ti.color}15`,borderRadius:10,padding:12,marginBottom:16,borderLeft:`3px solid ${ti.color}`}}><p style={{fontSize:13,color:"#374151"}}><strong>Orientação:</strong> {task.note}</p></div>}
        {task.type==="diario"&&<DiarioForm color={ti.color} onSubmit={onSubmit}/>}
        {task.type==="pensamentos"&&<PensamentosForm color={ti.color} onSubmit={onSubmit}/>}
        {task.type==="atencao"&&<AtencaoForm color={ti.color} onSubmit={onSubmit}/>}
        {task.type==="experimento"&&<ExperimentoForm color={ti.color} onSubmit={onSubmit}/>}
        {task.type==="escala"&&<EscalaForm color={ti.color} onSubmit={onSubmit}/>}
      </div>
    </div>;
  }

  function DiarioForm({color,onSubmit}) {
    const [e,setE]=useState(""); const [i,setI]=useState(5); const [c,setC]=useState(""); const [p,setP]=useState("");
    return <div style={crd}><h3 style={{color,fontSize:16,marginBottom:16}}>📔 Diário de Emoções</h3>
      <label style={lbl}>Emoção</label><input value={e} onChange={x=>setE(x.target.value)} placeholder="ex: ansiedade, tristeza..." style={inp}/>
      <label style={lbl}>Intensidade: {i}/10</label><input type="range" min={1} max={10} value={i} onChange={x=>setI(+x.target.value)} style={{width:"100%",marginBottom:12,accentColor:color}}/>
      <label style={lbl}>Contexto</label><textarea value={c} onChange={x=>setC(x.target.value)} placeholder="O que estava acontecendo?" style={{...inp,minHeight:70,resize:"vertical"}}/>
      <label style={lbl}>Pensamento</label><textarea value={p} onChange={x=>setP(x.target.value)} placeholder="O que passou pela sua cabeça?" style={{...inp,minHeight:70,resize:"vertical"}}/>
      <button onClick={()=>{ if(e) onSubmit({emocao:e,intensidade:i,contexto:c,pensamento:p}); }} style={{...btn(color),width:"100%"}}>Enviar</button>
    </div>;
  }

  function PensamentosForm({color,onSubmit}) {
    const [s,setS]=useState(""); const [p,setP]=useState(""); const [e,setE]=useState(""); const [i,setI]=useState(5); const [a,setA]=useState("");
    return <div style={crd}><h3 style={{color,fontSize:16,marginBottom:16}}>💭 Registro ABC</h3>
      <label style={lbl}>A — Situação</label><textarea value={s} onChange={x=>setS(x.target.value)} placeholder="O que aconteceu?" style={{...inp,minHeight:60,resize:"vertical"}}/>
      <label style={lbl}>B — Pensamento automático</label><textarea value={p} onChange={x=>setP(x.target.value)} placeholder="O que você pensou?" style={{...inp,minHeight:60,resize:"vertical"}}/>
      <label style={lbl}>C — Emoção</label><input value={e} onChange={x=>setE(x.target.value)} placeholder="ex: fiquei ansioso..." style={inp}/>
      <label style={lbl}>Intensidade: {i}/10</label><input type="range" min={1} max={10} value={i} onChange={x=>setI(+x.target.value)} style={{width:"100%",marginBottom:12,accentColor:color}}/>
      <label style={lbl}>Pensamento alternativo</label><textarea value={a} onChange={x=>setA(x.target.value)} placeholder="Outra forma de ver?" style={{...inp,minHeight:60,resize:"vertical"}}/>
      <button onClick={()=>{ if(s&&p) onSubmit({situacao:s,pensamento:p,emocao:e,intensidade:i,pensamentoAlternativo:a}); }} style={{...btn(color),width:"100%"}}>Enviar</button>
    </div>;
  }

  function AtencaoForm({color,onSubmit}) {
    const [fase,setFase]=useState("intro"); const [seq,setSeq]=useState([]); const [shown,setShown]=useState([]); const [input,setInput]=useState(""); const [result,setResult]=useState(null); const [score,setScore]=useState(0); const [round,setRound]=useState(0);
    function start() {
      const s=Array.from({length:5},()=>Math.floor(Math.random()*9)+1);
      setSeq(s); setShown([]); setInput(""); setResult(null); setRound(r=>r+1); setFase("show");
      s.forEach((n,i)=>setTimeout(()=>{ setShown(p=>[...p,n]); if(i===s.length-1) setTimeout(()=>setFase("answer"),600); },i*700));
    }
    function check() { const u=input.trim().split(/\s+/).map(Number); const ok=JSON.stringify(u)===JSON.stringify(seq); setResult(ok); if(ok) setScore(s=>s+1); setFase("result"); }
    return <div style={crd}><h3 style={{color,fontSize:16,marginBottom:16}}>🎯 Teste de Atenção</h3>
      {fase==="intro"&&<><p style={{fontSize:13,color:"#555",marginBottom:16}}>Memorize a sequência e depois digite na ordem correta.</p><button onClick={start} style={{...btn(color),width:"100%"}}>Começar</button></>}
      {fase==="show"&&<div style={{textAlign:"center",padding:"30px 0"}}><p style={{color:"#888",marginBottom:16}}>Memorize:</p><div style={{display:"flex",justifyContent:"center",gap:12}}>{shown.map((n,i)=><span key={i} style={{width:44,height:44,borderRadius:10,background:color,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:800}}>{n}</span>)}</div></div>}
      {fase==="answer"&&<><p style={{fontSize:13,color:"#555",marginBottom:12}}>Digite os números separados por espaço:</p><input value={input} onChange={e=>setInput(e.target.value)} placeholder="ex: 3 7 1 9 4" style={inp}/><button onClick={check} style={{...btn(color),width:"100%"}}>Confirmar</button></>}
      {fase==="result"&&<div style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:8}}>{result?"🎉":"😅"}</div><p style={{fontWeight:700,color:result?"#059669":"#e11d48"}}>{result?"Correto!":"Incorreto"}</p><p style={{fontSize:13,color:"#888"}}>Sequência: {seq.join(" ")}</p><p style={{fontSize:13,marginTop:8}}>Rodada {round} · Acertos: {score}/{round}</p><div style={{display:"flex",gap:8,marginTop:12}}><button onClick={start} style={{...btn(color),flex:1}}>Nova rodada</button><button onClick={()=>onSubmit({rodadas:round,acertos:score})} style={{...btn("#059669"),flex:1}}>Finalizar</button></div></div>}
    </div>;
  }

  function ExperimentoForm({color,onSubmit}) {
    const [h,setH]=useState(""); const [a,setA]=useState(""); const [r,setR]=useState(""); const [ap,setAp]=useState("");
    return <div style={crd}><h3 style={{color,fontSize:16,marginBottom:16}}>🔬 Experimento Comportamental</h3>
      <label style={lbl}>Hipótese</label><textarea value={h} onChange={e=>setH(e.target.value)} placeholder="O que você acha que vai acontecer?" style={{...inp,minHeight:70,resize:"vertical"}}/>
      <label style={lbl}>Ação planejada</label><textarea value={a} onChange={e=>setA(e.target.value)} placeholder="O que vai fazer?" style={{...inp,minHeight:60,resize:"vertical"}}/>
      <label style={lbl}>O que aconteceu?</label><textarea value={r} onChange={e=>setR(e.target.value)} placeholder="Resultado real..." style={{...inp,minHeight:70,resize:"vertical"}}/>
      <label style={lbl}>Aprendizado</label><textarea value={ap} onChange={e=>setAp(e.target.value)} placeholder="Reflexão..." style={{...inp,minHeight:60,resize:"vertical"}}/>
      <button onClick={()=>{ if(h&&a) onSubmit({hipotese:h,acao:a,resultado:r,aprendizado:ap}); }} style={{...btn(color),width:"100%"}}>Enviar</button>
    </div>;
  }

  function EscalaForm({color,onSubmit}) {
    const [hm,setHm]=useState(5); const [an,setAn]=useState(5); const [sn,setSn]=useState(5); const [ob,setOb]=useState("");
    const lv=v=>v<=3?"😔 Baixo":v<=6?"😐 Moderado":"😊 Alto";
    return <div style={crd}><h3 style={{color,fontSize:16,marginBottom:16}}>📊 Escala de Bem-Estar</h3>
      {[["Humor",hm,setHm],["Ansiedade",an,setAn],["Sono",sn,setSn]].map(([l,v,s])=><div key={l} style={{marginBottom:16}}><label style={lbl}>{l}: <strong>{v}/10</strong> — {lv(v)}</label><input type="range" min={0} max={10} value={v} onChange={e=>s(+e.target.value)} style={{width:"100%",accentColor:color}}/></div>)}
      <label style={lbl}>Observações</label><textarea value={ob} onChange={e=>setOb(e.target.value)} placeholder="Como você está hoje?" style={{...inp,minHeight:70,resize:"vertical"}}/>
      <button onClick={()=>onSubmit({humor:hm,ansiedade:an,sono:sn,obs:ob})} style={{...btn(color),width:"100%"}}>Enviar</button>
    </div>;
  }

  function ResponseView({response,type}) {
    if (!response) return null;
    const items=[];
    if(type==="diario") items.push(["Emoção",response.emocao],["Intensidade",`${response.intensidade}/10`],["Contexto",response.contexto],["Pensamento",response.pensamento]);
    if(type==="pensamentos") items.push(["Situação",response.situacao],["Pensamento",response.pensamento],["Emoção",response.emocao],["Intensidade",`${response.intensidade}/10`],["Alternativo",response.pensamentoAlternativo]);
    if(type==="atencao") items.push(["Rodadas",response.rodadas],["Acertos",`${response.acertos}/${response.rodadas}`]);
    if(type==="experimento") items.push(["Hipótese",response.hipotese],["Ação",response.acao],["Resultado",response.resultado],["Aprendizado",response.aprendizado]);
    if(type==="escala") items.push(["Humor",`${response.humor}/10`],["Ansiedade",`${response.ansiedade}/10`],["Sono",`${response.sono}/10`],["Observações",response.obs]);
    return <div style={{display:"flex",flexDirection:"column",gap:6}}>{items.filter(([,v])=>v).map(([k,v])=><div key={k} style={{fontSize:13}}><strong style={{color:"#374151"}}>{k}:</strong> <span style={{color:"#555"}}>{v}</span></div>)}</div>;
  }

  // ── Root ──
  function App() {
    const [ready,setReady]=useState(window._firebaseReady||false);
    const [session,setSession]=useState({role:null,patientId:null});
    useEffect(()=>{ if(!ready){ const h=()=>setReady(true); window.addEventListener("firebaseReady",h); return ()=>window.removeEventListener("firebaseReady",h); } },[ready]);
    if (!ready) return <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#6d28d9,#0ea5e9)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{color:"#fff",textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>🧠</div><div style={{fontSize:16,fontWeight:700}}>TCC Terapeuta</div><div style={{fontSize:13,marginTop:8,opacity:.8}}>Conectando...</div></div>
    </div>;
    if (!session.role) return <LoginScreen onLogin={(role,pid)=>setSession({role,patientId:pid})}/>;
    if (session.role==="therapist") return <TherapistApp onLogout={()=>setSession({role:null,patientId:null})}/>;
    return <PatientApp patientId={session.patientId} onLogout={()=>setSession({role:null,patientId:null})}/>;
  }

  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
</script>
</body>
</html>
