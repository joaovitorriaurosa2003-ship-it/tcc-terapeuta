<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TCC Terapeuta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; max-width: 480px; margin: 0 auto; }
    input, textarea, select, button { font-family: inherit; font-size: 16px; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
<div id="root"><div style="min-height:100vh;background:linear-gradient(135deg,#6d28d9,#0ea5e9);display:flex;align-items:center;justify-content:center"><div style="color:#fff;text-align:center"><div style="font-size:40px;margin-bottom:12px">🧠</div><div style="font-size:16px;font-weight:700">TCC Terapeuta</div><div style="font-size:13px;margin-top:8px;opacity:.8">Carregando...</div></div></div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDrQDc6-GANiIcU_Eg2X5J7XMLRQwh7UQo",
    authDomain: "meupsi-91fad.firebaseapp.com",
    projectId: "meupsi-91fad",
    storageBucket: "meupsi-91fad.firebasestorage.app",
    messagingSenderId: "70457582233",
    appId: "1:70457582233:web:4114186b782d888d9e8e08",
    databaseURL: "https://meupsi-91fad-default-rtdb.firebaseio.com"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window._db=db; window._ref=ref; window._set=set; window._get=get; window._update=update; window._onValue=onValue;
  window._firebaseReady=true; window.dispatchEvent(new Event("firebaseReady"));
</script>

<script type="text/babel" data-presets="react">
  const { useState, useEffect, useRef } = React;

  const TASK_TYPES = [
    { id:"pensamentos", label:"💭 Pensamentos Automáticos", color:"#0891b2" },
    { id:"atencao",     label:"🎯 Teste de Atenção",        color:"#d97706" },
    { id:"experimento", label:"🔬 Experimento Comportamental", color:"#059669" },
    { id:"escala",      label:"📊 Escala de Bem-Estar",     color:"#e11d48" },
  ];
  function getTypeInfo(id) { return TASK_TYPES.find(t=>t.id===id)||{}; }

  const EMOCOES = [
    {emoji:"😊",nome:"Alegria",   color:"#f59e0b",bg:"#fef3c7"},
    {emoji:"😢",nome:"Tristeza",  color:"#3b82f6",bg:"#dbeafe"},
    {emoji:"😡",nome:"Raiva",     color:"#ef4444",bg:"#fee2e2"},
    {emoji:"😰",nome:"Ansiedade", color:"#8b5cf6",bg:"#ede9fe"},
    {emoji:"😨",nome:"Medo",      color:"#6366f1",bg:"#e0e7ff"},
    {emoji:"🤢",nome:"Nojo",      color:"#10b981",bg:"#d1fae5"},
    {emoji:"😳",nome:"Vergonha",  color:"#f97316",bg:"#ffedd5"},
    {emoji:"😔",nome:"Culpa",     color:"#64748b",bg:"#f1f5f9"},
    {emoji:"😴",nome:"Cansaço",   color:"#94a3b8",bg:"#f8fafc"},
    {emoji:"🥰",nome:"Amor",      color:"#ec4899",bg:"#fce7f3"},
    {emoji:"😐",nome:"Neutro",    color:"#6b7280",bg:"#f3f4f6"},
    {emoji:"🤩",nome:"Empolgação",color:"#f59e0b",bg:"#fef9c3"},
  ];

  const ESCALAS_DEF = [
    {id:"humor",    nome:"Humor",            emoji:"😊",color:"#f59e0b"},
    {id:"ansiedade",nome:"Ansiedade",         emoji:"😰",color:"#8b5cf6"},
    {id:"sono",     nome:"Qualidade do Sono", emoji:"😴",color:"#3b82f6"},
    {id:"estresse", nome:"Estresse",          emoji:"🤯",color:"#ef4444"},
    {id:"tristeza", nome:"Tristeza",          emoji:"😢",color:"#60a5fa"},
  ];

  async function fbGet(p) { const s=await window._get(window._ref(window._db,p)); return s.exists()?s.val():null; }
  async function fbSet(p,v) { await window._set(window._ref(window._db,p),v); }
  async function fbUpdate(p,v) { await window._update(window._ref(window._db,p),v); }
  function fbListen(p,cb) { return window._onValue(window._ref(window._db,p),s=>cb(s.exists()?s.val():null)); }

  const aw={minHeight:"100vh",background:"#f3f4f6",display:"flex",flexDirection:"column"};
  const ct={padding:"16px 16px 40px",flex:1,overflowY:"auto"};
  const tb={display:"flex",background:"#fff",borderBottom:"1px solid #e5e7eb",overflowX:"auto"};
  const tBtn=a=>({padding:"12px 16px",border:"none",background:"none",cursor:"pointer",fontWeight:600,fontSize:13,color:a?"#6d28d9":"#888",borderBottom:a?"2px solid #6d28d9":"2px solid transparent",whiteSpace:"nowrap"});
  const h2s={fontSize:16,fontWeight:800,color:"#1f2937",margin:"0 0 12px"};
  const inp={width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:15,marginBottom:10,outline:"none",background:"#fafafa",display:"block"};
  const btn=(bg="#6d28d9")=>({background:bg,color:bg==="#e5e7eb"?"#374151":bg==="#fee2e2"?"#e11d48":"#fff",border:"none",borderRadius:10,padding:"10px 18px",cursor:"pointer",fontWeight:700,fontSize:14});
  const lbl={fontSize:12,fontWeight:700,color:"#374151",display:"block",marginBottom:4};
  const crd={background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,.08)"};

  function Header({title,subtitle,onLogout,logoutLabel="Sair"}) {
    return <div style={{background:"linear-gradient(135deg,#6d28d9,#0ea5e9)",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{color:"#fff",fontWeight:800,fontSize:17}}>{title}</div><div style={{color:"rgba(255,255,255,.7)",fontSize:12}}>{subtitle}</div></div>
      <button onClick={onLogout} style={{background:"rgba(255,255,255,.2)",border:"none",color:"#fff",padding:"6px 12px",borderRadius:8,cursor:"pointer",fontSize:12}}>{logoutLabel}</button>
    </div>;
  }
  function EmptyState({icon,text}) { return <div style={{textAlign:"center",padding:"40px 20px",color:"#aaa"}}><div style={{fontSize:40,marginBottom:8}}>{icon}</div><p style={{fontSize:14}}>{text}</p></div>; }
  function Spinner() { return <div style={{textAlign:"center",padding:40,color:"#6d28d9"}}>⏳ Carregando...</div>; }
  function ConfirmModal({msg,onConfirm,onCancel}) {
    return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
      <div style={{background:"#fff",borderRadius:16,padding:24,maxWidth:300,width:"100%"}}>
        <p style={{fontSize:15,color:"#1f2937",marginBottom:20,textAlign:"center"}}>{msg}</p>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onCancel} style={{...btn("#e5e7eb"),flex:1}}>Cancelar</button>
          <button onClick={onConfirm} style={{...btn("#fee2e2"),flex:1}}>🗑 Apagar</button>
        </div>
      </div>
    </div>;
  }

  // ── Login ──
  function LoginScreen({onLogin}) {
    const [role,setRole]=useState("therapist"); const [pid,setPid]=useState(""); const [pass,setPass]=useState(""); const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
    async function handle() {
      setErr(""); setLoading(true);
      try {
        if (role==="therapist") {
          const d=await fbGet("therapist");
          if (pass===(d?.password||"1234")) onLogin("therapist",null); else setErr("Senha incorreta.");
        } else {
          const all=await fbGet("patients");
          if (!all) { setErr("Nenhum paciente cadastrado."); setLoading(false); return; }
          const found=Object.values(all).find(p=>p.name.trim().toLowerCase()===pid.trim().toLowerCase());
          if (!found) { setErr("Paciente não encontrado."); setLoading(false); return; }
          if (found.password&&found.password!==pass) { setErr("Senha incorreta."); setLoading(false); return; }
          onLogin("patient",found.id);
        }
      } catch(e) { setErr("Erro de conexão."); }
      setLoading(false);
    }
    return <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#6d28d9,#0ea5e9)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:20,padding:36,width:"100%",maxWidth:340,boxShadow:"0 20px 60px rgba(0,0,0,.2)"}}>
        <h1 style={{textAlign:"center",marginBottom:6,color:"#6d28d9",fontSize:22}}>🧠 TCC Terapeuta</h1>
        <p style={{textAlign:"center",color:"#888",marginBottom:24,fontSize:13}}>Tarefas terapêuticas TCC</p>
        <div style={{display:"flex",marginBottom:20,borderRadius:10,overflow:"hidden",border:"1px solid #e5e7eb"}}>
          {["therapist","patient"].map(r=><button key={r} onClick={()=>{setRole(r);setErr("");}} style={{flex:1,padding:"10px 0",background:role===r?"#6d28d9":"#fff",color:role===r?"#fff":"#666",border:"none",cursor:"pointer",fontWeight:600,fontSize:13}}>{r==="therapist"?"Terapeuta":"Paciente"}</button>)}
        </div>
        {role==="patient"&&<input placeholder="Seu nome" value={pid} onChange={e=>setPid(e.target.value)} style={inp}/>}
        <input type="password" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} style={inp}/>
        {err&&<p style={{color:"#e11d48",fontSize:12,marginBottom:8}}>{err}</p>}
        <button onClick={handle} disabled={loading} style={{...btn(),width:"100%"}}>{loading?"Entrando...":"Entrar"}</button>
        {role==="therapist"&&<p style={{textAlign:"center",fontSize:11,color:"#aaa",marginTop:8}}>Senha padrão: 1234</p>}
      </div>
    </div>;
  }

  // ── Therapist ──
  function TherapistApp({onLogout}) {
    const [tab,setTab]=useState("patients"); const [patients,setPatients]=useState(null); const [sel,setSel]=useState(null);
    const [confirmDel,setConfirmDel]=useState(null);
    useEffect(()=>{ const u=fbListen("patients",d=>setPatients(d?Object.values(d):[])); return ()=>u(); },[]);
    async function addPatient() {
      const name=prompt("Nome do paciente:"); if(!name) return;
      const all=await fbGet("patients");
      const list=all?Object.values(all):[];
      if (list.find(p=>p.name.trim().toLowerCase()===name.trim().toLowerCase())) { alert(`Já existe um paciente com o nome "${name}".`); return; }
      const password=prompt("Senha do paciente:")||"1234";
      const id="p"+Date.now();
      await fbSet(`patients/${id}`,{id,name,password,tasks:{},prontuario:{diagnostico:"",medicacoes:"",historico:"",anotacoes:"",evolucao:{}}});
    }
    async function deletePatient(id) { await fbSet(`patients/${id}`,null); setConfirmDel(null); }
    if (patients===null) return <div style={aw}><Header title="🧠 TCC Terapeuta" subtitle="Painel do Terapeuta" onLogout={onLogout}/><Spinner/></div>;
    if (sel) { const p=patients.find(p=>p.id===sel); if(p) return <PatientDetail patient={p} onBack={()=>setSel(null)}/>; }
    return <div style={aw}>
      {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.name}" e todas as suas tarefas?`} onConfirm={()=>deletePatient(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
      <Header title="🧠 TCC Terapeuta" subtitle="Painel do Terapeuta" onLogout={onLogout}/>
      <div style={tb}>{[["patients","👥 Pacientes"],["overview","📈 Visão Geral"]].map(([id,label])=><button key={id} onClick={()=>setTab(id)} style={tBtn(tab===id)}>{label}</button>)}</div>
      <div style={ct}>
        {tab==="patients"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <h2 style={h2s}>Meus Pacientes</h2><button onClick={addPatient} style={btn()}>+ Novo</button>
          </div>
          {patients.length===0&&<EmptyState icon="👤" text="Nenhum paciente ainda."/>}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {patients.map(p=><div key={p.id} style={{background:"#fff",borderRadius:12,padding:"14px 18px",boxShadow:"0 2px 8px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div onClick={()=>setSel(p.id)} style={{flex:1,cursor:"pointer"}}>
                <div style={{fontWeight:700,color:"#1f2937"}}>{p.name}</div>
                <div style={{fontSize:12,color:"#888",marginTop:2}}>{p.tasks?Object.keys(p.tasks).length:0} tarefa(s)</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <button onClick={()=>setConfirmDel(p)} style={{background:"#fee2e2",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:13,color:"#e11d48",fontWeight:700}}>🗑</button>
                <span onClick={()=>setSel(p.id)} style={{fontSize:20,cursor:"pointer",color:"#888"}}>›</span>
              </div>
            </div>)}
          </div>
        </>}
        {tab==="overview"&&<div>
          <h2 style={h2s}>Visão Geral</h2>
          {patients.length===0&&<EmptyState icon="📊" text="Nenhum dado ainda."/>}
          {patients.map(p=>{ const tasks=p.tasks?Object.values(p.tasks):[]; const done=tasks.filter(t=>t.response).length;
            return <div key={p.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
              <div style={{fontWeight:700,marginBottom:6}}>{p.name}</div>
              <div style={{fontSize:13,color:"#666"}}>Tarefas: {done}/{tasks.length} respondidas</div>
              <div style={{background:"#f3f4f6",borderRadius:8,height:8,marginTop:8,overflow:"hidden"}}><div style={{width:tasks.length?`${(done/tasks.length)*100}%`:"0%",background:"#6d28d9",height:"100%",borderRadius:8}}/></div>
            </div>;
          })}
        </div>}
      </div>
    </div>;
  }

  function PatientDetail({patient,onBack}) {
    const [tab,setTab]=useState("tasks"); const [lp,setLp]=useState(patient);
    const [showAdd,setShowAdd]=useState(false); const [tt,setTt]=useState(""); const [ttitle,setTtitle]=useState(""); const [tnote,setTnote]=useState("");
    const [pron,setPron]=useState(patient.prontuario||{}); const [saved,setSaved]=useState(false); const [evo,setEvo]=useState("");
    const [confirmDel,setConfirmDel]=useState(null); const [viewTask,setViewTask]=useState(null);
    useEffect(()=>{ const u=fbListen(`patients/${patient.id}`,d=>{ if(d){setLp(d);setPron(d.prontuario||{});} }); return ()=>u(); },[patient.id]);
    async function addTask() {
      if(!tt||!ttitle) return;
      const id="t"+Date.now();
      await fbSet(`patients/${patient.id}/tasks/${id}`,{id,type:tt,title:ttitle,note:tnote,response:null,createdAt:new Date().toLocaleDateString("pt-BR")});
      setTt(""); setTtitle(""); setTnote(""); setShowAdd(false);
    }
    async function deleteTask(tid) { await fbSet(`patients/${patient.id}/tasks/${tid}`,null); setConfirmDel(null); setViewTask(null); }
    async function savePron() { await fbSet(`patients/${patient.id}/prontuario`,pron); setSaved(true); setTimeout(()=>setSaved(false),2000); }
    async function addEvo() {
      if(!evo.trim()) return;
      await fbSet(`patients/${patient.id}/prontuario/evolucao/${"e"+Date.now()}`,{date:new Date().toLocaleDateString("pt-BR"),text:evo});
      setEvo("");
    }
    const tasks=lp.tasks?Object.values(lp.tasks):[];
    const evolucao=pron.evolucao?Object.values(pron.evolucao).reverse():[];
    const diarios=lp.diarios?Object.values(lp.diarios).reverse():[];

    if (viewTask) {
      const ti=getTypeInfo(viewTask.type);
      return <div style={aw}>
        {confirmDel&&<ConfirmModal msg={`Apagar a tarefa "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
        <Header title="Detalhes da Tarefa" subtitle={viewTask.title} onLogout={()=>setViewTask(null)} logoutLabel="← Voltar"/>
        <div style={ct}><div style={crd}>
          <span style={{fontSize:12,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label}</span>
          <h2 style={{fontSize:17,fontWeight:800,color:"#1f2937",margin:"12px 0 4px"}}>{viewTask.title}</h2>
          <p style={{fontSize:12,color:"#aaa",marginBottom:12}}>Criada em {viewTask.createdAt}</p>
          {viewTask.note&&<div style={{background:"#f3f4f6",borderRadius:10,padding:12,marginBottom:12}}><p style={{fontSize:13,color:"#555"}}><strong>Instruções:</strong> {viewTask.note}</p></div>}
          <span style={{fontSize:13,padding:"4px 10px",borderRadius:20,background:viewTask.response?"#d1fae5":"#fef3c7",color:viewTask.response?"#065f46":"#92400e",fontWeight:600}}>{viewTask.response?"✅ Respondida":"⏳ Pendente"}</span>
          {viewTask.response&&<div style={{marginTop:16}}><h3 style={{fontSize:14,fontWeight:700,color:"#374151",marginBottom:10}}>Resposta:</h3><ResponseView response={viewTask.response} type={viewTask.type}/></div>}
          <div style={{marginTop:20}}><button onClick={()=>setConfirmDel(viewTask)} style={{...btn("#fee2e2"),width:"100%"}}>🗑 Apagar Tarefa</button></div>
        </div></div>
      </div>;
    }

    return <div style={aw}>
      {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
      <Header title={`👤 ${patient.name}`} subtitle={`ID: ${patient.id}`} onLogout={onBack} logoutLabel="← Voltar"/>
      <div style={tb}>{[["tasks","📋 Tarefas"],["responses","✅ Respostas"],["diario","📔 Diário"],["prontuario","📁 Prontuário"]].map(([id,label])=><button key={id} onClick={()=>setTab(id)} style={tBtn(tab===id)}>{label}</button>)}</div>
      <div style={ct}>
        {tab==="tasks"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <h2 style={h2s}>Tarefas ({tasks.length})</h2><button onClick={()=>setShowAdd(true)} style={btn()}>+ Nova</button>
          </div>
          {showAdd&&<div style={{...crd,marginBottom:16}}>
            <select value={tt} onChange={e=>setTt(e.target.value)} style={inp}><option value="">Tipo...</option>{TASK_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
            <input placeholder="Título" value={ttitle} onChange={e=>setTtitle(e.target.value)} style={inp}/>
            <textarea placeholder="Instruções (opcional)" value={tnote} onChange={e=>setTnote(e.target.value)} style={{...inp,minHeight:60,resize:"vertical"}}/>
            <div style={{display:"flex",gap:8}}><button onClick={addTask} style={btn()}>Adicionar</button><button onClick={()=>setShowAdd(false)} style={btn("#e5e7eb")}>Cancelar</button></div>
          </div>}
          {tasks.length===0&&<EmptyState icon="📋" text="Nenhuma tarefa ainda."/>}
          {tasks.map(task=>{ const ti=getTypeInfo(task.type); return <div key={task.id} style={{background:"#fff",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)",border:`2px solid ${ti.color}22`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div onClick={()=>setViewTask(task)} style={{flex:1,cursor:"pointer"}}>
                <span style={{fontSize:11,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"2px 8px",borderRadius:20}}>{ti.label}</span>
                <div style={{fontWeight:700,marginTop:6,color:"#1f2937"}}>{task.title}</div>
                {task.note&&<div style={{fontSize:12,color:"#888",marginTop:3}}>{task.note}</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,marginLeft:8}}>
                <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:task.response?"#d1fae5":"#fef3c7",color:task.response?"#065f46":"#92400e",whiteSpace:"nowrap"}}>{task.response?"✅":"⏳"}</span>
                <button onClick={()=>setConfirmDel(task)} style={{background:"#fee2e2",border:"none",borderRadius:8,padding:"4px 8px",cursor:"pointer",fontSize:12,color:"#e11d48",fontWeight:700}}>🗑</button>
              </div>
            </div>
          </div>; })}
        </>}
        {tab==="responses"&&<>
          <h2 style={h2s}>Respostas</h2>
          {tasks.filter(t=>t.response).length===0&&<EmptyState icon="✅" text="Nenhuma resposta ainda."/>}
          {tasks.filter(t=>t.response).map(task=>{ const ti=getTypeInfo(task.type); return <div key={task.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
            <span style={{fontSize:11,fontWeight:700,color:ti.color}}>{ti.label}</span>
            <div style={{fontWeight:700,marginBottom:8,color:"#1f2937"}}>{task.title}</div>
            <ResponseView response={task.response} type={task.type}/>
            {task.answeredAt&&<div style={{fontSize:11,color:"#aaa",marginTop:8}}>Respondida em {task.answeredAt}</div>}
          </div>; })}
        </>}
        {tab==="diario"&&<>
          <h2 style={h2s}>📔 Diário de Emoções ({diarios.length})</h2>
          {diarios.length===0&&<EmptyState icon="📔" text="Nenhum registro ainda."/>}
          {diarios.map((d,i)=>{
            const em=EMOCOES.find(e=>e.nome===d.emocao)||{emoji:"😐",color:"#888",bg:"#f3f4f6"};
            return <div key={i} style={{background:"#fff",borderRadius:12,padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.06)",borderLeft:`4px solid ${em.color}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:24}}>{em.emoji}</span>
                  <span style={{fontWeight:700,color:em.color}}>{d.emocao}</span>
                  <span style={{fontSize:12,background:`${em.color}20`,color:em.color,padding:"2px 8px",borderRadius:20,fontWeight:700}}>Intensidade {d.intensidade}/10</span>
                </div>

  // ── Teste de Atenção ──
  function AtencaoForm({color,onSubmit}) {
    const [fase,setFase]=useState("intro"); const [timeLeft,setTimeLeft]=useState(40);
    const [totalScore,setTotalScore]=useState(0); const [totalMisses,setTotalMisses]=useState(0);
    const [currentPage,setCurrentPage]=useState(1); const [items,setItems]=useState([]);
    const [clicked,setClicked]=useState(new Set()); const [pageClicked,setPageClicked]=useState(new Set());
    const [pageTargets,setPageTargets]=useState(0); const [totalTargets,setTotalTargets]=useState(0);
    const [showTurn,setShowTurn]=useState(false); const [result,setResult]=useState(null);
    const timerRef=useRef(null); const scoreRef=useRef(0); const missesRef=useRef(0); const targetsRef=useRef(0); const timeRef=useRef(40); const pageRef=useRef(1); const pageClickedRef=useRef(new Set()); const pageTargetsRef=useRef(0);

    const SHAPES=["quadrado","circulo","triangulo","losango","estrela"];
    const COLORS=["#6d28d9","#e11d48","#059669","#d97706","#0891b2","#7c3aed","#dc2626","#0284c7","#b45309","#0f766e"];
    const TARGETS=["quadrado","triangulo"];

    function getDiff(page) {
      if(page===1) return {cols:5,rows:6,ratio:.35,size:38};
      if(page===2) return {cols:6,rows:7,ratio:.30,size:33};
      if(page===3) return {cols:6,rows:8,ratio:.25,size:30};
      if(page===4) return {cols:7,rows:8,ratio:.22,size:27};
      return {cols:7,rows:9,ratio:.20,size:24};
    }

    function buildItems(page) {
      const d=getDiff(page); const total=d.cols*d.rows;
      const nT=Math.max(4,Math.floor(total*d.ratio));
      const arr=[];
      for(let i=0;i<nT;i++) arr.push(TARGETS[i%2]);
      while(arr.length<total) arr.push(SHAPES.filter(s=>!TARGETS.includes(s))[Math.floor(Math.random()*3)]);
      arr.sort(()=>Math.random()-.5);
      return {arr,cols:d.cols,nT,size:d.size};
    }

    function drawShape(type,color,size) {
      const s=size,h=size;
      if(type==="quadrado") return `<rect x="2" y="2" width="${s-4}" height="${h-4}" rx="3" fill="${color}"/>`;
      if(type==="circulo")  return `<circle cx="${s/2}" cy="${h/2}" r="${s/2-2}" fill="${color}"/>`;
      if(type==="triangulo") return `<polygon points="${s/2},2 ${s-2},${h-2} 2,${h-2}" fill="${color}"/>`;
      if(type==="losango")  return `<polygon points="${s/2},2 ${s-2},${h/2} ${s/2},${h-2} 2,${h/2}" fill="${color}"/>`;
      if(type==="estrela") { const cx=s/2,cy=h/2,r1=s/2-2,r2=s/4; let pts=""; for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2===0?r1:r2;pts+=`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} `;} return `<polygon points="${pts}" fill="${color}"/>`; }
    }

    function startGame() {
      scoreRef.current=0; missesRef.current=0; targetsRef.current=0; timeRef.current=40; pageRef.current=1;
      pageClickedRef.current=new Set(); setClicked(new Set()); setTotalScore(0); setTotalMisses(0); setCurrentPage(1); setTimeLeft(40);
      const {arr,cols,nT,size}=buildItems(1);
      setPageTargets(nT); pageTargetsRef.current=nT; setPageClicked(new Set());
      targetsRef.current=nT; setTotalTargets(nT);
      setItems(arr.map((type,i)=>({type,i,color:COLORS[Math.floor(Math.random()*COLORS.length)],size:size+Math.floor(Math.random()*8)-4,cols,state:"idle"})));
      setFase("game");
      timerRef.current=setInterval(()=>{
        timeRef.current--;
        setTimeLeft(timeRef.current);
        if(timeRef.current<=0) endGame();
      },1000);
    }

    function handleClick(idx,type) {
      if(pageClickedRef.current.has(idx)) return;
      pageClickedRef.current.add(idx);
      setPageClicked(new Set(pageClickedRef.current));
      if(TARGETS.includes(type)) {
        scoreRef.current++;
        setTotalScore(scoreRef.current);
        setItems(prev=>prev.map((it,i)=>i===idx?{...it,state:"correct"}:it));
        // check page complete
        const pageAcertos=[...pageClickedRef.current].filter(i=>{ const it=items[i]; return it&&TARGETS.includes(it.type); }).length;
        if(pageAcertos+1>=pageTargetsRef.current) setTimeout(()=>doPageTurn(),300);
      } else {
        missesRef.current++;
        setTotalMisses(missesRef.current);
        setItems(prev=>prev.map((it,i)=>i===idx?{...it,state:"wrong"}:it));
      }
    }

    function doPageTurn() {
      if(timeRef.current<=0) return;
      setShowTurn(true);
      const nextPage=pageRef.current+1;
      pageRef.current=nextPage;
      setCurrentPage(nextPage);
      pageClickedRef.current=new Set();
      setPageClicked(new Set());
      setTimeout(()=>{
        const {arr,cols,nT,size}=buildItems(nextPage);
        pageTargetsRef.current=nT; setPageTargets(nT);
        targetsRef.current+=nT; setTotalTargets(t=>t+nT);
        setItems(arr.map((type,i)=>({type,i,color:COLORS[Math.floor(Math.random()*COLORS.length)],size:size+Math.floor(Math.random()*8)-4,cols,state:"idle"})));
        setTimeout(()=>setShowTurn(false),500);
      },400);
    }

    function endGame() {
      clearInterval(timerRef.current);
      const precisao=(scoreRef.current+missesRef.current)>0?Math.round(scoreRef.current/(scoreRef.current+missesRef.current)*100):0;
      const cobertura=targetsRef.current>0?Math.round(scoreRef.current/targetsRef.current*100):0;
      setItems(prev=>prev.map(it=>TARGETS.includes(it.type)&&it.state==="idle"?{...it,state:"missed"}:it));
      setResult({paginas:pageRef.current,acertos:scoreRef.current,erros:missesRef.current,precisao,cobertura});
      setFase("result");
    }

    const cols=items[0]?.cols||5;
    const urgent=timeLeft<=10;

    if(fase==="intro") return <div style={{...crd,textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:12}}>🎯</div>
      <h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Teste de Atenção</h3>
      <p style={{fontSize:13,color:"#6b7280",marginBottom:20,lineHeight:1.6}}>Toque em todos os <strong>quadrados</strong> e <strong>triângulos</strong> que encontrar!</p>
      <div style={{display:"flex",justifyContent:"center",gap:24,marginBottom:20}}>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
          <svg width="48" height="48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#6d28d9"/></svg>
          <span style={{fontSize:11,fontWeight:700}}>Quadrado ✅</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
          <svg width="48" height="48"><polygon points="24,4 46,44 2,44" fill="#0891b2"/></svg>
          <span style={{fontSize:11,fontWeight:700}}>Triângulo ✅</span>
        </div>
      </div>
      <div style={{background:"#fef3c7",borderRadius:10,padding:12,fontSize:13,color:"#92400e",fontWeight:600,marginBottom:20}}>⏱ <strong>40 segundos</strong> — Se acertar todos, avança de página!</div>
      <button onClick={startGame} style={{...btn(color),width:"100%"}}>Começar!</button>
    </div>;

    if(fase==="result") return <div style={crd}>
      <div style={{textAlign:"center",marginBottom:16}}>
        <div style={{fontSize:48,marginBottom:8}}>{result.precisao>=80?"🏆":result.precisao>=60?"🎉":"💪"}</div>
        <h3 style={{fontSize:18,fontWeight:800,color:"#1f2937"}}>{result.precisao>=80?"Excelente!":result.precisao>=60?"Muito bem!":"Continue tentando!"}</h3>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[[result.paginas,"Páginas","#6d28d9"],[result.acertos,"Acertos","#059669"],[result.erros,"Erros","#e11d48"],[`${result.precisao}%`,"Precisão","#0891b2"]].map(([v,l,c])=><div key={l} style={{background:"#f9fafb",borderRadius:12,padding:12,textAlign:"center"}}><div style={{fontSize:24,fontWeight:900,color:c}}>{v}</div><div style={{fontSize:11,color:"#888"}}>{l}</div></div>)}
      </div>
      <button onClick={()=>onSubmit(result)} style={{...btn(color),width:"100%"}}>Salvar resultado</button>
      <button onClick={startGame} style={{...btn("#e5e7eb"),width:"100%",marginTop:8}}>Tentar novamente</button>
    </div>;

    return <div style={{position:"relative"}}>
      {showTurn&&<div style={{position:"fixed",inset:0,zIndex:100,pointerEvents:"none",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,background:"linear-gradient(to right,#fafafa,#fff)",transformOrigin:"left center",animation:"slideOut .9s cubic-bezier(.77,0,.18,1) forwards"}}/>
        <div style={{position:"absolute",inset:0,background:"#fff",transform:"translateX(100%)",animation:"slideIn .9s cubic-bezier(.77,0,.18,1) forwards"}}/>
        <style>{`@keyframes slideOut{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}@keyframes slideIn{0%{transform:translateX(100%)}100%{transform:translateX(0)}}`}</style>
      </div>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 4px",marginBottom:8}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:26,fontWeight:900,color:urgent?"#e11d48":"#6d28d9",animation:urgent?"pulse .4s infinite alternate":""}}>{timeLeft}</div>
          <div style={{fontSize:10,color:"#aaa"}}>segundos</div>
        </div>
        <div style={{background:"#ede9fe",color:"#6d28d9",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:800}}>Página {currentPage}</div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:20,fontWeight:800,color:"#059669"}}>{totalScore}</div>
          <div style={{fontSize:10,color:"#aaa"}}>acertos</div>
          <div style={{fontSize:12,fontWeight:700,color:"#e11d48"}}>{totalMisses} erro{totalMisses!==1?"s":""}</div>
        </div>
      </div>
      <div style={{background:"#ede9fe",borderRadius:10,padding:"7px 12px",marginBottom:10,fontSize:12,color:"#5b21b6",fontWeight:600,textAlign:"center"}}>Toque nos <strong>quadrados</strong> e <strong>triângulos</strong>!</div>
      <div style={{display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gap:6}}>
        {items.map((it,idx)=><button key={idx} onClick={()=>handleClick(idx,it.type)}
          style={{background:it.state==="correct"?"#d1fae5":it.state==="wrong"?"#fee2e2":"transparent",border:"none",cursor:"pointer",padding:2,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",aspectRatio:"1",opacity:it.state==="missed"?.35:1,transition:"background .2s"}}>
          <svg width={it.size} height={it.size} dangerouslySetInnerHTML={{__html:drawShape(it.type,it.color,it.size)}}/>
        </button>)}
      </div>
    </div>;
  }

  function ResponseView({response,type}) {
    if (!response) return null;
    const items=[];
    if(type==="pensamentos") items.push(["Situação",response.situacao],["Pensamento",response.pensamento],["Emoção",response.emocao],["Intensidade",`${response.intensidade}/10`],["Alternativo",response.pensamentoAlternativo]);
    if(type==="atencao") items.push(["Páginas",response.paginas],["Acertos",response.acertos],["Erros",response.erros],["Precisão",`${response.precisao}%`]);
    if(type==="experimento") items.push(["Hipótese",response.hipotese],["Ação",response.acao],["Resultado",response.resultado],["Aprendizado",response.aprendizado]);
    if(type==="escala") { ESCALAS_DEF.forEach(s=>items.push([s.nome,`${response[s.id]}%`])); if(response.obs) items.push(["Obs",response.obs]); }
    return <div style={{display:"flex",flexDirection:"column",gap:6}}>{items.filter(([,v])=>v!=null&&v!=="").map(([k,v])=><div key={k} style={{fontSize:13}}><strong style={{color:"#374151"}}>{k}:</strong> <span style={{color:"#555"}}>{v}</span></div>)}</div>;
  }

  // ── Root ──
  function App() {
    const [ready,setReady]=useState(window._firebaseReady||false);
    const [session,setSession]=useState({role:null,patientId:null});
    useEffect(()=>{ if(!ready){ const h=()=>setReady(true); window.addEventListener("firebaseReady",h); return ()=>window.removeEventListener("firebaseReady",h); } },[ready]);
    if (!ready) return <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#6d28d9,#0ea5e9)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{color:"#fff",textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>🧠</div><div style={{fontSize:16,fontWeight:700}}>TCC Terapeuta</div><div style={{fontSize:13,marginTop:8,opacity:.8}}>Conectando...</div></div>
    </div>;
    if (!session.role) return <LoginScreen onLogin={(role,pid)=>setSession({role,patientId:pid})}/>;
    if (session.role==="therapist") return <TherapistApp onLogout={()=>setSession({role:null,patientId:null})}/>;
    return <PatientApp patientId={session.patientId} onLogout={()=>setSession({role:null,patientId:null})}/>;
  }

  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
</script>
</body>
</html>
