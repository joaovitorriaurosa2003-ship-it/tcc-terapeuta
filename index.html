<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC Terapeuta</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrQDc6-GANiIcU_Eg2X5J7XMLRQwh7UQo",
      authDomain: "meupsi-91fad.firebaseapp.com",
      projectId: "meupsi-91fad",
      storageBucket: "meupsi-91fad.firebasestorage.app",
      messagingSenderId: "70457582233",
      appId: "1:70457582233:web:4114186b782d888d9e8e08",
      databaseURL: "https://terapeutaj-rosa-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window._db = db;
    window._ref = ref;
    window._set = set;
    window._get = get;
    window._update = update;
    window._onValue = onValue;
    window._firebaseReady = true;
    window.dispatchEvent(new Event("firebaseReady"));
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; max-width: 480px; margin: 0 auto; }
    input, textarea, select, button { font-family: inherit; font-size: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TASK_TYPES = [
      { id: "diario", label: "📔 Diário de Emoções", color: "#7c3aed" },
      { id: "pensamentos", label: "💭 Pensamentos Automáticos", color: "#0891b2" },
      { id: "atencao", label: "🎯 Teste de Atenção", color: "#d97706" },
      { id: "experimento", label: "🔬 Experimento Comportamental", color: "#059669" },
      { id: "escala", label: "📊 Escala de Humor/Ansiedade", color: "#e11d48" },
    ];

    function getTypeInfo(id) { return TASK_TYPES.find(t => t.id === id) || {}; }

    // ── Firebase helpers ──
    async function fbGet(path) {
      const snap = await window._get(window._ref(window._db, path));
      return snap.exists() ? snap.val() : null;
    }
    async function fbSet(path, val) {
      await window._set(window._ref(window._db, path), val);
    }
    async function fbUpdate(path, val) {
      await window._update(window._ref(window._db, path), val);
    }
    function fbListen(path, cb) {
      return window._onValue(window._ref(window._db, path), snap => cb(snap.exists() ? snap.val() : null));
    }

    // ── Styles ──
    const appWrap = { minHeight: "100vh", background: "#f3f4f6", display: "flex", flexDirection: "column" };
    const content = { padding: "16px 16px 40px", flex: 1, overflowY: "auto" };
    const tabBar = { display: "flex", background: "#fff", borderBottom: "1px solid #e5e7eb", overflowX: "auto" };
    const tabBtn = a => ({ padding: "12px 16px", border: "none", background: "none", cursor: "pointer", fontWeight: 600, fontSize: 13, color: a ? "#6d28d9" : "#888", borderBottom: a ? "2px solid #6d28d9" : "2px solid transparent", whiteSpace: "nowrap" });
    const h2 = { fontSize: 16, fontWeight: 800, color: "#1f2937", margin: "0 0 12px" };
    const inp = { width: "100%", padding: "10px 12px", borderRadius: 10, border: "1px solid #e5e7eb", fontSize: 15, marginBottom: 10, outline: "none", background: "#fafafa", display: "block" };
    const btn = (bg="#6d28d9") => ({ background: bg, color: bg==="#e5e7eb"?"#374151":"#fff", border: "none", borderRadius: 10, padding: "10px 18px", cursor: "pointer", fontWeight: 700, fontSize: 14 });
    const lbl = { fontSize: 12, fontWeight: 700, color: "#374151", display: "block", marginBottom: 4 };
    const card = { background: "#fff", borderRadius: 14, padding: 20, boxShadow: "0 2px 12px rgba(0,0,0,.08)" };

    function Header({ title, subtitle, onLogout, logoutLabel = "Sair" }) {
      return (
        <div style={{ background: "linear-gradient(135deg,#6d28d9,#0ea5e9)", padding: "16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ color: "#fff", fontWeight: 800, fontSize: 17 }}>{title}</div>
            <div style={{ color: "rgba(255,255,255,.7)", fontSize: 12 }}>{subtitle}</div>
          </div>
          <button onClick={onLogout} style={{ background: "rgba(255,255,255,.2)", border: "none", color: "#fff", padding: "6px 12px", borderRadius: 8, cursor: "pointer", fontSize: 12 }}>{logoutLabel}</button>
        </div>
      );
    }

    function EmptyState({ icon, text }) {
      return <div style={{ textAlign: "center", padding: "40px 20px", color: "#aaa" }}><div style={{ fontSize: 40, marginBottom: 8 }}>{icon}</div><p style={{ fontSize: 14 }}>{text}</p></div>;
    }

    function Spinner() {
      return <div style={{ textAlign: "center", padding: 40, color: "#6d28d9", fontSize: 14 }}>⏳ Carregando...</div>;
    }

    // ── Login ──
    function LoginScreen({ onLogin }) {
      const [role, setRole] = useState("therapist");
      const [patientId, setPatientId] = useState("");
      const [pass, setPass] = useState("");
      const [err, setErr] = useState("");
      const [loading, setLoading] = useState(false);

      async function handle() {
        setErr(""); setLoading(true);
        try {
          if (role === "therapist") {
            const data = await fbGet("therapist");
            const stored = data?.password || "1234";
            if (pass === stored) onLogin("therapist", null);
            else setErr("Senha incorreta.");
          } else {
            const p = await fbGet(`patients/${patientId}`);
            if (!p) { setErr("Paciente não encontrado."); setLoading(false); return; }
            if (p.password && p.password !== pass) { setErr("Senha incorreta."); setLoading(false); return; }
            onLogin("patient", patientId);
          }
        } catch(e) { setErr("Erro de conexão. Tente novamente."); }
        setLoading(false);
      }

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#6d28d9,#0ea5e9)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
          <div style={{ background: "#fff", borderRadius: 20, padding: 36, width: "100%", maxWidth: 340, boxShadow: "0 20px 60px rgba(0,0,0,.2)" }}>
            <h1 style={{ textAlign: "center", marginBottom: 6, color: "#6d28d9", fontSize: 22 }}>🧠 TCC Terapeuta</h1>
            <p style={{ textAlign: "center", color: "#888", marginBottom: 24, fontSize: 13 }}>Tarefas terapêuticas TCC</p>
            <div style={{ display: "flex", marginBottom: 20, borderRadius: 10, overflow: "hidden", border: "1px solid #e5e7eb" }}>
              {["therapist","patient"].map(r => (
                <button key={r} onClick={() => { setRole(r); setErr(""); }}
                  style={{ flex: 1, padding: "10px 0", background: role===r?"#6d28d9":"#fff", color: role===r?"#fff":"#666", border: "none", cursor: "pointer", fontWeight: 600, fontSize: 13 }}>
                  {r==="therapist"?"Terapeuta":"Paciente"}
                </button>
              ))}
            </div>
            {role==="patient" && <input placeholder="ID do paciente" value={patientId} onChange={e=>setPatientId(e.target.value)} style={inp} />}
            <input type="password" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} style={inp} />
            {err && <p style={{ color:"#e11d48", fontSize:12, marginBottom:8 }}>{err}</p>}
            <button onClick={handle} disabled={loading} style={{ ...btn(), width:"100%" }}>{loading?"Entrando...":"Entrar"}</button>
            {role==="therapist" && <p style={{ textAlign:"center", fontSize:11, color:"#aaa", marginTop:8 }}>Senha padrão: 1234</p>}
          </div>
        </div>
      );
    }

    // ── Therapist ──
    function TherapistApp({ onLogout }) {
      const [tab, setTab] = useState("patients");
      const [patients, setPatients] = useState(null);
      const [selPatient, setSelPatient] = useState(null);

      useEffect(() => {
        const unsub = fbListen("patients", data => setPatients(data ? Object.values(data) : []));
        return () => unsub();
      }, []);

      async function addPatient() {
        const name = prompt("Nome do paciente:");
        if (!name) return;
        const password = prompt("Senha do paciente:") || "1234";
        const id = "p" + Date.now();
        await fbSet(`patients/${id}`, { id, name, password, tasks: {}, prontuario: { diagnostico:"", medicacoes:"", historico:"", anotacoes:"", evolucao:{} } });
      }

      if (patients === null) return <div style={appWrap}><Header title="🧠 TCC Terapeuta" subtitle="Painel do Terapeuta" onLogout={onLogout} /><Spinner /></div>;

      if (selPatient) {
        const p = patients.find(p=>p.id===selPatient);
        if (p) return <PatientDetail patient={p} onBack={()=>setSelPatient(null)} />;
      }

      return (
        <div style={appWrap}>
          <Header title="🧠 TCC Terapeuta" subtitle="Painel do Terapeuta" onLogout={onLogout} />
          <div style={tabBar}>
            {[["patients","👥 Pacientes"],["overview","📈 Visão Geral"]].map(([id,label])=>(
              <button key={id} onClick={()=>setTab(id)} style={tabBtn(tab===id)}>{label}</button>
            ))}
          </div>
          <div style={content}>
            {tab==="patients" && (
              <>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                  <h2 style={h2}>Meus Pacientes</h2>
                  <button onClick={addPatient} style={btn()}>+ Novo Paciente</button>
                </div>
                {patients.length===0 && <EmptyState icon="👤" text="Nenhum paciente cadastrado ainda." />}
                <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                  {patients.map(p=>(
                    <div key={p.id} onClick={()=>setSelPatient(p.id)}
                      style={{ background:"#fff", borderRadius:12, padding:"14px 18px", cursor:"pointer", boxShadow:"0 2px 8px rgba(0,0,0,.06)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <div>
                        <div style={{ fontWeight:700, color:"#1f2937" }}>{p.name}</div>
                        <div style={{ fontSize:12, color:"#888", marginTop:2 }}>ID: {p.id} · {p.tasks?Object.keys(p.tasks).length:0} tarefa(s)</div>
                      </div>
                      <span style={{ fontSize:20 }}>›</span>
                    </div>
                  ))}
                </div>
              </>
            )}
            {tab==="overview" && (
              <div>
                <h2 style={h2}>Visão Geral</h2>
                {patients.length===0 && <EmptyState icon="📊" text="Nenhum dado ainda." />}
                {patients.map(p=>{
                  const tasks = p.tasks ? Object.values(p.tasks) : [];
                  const done = tasks.filter(t=>t.response).length;
                  return (
                    <div key={p.id} style={{ background:"#fff", borderRadius:12, padding:16, marginBottom:10, boxShadow:"0 2px 8px rgba(0,0,0,.06)" }}>
                      <div style={{ fontWeight:700, marginBottom:6 }}>{p.name}</div>
                      <div style={{ fontSize:13, color:"#666" }}>Tarefas: {done}/{tasks.length} respondidas</div>
                      <div style={{ background:"#f3f4f6", borderRadius:8, height:8, marginTop:8, overflow:"hidden" }}>
                        <div style={{ width:tasks.length?`${(done/tasks.length)*100}%`:"0%", background:"#6d28d9", height:"100%", borderRadius:8 }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function PatientDetail({ patient, onBack }) {
      const [tab, setTab] = useState("tasks");
      const [livePatient, setLivePatient] = useState(patient);
      const [showAddTask, setShowAddTask] = useState(false);
      const [taskType, setTaskType] = useState(""); const [taskTitle, setTaskTitle] = useState(""); const [taskNote, setTaskNote] = useState("");
      const [pron, setPron] = useState(patient.prontuario||{});
      const [pronSaved, setPronSaved] = useState(false);
      const [newEvolucao, setNewEvolucao] = useState("");

      useEffect(() => {
        const unsub = fbListen(`patients/${patient.id}`, data => { if(data) { setLivePatient(data); setPron(data.prontuario||{}); } });
        return () => unsub();
      }, [patient.id]);

      async function addTask() {
        if (!taskType||!taskTitle) return;
        const id = "t"+Date.now();
        await fbSet(`patients/${patient.id}/tasks/${id}`, { id, type:taskType, title:taskTitle, note:taskNote, response:null, createdAt:new Date().toLocaleDateString("pt-BR") });
        setTaskType(""); setTaskTitle(""); setTaskNote(""); setShowAddTask(false);
      }

      async function removeTask(tid) {
        if (!confirm("Remover tarefa?")) return;
        await fbSet(`patients/${patient.id}/tasks/${tid}`, null);
      }

      async function saveProntuario() {
        await fbSet(`patients/${patient.id}/prontuario`, pron);
        setPronSaved(true); setTimeout(()=>setPronSaved(false),2000);
      }

      async function addEvolucao() {
        if (!newEvolucao.trim()) return;
        const id = "e"+Date.now();
        await fbSet(`patients/${patient.id}/prontuario/evolucao/${id}`, { date:new Date().toLocaleDateString("pt-BR"), text:newEvolucao });
        setNewEvolucao("");
      }

      const tasks = livePatient.tasks ? Object.values(livePatient.tasks) : [];
      const evolucao = pron.evolucao ? Object.values(pron.evolucao).reverse() : [];

      return (
        <div style={appWrap}>
          <Header title={`👤 ${patient.name}`} subtitle={`ID: ${patient.id}`} onLogout={onBack} logoutLabel="← Voltar" />
          <div style={tabBar}>
            {[["tasks","📋 Tarefas"],["responses","✅ Respostas"],["prontuario","📁 Prontuário"]].map(([id,label])=>(
              <button key={id} onClick={()=>setTab(id)} style={tabBtn(tab===id)}>{label}</button>
            ))}
          </div>
          <div style={content}>
            {tab==="tasks" && (
              <>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                  <h2 style={h2}>Tarefas Atribuídas</h2>
                  <button onClick={()=>setShowAddTask(true)} style={btn()}>+ Nova Tarefa</button>
                </div>
                {showAddTask && (
                  <div style={{ ...card, marginBottom:16, border:"1px solid #e5e7eb" }}>
                    <h3 style={{ marginBottom:12, color:"#1f2937", fontSize:15 }}>Nova Tarefa</h3>
                    <select value={taskType} onChange={e=>setTaskType(e.target.value)} style={inp}>
                      <option value="">Selecione o tipo...</option>
                      {TASK_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
                    </select>
                    <input placeholder="Título da tarefa" value={taskTitle} onChange={e=>setTaskTitle(e.target.value)} style={inp} />
                    <textarea placeholder="Instruções (opcional)" value={taskNote} onChange={e=>setTaskNote(e.target.value)} style={{ ...inp, minHeight:60, resize:"vertical" }} />
                    <div style={{ display:"flex", gap:8 }}>
                      <button onClick={addTask} style={btn()}>Adicionar</button>
                      <button onClick={()=>setShowAddTask(false)} style={btn("#e5e7eb")}>Cancelar</button>
                    </div>
                  </div>
                )}
                {tasks.length===0 && <EmptyState icon="📋" text="Nenhuma tarefa ainda." />}
                {tasks.map(task=>{
                  const ti=getTypeInfo(task.type);
                  return (
                    <div key={task.id} style={{ background:"#fff", borderRadius:12, padding:14, marginBottom:10, boxShadow:"0 2px 8px rgba(0,0,0,.06)", border:`2px solid ${ti.color}22` }}>
                      <div style={{ display:"flex", justifyContent:"space-between" }}>
                        <div>
                          <span style={{ fontSize:11, fontWeight:700, color:ti.color, background:`${ti.color}15`, padding:"2px 8px", borderRadius:20 }}>{ti.label}</span>
                          <div style={{ fontWeight:700, marginTop:6, color:"#1f2937" }}>{task.title}</div>
                          {task.note && <div style={{ fontSize:12, color:"#888", marginTop:3 }}>{task.note}</div>}
                        </div>
                        <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:6 }}>
                          <span style={{ fontSize:11, padding:"2px 8px", borderRadius:20, background:task.response?"#d1fae5":"#fef3c7", color:task.response?"#065f46":"#92400e" }}>
                            {task.response?"✅ Respondida":"⏳ Pendente"}
                          </span>
                          <button onClick={()=>removeTask(task.id)} style={{ fontSize:11, color:"#e11d48", background:"none", border:"none", cursor:"pointer" }}>🗑 Remover</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </>
            )}
            {tab==="responses" && (
              <>
                <h2 style={h2}>Respostas do Paciente</h2>
                {tasks.filter(t=>t.response).length===0 && <EmptyState icon="✅" text="Nenhuma resposta ainda." />}
                {tasks.filter(t=>t.response).map(task=>{
                  const ti=getTypeInfo(task.type);
                  return (
                    <div key={task.id} style={{ background:"#fff", borderRadius:12, padding:16, marginBottom:12, boxShadow:"0 2px 8px rgba(0,0,0,.06)" }}>
                      <span style={{ fontSize:11, fontWeight:700, color:ti.color }}>{ti.label}</span>
                      <div style={{ fontWeight:700, marginBottom:8, color:"#1f2937" }}>{task.title}</div>
                      <ResponseView response={task.response} type={task.type} />
                    </div>
                  );
                })}
              </>
            )}
            {tab==="prontuario" && (
              <div>
                <h2 style={h2}>📁 Prontuário</h2>
                <div style={{ ...card, marginBottom:16 }}>
                  {[["diagnostico","Diagnóstico","CID, hipóteses diagnósticas..."],["medicacoes","Medicações","Medicações em uso..."],["historico","Histórico Clínico","Histórico relevante, queixa principal..."],["anotacoes","Anotações Gerais","Observações clínicas..."]].map(([field,label,ph])=>(
                    <div key={field}>
                      <label style={lbl}>{label}</label>
                      <textarea value={pron[field]||""} onChange={e=>setPron({...pron,[field]:e.target.value})} placeholder={ph} style={{ ...inp, minHeight:70, resize:"vertical" }} />
                    </div>
                  ))}
                  <button onClick={saveProntuario} style={btn()}>{pronSaved?"✅ Salvo!":"Salvar Prontuário"}</button>
                </div>
                <div style={card}>
                  <h3 style={{ fontSize:15, marginBottom:12, color:"#1f2937" }}>📝 Evolução em Sessão</h3>
                  <textarea value={newEvolucao} onChange={e=>setNewEvolucao(e.target.value)} placeholder={`Registro — ${new Date().toLocaleDateString("pt-BR")}`} style={{ ...inp, minHeight:80, resize:"vertical" }} />
                  <button onClick={addEvolucao} style={btn()}>+ Adicionar Registro</button>
                  <div style={{ marginTop:16, display:"flex", flexDirection:"column", gap:10 }}>
                    {evolucao.length===0 && <p style={{ color:"#aaa", fontSize:13 }}>Nenhum registro ainda.</p>}
                    {evolucao.map((ev,i)=>(
                      <div key={i} style={{ background:"#f9fafb", borderRadius:10, padding:12, borderLeft:"3px solid #6d28d9" }}>
                        <div style={{ fontSize:11, color:"#888", marginBottom:4 }}>{ev.date}</div>
                        <div style={{ fontSize:13, color:"#374151", whiteSpace:"pre-wrap" }}>{ev.text}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── Patient App ──
    function PatientApp({ patientId, onLogout }) {
      const [patient, setPatient] = useState(null);
      const [selTask, setSelTask] = useState(null);

      useEffect(() => {
        const unsub = fbListen(`patients/${patientId}`, data => setPatient(data));
        return () => unsub();
      }, [patientId]);

      async function submitResponse(taskId, response) {
        await fbUpdate(`patients/${patientId}/tasks/${taskId}`, { response, answeredAt: new Date().toLocaleDateString("pt-BR") });
        setSelTask(null);
      }

      if (!patient) return <div style={appWrap}><Spinner /></div>;

      const tasks = patient.tasks ? Object.values(patient.tasks) : [];
      const pending = tasks.filter(t=>!t.response);
      const done = tasks.filter(t=>t.response);

      if (selTask) {
        const task = tasks.find(t=>t.id===selTask);
        if (task) return <TaskForm task={task} onSubmit={r=>submitResponse(task.id,r)} onBack={()=>setSelTask(null)} />;
      }

      return (
        <div style={appWrap}>
          <Header title={`Olá, ${patient.name}! 👋`} subtitle="Suas tarefas terapêuticas" onLogout={onLogout} />
          <div style={content}>
            {tasks.length===0 && <EmptyState icon="🎉" text="Nenhuma tarefa ainda. Fale com seu terapeuta." />}
            {pending.length>0 && (
              <>
                <h2 style={h2}>⏳ Pendentes ({pending.length})</h2>
                {pending.map(task=>{
                  const ti=getTypeInfo(task.type);
                  return (
                    <div key={task.id} onClick={()=>setSelTask(task.id)}
                      style={{ background:"#fff", borderRadius:12, padding:16, marginBottom:10, cursor:"pointer", boxShadow:"0 2px 8px rgba(0,0,0,.08)", borderLeft:`4px solid ${ti.color}` }}>
                      <span style={{ fontSize:11, fontWeight:700, color:ti.color }}>{ti.label}</span>
                      <div style={{ fontWeight:700, color:"#1f2937", marginTop:4 }}>{task.title}</div>
                      {task.note && <div style={{ fontSize:12, color:"#888", marginTop:3 }}>{task.note}</div>}
                      <div style={{ marginTop:8, fontSize:12, color:ti.color, fontWeight:600 }}>Toque para responder →</div>
                    </div>
                  );
                })}
              </>
            )}
            {done.length>0 && (
              <>
                <h2 style={{ ...h2, marginTop:20 }}>✅ Concluídas ({done.length})</h2>
                {done.map(task=>{
                  const ti=getTypeInfo(task.type);
                  return (
                    <div key={task.id} style={{ background:"#f9fafb", borderRadius:12, padding:14, marginBottom:8, borderLeft:`4px solid #d1d5db`, opacity:.8 }}>
                      <span style={{ fontSize:11, color:"#888" }}>{ti.label}</span>
                      <div style={{ fontWeight:600, color:"#6b7280" }}>{task.title}</div>
                      <div style={{ fontSize:11, color:"#aaa" }}>Respondida em {task.answeredAt}</div>
                    </div>
                  );
                })}
              </>
            )}
          </div>
        </div>
      );
    }

    // ── Task Forms ──
    function TaskForm({ task, onSubmit, onBack }) {
      const ti=getTypeInfo(task.type);
      return (
        <div style={appWrap}>
          <Header title={ti.label} subtitle={task.title} onLogout={onBack} logoutLabel="← Voltar" />
          <div style={content}>
            {task.note && <div style={{ background:`${ti.color}15`, borderRadius:10, padding:12, marginBottom:16, borderLeft:`3px solid ${ti.color}` }}><p style={{ fontSize:13, color:"#374151" }}><strong>Orientação:</strong> {task.note}</p></div>}
            {task.type==="diario" && <DiarioForm color={ti.color} onSubmit={onSubmit} />}
            {task.type==="pensamentos" && <PensamentosForm color={ti.color} onSubmit={onSubmit} />}
            {task.type==="atencao" && <AtencaoForm color={ti.color} onSubmit={onSubmit} />}
            {task.type==="experimento" && <ExperimentoForm color={ti.color} onSubmit={onSubmit} />}
            {task.type==="escala" && <EscalaForm color={ti.color} onSubmit={onSubmit} />}
          </div>
        </div>
      );
    }

    function DiarioForm({ color, onSubmit }) {
      const [emocao,setEmocao]=useState(""); const [intensidade,setIntensidade]=useState(5); const [contexto,setContexto]=useState(""); const [pensamento,setPensamento]=useState("");
      return <div style={card}><h3 style={{ color, fontSize:16, marginBottom:16 }}>📔 Diário de Emoções</h3>
        <label style={lbl}>Qual emoção você sentiu?</label><input value={emocao} onChange={e=>setEmocao(e.target.value)} placeholder="ex: ansiedade, tristeza..." style={inp} />
        <label style={lbl}>Intensidade: {intensidade}/10</label><input type="range" min={1} max={10} value={intensidade} onChange={e=>setIntensidade(+e.target.value)} style={{ width:"100%", marginBottom:12, accentColor:color }} />
        <label style={lbl}>O que estava acontecendo?</label><textarea value={contexto} onChange={e=>setContexto(e.target.value)} placeholder="Contexto ou situação..." style={{ ...inp, minHeight:70, resize:"vertical" }} />
        <label style={lbl}>O que passou pela sua cabeça?</label><textarea value={pensamento} onChange={e=>setPensamento(e.target.value)} placeholder="Pensamentos no momento..." style={{ ...inp, minHeight:70, resize:"vertical" }} />
        <button onClick={()=>{ if(emocao) onSubmit({emocao,intensidade,contexto,pensamento}); }} style={{ ...btn(color), width:"100%" }}>Enviar Registro</button>
      </div>;
    }

    function PensamentosForm({ color, onSubmit }) {
      const [situacao,setSituacao]=useState(""); const [pensamento,setPensamento]=useState(""); const [emocao,setEmocao]=useState(""); const [intensidade,setIntensidade]=useState(5); const [alt,setAlt]=useState("");
      return <div style={card}><h3 style={{ color, fontSize:16, marginBottom:16 }}>💭 Registro ABC</h3>
        <label style={lbl}>A — Situação</label><textarea value={situacao} onChange={e=>setSituacao(e.target.value)} placeholder="O que aconteceu?" style={{ ...inp, minHeight:60, resize:"vertical" }} />
        <label style={lbl}>B — Pensamento automático</label><textarea value={pensamento} onChange={e=>setPensamento(e.target.value)} placeholder="O que você pensou?" style={{ ...inp, minHeight:60, resize:"vertical" }} />
        <label style={lbl}>C — Emoção/Consequência</label><input value={emocao} onChange={e=>setEmocao(e.target.value)} placeholder="ex: fiquei ansioso..." style={inp} />
        <label style={lbl}>Intensidade: {intensidade}/10</label><input type="range" min={1} max={10} value={intensidade} onChange={e=>setIntensidade(+e.target.value)} style={{ width:"100%", marginBottom:12, accentColor:color }} />
        <label style={lbl}>Pensamento alternativo</label><textarea value={alt} onChange={e=>setAlt(e.target.value)} placeholder="Outra forma de ver?" style={{ ...inp, minHeight:60, resize:"vertical" }} />
        <button onClick={()=>{ if(situacao&&pensamento) onSubmit({situacao,pensamento,emocao,intensidade,pensamentoAlternativo:alt}); }} style={{ ...btn(color), width:"100%" }}>Enviar</button>
      </div>;
    }

    function AtencaoForm({ color, onSubmit }) {
      const [fase,setFase]=useState("intro"); const [seq,setSeq]=useState([]); const [shown,setShown]=useState([]); const [input,setInput]=useState(""); const [result,setResult]=useState(null); const [score,setScore]=useState(0); const [round,setRound]=useState(0);
      function startGame() {
        const s=Array.from({length:5},()=>Math.floor(Math.random()*9)+1);
        setSeq(s); setShown([]); setInput(""); setResult(null); setRound(r=>r+1); setFase("show");
        s.forEach((n,i)=>setTimeout(()=>{ setShown(p=>[...p,n]); if(i===s.length-1) setTimeout(()=>setFase("answer"),600); },i*700));
      }
      function check() { const u=input.trim().split(/\s+/).map(Number); const ok=JSON.stringify(u)===JSON.stringify(seq); setResult(ok); if(ok) setScore(s=>s+1); setFase("result"); }
      return <div style={card}><h3 style={{ color, fontSize:16, marginBottom:16 }}>🎯 Teste de Atenção</h3>
        {fase==="intro" && <><p style={{ fontSize:13, color:"#555", marginBottom:16 }}>Memorize a sequência de números e depois digite na ordem correta.</p><button onClick={startGame} style={{ ...btn(color), width:"100%" }}>Começar</button></>}
        {fase==="show" && <div style={{ textAlign:"center", padding:"30px 0" }}><p style={{ color:"#888", marginBottom:16 }}>Memorize:</p><div style={{ display:"flex", justifyContent:"center", gap:12, flexWrap:"wrap" }}>{shown.map((n,i)=><span key={i} style={{ width:44, height:44, borderRadius:10, background:color, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, fontWeight:800 }}>{n}</span>)}</div></div>}
        {fase==="answer" && <><p style={{ fontSize:13, color:"#555", marginBottom:12 }}>Digite os números separados por espaço:</p><input value={input} onChange={e=>setInput(e.target.value)} placeholder="ex: 3 7 1 9 4" style={inp} /><button onClick={check} style={{ ...btn(color), width:"100%" }}>Confirmar</button></>}
        {fase==="result" && <div style={{ textAlign:"center" }}><div style={{ fontSize:40, marginBottom:8 }}>{result?"🎉":"😅"}</div><p style={{ fontWeight:700, color:result?"#059669":"#e11d48" }}>{result?"Correto!":"Incorreto"}</p><p style={{ fontSize:13, color:"#888" }}>Sequência: {seq.join(" ")}</p><p style={{ fontSize:13, color:"#555", marginTop:8 }}>Rodada {round} · Acertos: {score}/{round}</p><div style={{ display:"flex", gap:8, marginTop:12 }}><button onClick={startGame} style={{ ...btn(color), flex:1 }}>Nova rodada</button><button onClick={()=>onSubmit({rodadas:round,acertos:score})} style={{ ...btn("#059669"), flex:1 }}>Finalizar</button></div></div>}
      </div>;
    }

    function ExperimentoForm({ color, onSubmit }) {
      const [hip,setHip]=useState(""); const [acao,setAcao]=useState(""); const [res,setRes]=useState(""); const [apr,setApr]=useState("");
      return <div style={card}><h3 style={{ color, fontSize:16, marginBottom:16 }}>🔬 Experimento Comportamental</h3>
        <label style={lbl}>Hipótese</label><textarea value={hip} onChange={e=>setHip(e.target.value)} placeholder="O que você acha que vai acontecer?" style={{ ...inp, minHeight:70, resize:"vertical" }} />
        <label style={lbl}>Ação planejada</label><textarea value={acao} onChange={e=>setAcao(e.target.value)} placeholder="O que você vai fazer?" style={{ ...inp, minHeight:60, resize:"vertical" }} />
        <label style={lbl}>O que realmente aconteceu?</label><textarea value={res} onChange={e=>setRes(e.target.value)} placeholder="Resultado real..." style={{ ...inp, minHeight:70, resize:"vertical" }} />
        <label style={lbl}>O que você aprendeu?</label><textarea value={apr} onChange={e=>setApr(e.target.value)} placeholder="Reflexão..." style={{ ...inp, minHeight:60, resize:"vertical" }} />
        <button onClick={()=>{ if(hip&&acao) onSubmit({hipotese:hip,acao,resultado:res,aprendizado:apr}); }} style={{ ...btn(color), width:"100%" }}>Enviar</button>
      </div>;
    }

    function EscalaForm({ color, onSubmit }) {
      const [humor,setHumor]=useState(5); const [ansiedade,setAnsiedade]=useState(5); const [sono,setSono]=useState(5); const [obs,setObs]=useState("");
      const lv=v=>v<=3?"😔 Baixo":v<=6?"😐 Moderado":"😊 Alto";
      return <div style={card}><h3 style={{ color, fontSize:16, marginBottom:16 }}>📊 Escala de Bem-Estar</h3>
        {[["Humor",humor,setHumor],["Ansiedade (0=calmo)",ansiedade,setAnsiedade],["Qualidade do sono",sono,setSono]].map(([l,v,s])=>(
          <div key={l} style={{ marginBottom:16 }}><label style={lbl}>{l}: <strong>{v}/10</strong> — {lv(v)}</label><input type="range" min={0} max={10} value={v} onChange={e=>s(+e.target.value)} style={{ width:"100%", accentColor:color }} /></div>
        ))}
        <label style={lbl}>Observações</label><textarea value={obs} onChange={e=>setObs(e.target.value)} placeholder="Como você está se sentindo hoje?" style={{ ...inp, minHeight:70, resize:"vertical" }} />
        <button onClick={()=>onSubmit({humor,ansiedade,sono,obs})} style={{ ...btn(color), width:"100%" }}>Enviar Escala</button>
      </div>;
    }

    function ResponseView({ response, type }) {
      if (!response) return null;
      const items = [];
      if(type==="diario") items.push(["Emoção",response.emocao],["Intensidade",`${response.intensidade}/10`],["Contexto",response.contexto],["Pensamento",response.pensamento]);
      if(type==="pensamentos") items.push(["Situação",response.situacao],["Pensamento",response.pensamento],["Emoção",response.emocao],["Intensidade",`${response.intensidade}/10`],["Alternativo",response.pensamentoAlternativo]);
      if(type==="atencao") items.push(["Rodadas",response.rodadas],["Acertos",`${response.acertos}/${response.rodadas}`]);
      if(type==="experimento") items.push(["Hipótese",response.hipotese],["Ação",response.acao],["Resultado",response.resultado],["Aprendizado",response.aprendizado]);
      if(type==="escala") items.push(["Humor",`${response.humor}/10`],["Ansiedade",`${response.ansiedade}/10`],["Sono",`${response.sono}/10`],["Observações",response.obs]);
      return <div style={{ display:"flex", flexDirection:"column", gap:6 }}>{items.filter(([,v])=>v).map(([k,v])=><div key={k} style={{ fontSize:13 }}><strong style={{ color:"#374151" }}>{k}:</strong> <span style={{ color:"#555" }}>{v}</span></div>)}</div>;
    }

    // ── Root ──
    function App() {
      const [ready, setReady] = useState(window._firebaseReady||false);
      const [session, setSession] = useState({ role:null, patientId:null });

      useEffect(() => {
        if (!ready) {
          const handler = () => setReady(true);
          window.addEventListener("firebaseReady", handler);
          return () => window.removeEventListener("firebaseReady", handler);
        }
      }, [ready]);

      if (!ready) return (
        <div style={{ minHeight:"100vh", background:"linear-gradient(135deg,#6d28d9,#0ea5e9)", display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ color:"#fff", textAlign:"center" }}>
            <div style={{ fontSize:40, marginBottom:12 }}>🧠</div>
            <div style={{ fontSize:16, fontWeight:700 }}>TCC Terapeuta</div>
            <div style={{ fontSize:13, marginTop:8, opacity:.8 }}>Conectando ao banco de dados...</div>
          </div>
        </div>
      );

      if (!session.role) return <LoginScreen onLogin={(role,pid)=>setSession({role,patientId:pid})} />;
      if (session.role==="therapist") return <TherapistApp onLogout={()=>setSession({role:null,patientId:null})} />;
      return <PatientApp patientId={session.patientId} onLogout={()=>setSession({role:null,patientId:null})} />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
