function getEscalaData(id){return {csai2r:CSAI2R_DATA,sas:SAS_DATA,acsi28:ACSI28_DATA}[id]||null;}

function calcEscala(escalaData,respostas){
  const totais={};const contagens={};
  Object.keys(escalaData.subescalas).forEach(k=>{totais[k]=0;contagens[k]=0;});
  escalaData.itens.forEach(item=>{
    const v=respostas[item.id];
    if(v!=null){const val=item.inverso?(escalaData.escala.length+1-v):v;totais[item.sub]+=val;contagens[item.sub]++;}
  });
  return{totais,contagens};
}

// ── Escala Form (psicológica) ──
function EscalaPsiForm({tipo,color,onSubmit}){
  const escalaData=getEscalaData(tipo);
  const [respostas,setRespostas]=useState({});
  const [enviado,setEnviado]=useState(false);
  if(!escalaData)return null;
  const respondidos=Object.keys(respostas).length;
  const total=escalaData.itens.length;
  const pct=Math.round((respondidos/total)*100);

  function responder(id,val){setRespostas(r=>({...r,[id]:val}));}

  if(enviado){
    const {totais,contagens}=calcEscala(escalaData,respostas);
    return<div style={crd}>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:48,marginBottom:8}}>✅</div>
        <h3 style={{fontSize:18,fontWeight:800,color:"#1f2937"}}>Resultado — {escalaData.nome}</h3>
      </div>
      {Object.entries(escalaData.subescalas).map(([key,info])=>{
        const max=contagens[key]*escalaData.escala.length;
        const pct=max>0?Math.round((totais[key]/max)*100):0;
        return<div key={key} style={{background:"#f9fafb",borderRadius:12,padding:14,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:13,fontWeight:700,color:"#1f2937"}}>{info.nome}</span>
            <span style={{fontSize:14,fontWeight:800,color:info.cor}}>{totais[key]}/{max}</span>
          </div>
          <div style={{background:"#e5e7eb",borderRadius:20,height:10,overflow:"hidden"}}>
            <div style={{width:`${pct}%`,background:info.cor,height:"100%",borderRadius:20}}/>
          </div>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:4}}>{pct}% do máximo</div>
        </div>;
      })}
      <button className="btn-main" style={{marginTop:8,background:color}} onClick={()=>onSubmit({respostas,totais,escala:escalaData.nome})}>Salvar Resultado</button>
    </div>;
  }

  return<div style={crd}>
    <h3 style={{fontSize:15,fontWeight:800,color:color,marginBottom:4}}>{escalaData.nome}</h3>
    <p style={{fontSize:12,color:"#9ca3af",marginBottom:12,lineHeight:1.5}}>{escalaData.itens.length} itens · {Object.keys(escalaData.subescalas).length} subescalas</p>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
      <span style={{fontSize:12,color:"#9ca3af"}}>{respondidos}/{total} respondidas</span>
      <span style={{fontSize:12,fontWeight:700,color}}>{pct}%</span>
    </div>
    <div style={{background:"#f3f4f6",borderRadius:20,height:8,overflow:"hidden",marginBottom:16}}>
      <div style={{width:`${pct}%`,background:color,height:"100%",borderRadius:20,transition:"width .3s"}}/>
    </div>
    {escalaData.itens.map(item=>(
      <div key={item.id} style={{background:"#f9fafb",borderRadius:12,padding:14,marginBottom:10}}>
        <p style={{fontSize:13,color:"#1f2937",fontWeight:600,marginBottom:10,lineHeight:1.5}}>
          <span style={{color,fontWeight:800,marginRight:6}}>{item.id}.</span>{item.texto}
        </p>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {escalaData.escala.map((op,i)=>(
            <button key={i} onClick={()=>responder(item.id,i+1)}
              style={{border:`1.5px solid ${respostas[item.id]===i+1?color:"#e5e7eb"}`,borderRadius:10,padding:"9px 14px",cursor:"pointer",fontWeight:600,fontSize:13,textAlign:"left",background:respostas[item.id]===i+1?`${color}15`:"#fff",color:respostas[item.id]===i+1?color:"#374151",transition:"all .15s"}}>
              <span style={{fontWeight:800,marginRight:8}}>{i+1}.</span>{op}
            </button>
          ))}
        </div>
      </div>
    ))}
    <button className="btn-main"
      style={{background:respondidos<total?"#e5e7eb":color,color:respondidos<total?"#9ca3af":"#fff"}}
      onClick={()=>{if(respondidos>=total)setEnviado(true);else alert(`Responda mais ${total-respondidos} item(s).`);}}>
      {respondidos<total?`Faltam ${total-respondidos} item(s)`:"Ver Resultado"}
    </button>
  </div>;
}
function VisualCard({tipo,color}){
  if(tipo==="chama")return<div style={{display:"flex",justifyContent:"center",padding:"16px 0"}}><div style={{position:"relative",width:60,height:90}}><div style={{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:40,height:70,background:"linear-gradient(to top,#dc2626,#ef4444,#f97316)",borderRadius:"50% 50% 35% 35%",animation:"chama 2.2s ease-in-out infinite",opacity:.8}}/><div style={{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:30,height:50,background:"linear-gradient(to top,#ef4444,#f97316,#fbbf24)",borderRadius:"50% 50% 30% 30%",animation:"chama 1.8s ease-in-out infinite .2s"}}/><div style={{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:14,height:14,background:"#fef9c3",borderRadius:"50%",boxShadow:"0 0 12px #fbbf24"}}/></div></div>;
  if(tipo==="circulo")return<div style={{display:"flex",justifyContent:"center",padding:"12px 0"}}><div style={{position:"relative",width:120,height:120}}>{[0,1,2,3,4].map(i=><div key={i} style={{position:"absolute",inset:i*12,borderRadius:"50%",border:`2px solid ${color}`,opacity:1-(i*.15),animation:`expandir ${2+i*.3}s ease-in-out infinite`,animationDelay:`${i*.25}s`}}/>)}<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:20,height:20,borderRadius:"50%",background:color,animation:"pulso 2s ease-in-out infinite"}}/></div></div></div>;
  if(tipo==="gradiente")return<div style={{borderRadius:14,overflow:"hidden",height:70,margin:"12px 0",background:"linear-gradient(135deg,#ef4444,#f97316,#fbbf24,#34d399,#3b82f6,#8b5cf6,#ec4899)"}}/>;
  if(tipo==="mandala")return<div style={{display:"flex",justifyContent:"center",padding:"8px 0"}}><div style={{position:"relative",width:110,height:110}}>{[0,1,2,3,4,5,6,7].map(i=><div key={i} style={{position:"absolute",inset:0,display:"flex",justifyContent:"center"}}><div style={{width:4,height:50,background:`hsl(${i*45},70%,60%)`,borderRadius:4,transformOrigin:"bottom center",transform:`rotate(${i*45}deg) translateY(-5px)`,opacity:.7}}/></div>)}{[0,1,2].map(i=><div key={i} style={{position:"absolute",inset:i*16+8,borderRadius:"50%",border:`1.5px solid hsl(${i*60+200},60%,65%)`,animation:`girar ${6+i*2}s linear infinite ${i%2===0?"":" reverse"}`}}/>)}<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:14,height:14,borderRadius:"50%",background:color,animation:"pulso 2s ease-in-out infinite"}}/></div></div></div>;
  if(tipo==="horizonte")return<div style={{borderRadius:14,overflow:"hidden",height:70,margin:"12px 0",position:"relative"}}><div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,#bfdbfe,#93c5fd,#dbeafe)"}}/><div style={{position:"absolute",bottom:0,left:0,right:0,height:28,background:"linear-gradient(to top,#86efac,#4ade80)",borderRadius:"40% 40% 0 0"}}/>{[1,2,3].map(i=><div key={i} style={{position:"absolute",top:12+i*6,left:`${15+i*25}%`,width:i*14+10,height:i*4+4,background:"rgba(255,255,255,.8)",borderRadius:"50%",filter:"blur(2px)"}}/>)}</div>;
  if(tipo==="ancora")return<div style={{display:"flex",justifyContent:"center",padding:"8px 0",gap:16}}>{[{s:"circle",c:"#3b82f6"},{s:"rect",c:"#059669"},{s:"triangle",c:"#f59e0b"},{s:"star",c:"#ec4899"}].map((sh,i)=><div key={i} style={{width:42,height:42,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:10,background:`${sh.c}20`,animation:`pulso ${2+i*.3}s ease-in-out infinite`,animationDelay:`${i*.3}s`}}><svg width="24" height="24">{sh.s==="circle"&&<circle cx="12" cy="12" r="10" fill={sh.c}/>}{sh.s==="rect"&&<rect x="2" y="2" width="20" height="20" rx="4" fill={sh.c}/>}{sh.s==="triangle"&&<polygon points="12,2 22,22 2,22" fill={sh.c}/>}{sh.s==="star"&&<polygon points="12,2 14.9,8.6 22,9.3 17,14 18.5,21 12,17.3 5.5,21 7,14 2,9.3 9.1,8.6" fill={sh.c}/>}</svg></div>)}</div>;
  return null;
}

// ── Carta Modal ──
function CartaModal({carta,color,baralhoId,onClose,onNext}){
  const P=PERSONAGENS[baralhoId];
  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:24,padding:28,maxWidth:360,width:"100%",boxShadow:"0 24px 60px rgba(0,0,0,.25)",animation:"popIn .3s cubic-bezier(.34,1.56,.64,1)"}}>
      <div style={{display:"flex",justifyContent:"center",marginBottom:8}}>{P&&<P/>}</div>
      <div style={{width:48,height:6,background:color,borderRadius:4,margin:"0 auto 16px"}}/>
      <h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:12}}>{carta.titulo}</h3>
      {carta.visual&&<><VisualCard tipo={carta.visual.tipo} color={color}/><p style={{fontSize:12,fontWeight:700,color,textAlign:"center",marginBottom:10}}>{carta.visual.instrucao}</p></>}
      <p style={{fontSize:14,color:"#4b5563",lineHeight:1.7}}>{carta.descricao}</p>
      <div style={{display:"flex",gap:10,marginTop:24}}>
        <button onClick={onClose} style={{flex:1,padding:"11px 0",borderRadius:12,border:"1.5px solid #e5e7eb",background:"#fff",color:"#6b7280",fontWeight:700,cursor:"pointer",fontSize:14}}>Fechar</button>
        <button onClick={onNext} style={{flex:2,padding:"11px 0",borderRadius:12,border:"none",background:`linear-gradient(135deg,${color},${color}cc)`,color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14}}>Próxima →</button>
      </div>
    </div>
  </div>;
}

// ── Baralhos Tab ──
function BaralhosTab(){
  const [sel,setSel]=useState(null);
  const [idx,setIdx]=useState(0);
  function open(b){setSel({...b,cartas:[...b.cartas].sort(()=>Math.random()-.5)});setIdx(0);}
  return<div>
    {sel&&<CartaModal carta={sel.cartas[idx]} color={sel.color} baralhoId={sel.id} onClose={()=>setSel(null)} onNext={()=>setIdx(i=>(i+1)%sel.cartas.length)}/>}
    <div style={{background:"linear-gradient(135deg,#6d28d9,#4f46e5,#0ea5e9)",borderRadius:18,padding:18,marginBottom:20,color:"#fff",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",right:-16,top:-16,fontSize:70,opacity:.15}}>🃏</div>
      <div style={{fontSize:11,fontWeight:700,opacity:.8,marginBottom:4}}>✨ TÉCNICA DO DIA</div>
      <div style={{fontSize:15,fontWeight:800,marginBottom:6}}>Respiração 4-7-8</div>
      <div style={{fontSize:12,opacity:.85,lineHeight:1.5,marginBottom:14}}>Inspire 4s, segure 7s, expire 8s. Ativa o parassimpático.</div>
      <button onClick={()=>open(BARALHOS[Math.floor(Math.random()*BARALHOS.length)])} style={{background:"rgba(255,255,255,.2)",border:"1px solid rgba(255,255,255,.3)",color:"#fff",borderRadius:10,padding:"7px 14px",cursor:"pointer",fontWeight:700,fontSize:12}}>🎲 Carta aleatória</button>
    </div>
    <h3 style={{fontSize:14,fontWeight:800,color:"#374151",marginBottom:12}}>Escolha um baralho</h3>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      {BARALHOS.map(b=>{
        const P=PERSONAGENS[b.id];
        return<div key={b.id} onClick={()=>open(b)} style={{background:"#fff",borderRadius:16,padding:14,cursor:"pointer",boxShadow:"0 4px 12px rgba(0,0,0,.07)",display:"flex",flexDirection:"column",alignItems:"center",gap:4,textAlign:"center",transition:"transform .2s cubic-bezier(.34,1.56,.64,1)"}}
          onMouseEnter={e=>e.currentTarget.style.transform="translateY(-3px)"}
          onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
          <div style={{width:64,height:74,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>{P?<P/>:<span style={{fontSize:32}}>{b.emoji}</span>}</div>
          <div style={{fontWeight:800,color:"#1f2937",fontSize:12}}>{b.nome}</div>
          <div style={{fontSize:11,color:"#9ca3af"}}>{b.cartas.length} técnicas</div>
          <div style={{width:"100%",height:3,borderRadius:4,background:`linear-gradient(90deg,${b.color},${b.color}55)`,marginTop:4}}/>
        </div>;
      })}
    </div>
  </div>;
}

// ── Shared Components ──
function Header({title,subtitle,onBack,backLabel="Sair"}){
  return<div style={{background:"linear-gradient(135deg,#6d28d9,#4f46e5,#0ea5e9)",padding:"18px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 4px 20px rgba(109,40,217,.3)"}}>
    <div><div style={{color:"#fff",fontWeight:800,fontSize:18,letterSpacing:"-.3px"}}>{title}</div>{subtitle&&<div style={{color:"rgba(255,255,255,.75)",fontSize:12,marginTop:2}}>{subtitle}</div>}</div>
    {onBack&&<button onClick={onBack} style={{background:"rgba(255,255,255,.18)",border:"1px solid rgba(255,255,255,.25)",color:"#fff",padding:"7px 14px",borderRadius:10,cursor:"pointer",fontSize:12,fontWeight:600}}>{backLabel}</button>}
  </div>;
}
function TabBar({tabs,active,onChange}){
  return<div style={{display:"flex",background:"#fff",borderBottom:"1px solid #f0f0f0",overflowX:"auto",boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}>
    {tabs.map(([id,label])=><button key={id} onClick={()=>onChange(id)} className="tab-btn" style={{color:active===id?"#6d28d9":"#9ca3af",borderBottom:active===id?"2.5px solid #6d28d9":"2.5px solid transparent"}}>{label}</button>)}
  </div>;
}
function EmptyState({icon,text}){return<div style={{textAlign:"center",padding:"40px 20px",color:"#aaa"}}><div style={{fontSize:40,marginBottom:8}}>{icon}</div><p style={{fontSize:14}}>{text}</p></div>;}
function Spinner(){return<div style={{textAlign:"center",padding:40,color:"#6d28d9"}}>⏳ Carregando...</div>;}
function ConfirmModal({msg,onConfirm,onCancel}){
  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
    <div style={{background:"#fff",borderRadius:16,padding:24,maxWidth:300,width:"100%"}}>
      <p style={{fontSize:15,color:"#1f2937",marginBottom:20,textAlign:"center"}}>{msg}</p>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onCancel} style={{...btn("#e5e7eb"),flex:1}}>Cancelar</button>
        <button onClick={onConfirm} style={{...btn("#fee2e2"),flex:1}}>🗑 Apagar</button>
      </div>
    </div>
  </div>;
}
function PatientModal({patient,onClose}){
  const isEdit=!!patient;
  const [name,setName]=useState(patient?.name||"");
  const [pass,setPass]=useState("");
  const [obs,setObs]=useState(patient?.obs||"");
  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
    <div className="fade-in" style={{background:"#fff",borderRadius:"24px 24px 0 0",padding:28,width:"100%",maxWidth:480,boxShadow:"0 -8px 40px rgba(0,0,0,.15)"}}>
      <div style={{width:40,height:4,background:"#e5e7eb",borderRadius:4,margin:"0 auto 20px"}}/>
      <h2 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:4}}>{isEdit?"✏️ Editar Paciente":"➕ Novo Paciente"}</h2>
      <p style={{fontSize:13,color:"#9ca3af",marginBottom:20}}>{isEdit?`Editando ${patient.name}`:"Preencha os dados do novo paciente"}</p>
      <label style={lbl}>Nome completo</label>
      <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="Nome do paciente"/>
      <label style={lbl}>{isEdit?"Nova senha (deixe vazio para manter)":"Senha de acesso"}</label>
      <input className="inp" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder={isEdit?"••••••••":"Criar senha"}/>
      <label style={lbl}>Observações iniciais</label>
      <textarea className="inp" value={obs} onChange={e=>setObs(e.target.value)} placeholder="Queixa principal, encaminhamento..." style={{minHeight:70,resize:"vertical"}}/>
      <div style={{display:"flex",gap:10,marginTop:4}}>
        <button onClick={onClose} style={{...btn("#e5e7eb"),flex:1,padding:"12px 0"}}>Cancelar</button>
        <button style={{flex:2,padding:"12px 0",borderRadius:10,border:"none",background:"linear-gradient(135deg,#6d28d9,#7c3aed)",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14,boxShadow:"0 4px 14px rgba(109,40,217,.3)"}}>{isEdit?"Salvar":"Cadastrar"}</button>
      </div>
    </div>
  </div>;
}

// ── Login ──
function LoginScreen({onLogin}){
  const [role,setRole]=useState("therapist");const [pid,setPid]=useState("");const [pass,setPass]=useState("");const [err,setErr]=useState("");const [loading,setLoading]=useState(false);
  async function handle(){
    setErr("");setLoading(true);
    try{
      if(role==="therapist"){const d=await fbGet("therapist");if(pass===(d?.password||"1234"))onLogin("therapist",null);else setErr("Senha incorreta.");}
      else{const all=await fbGet("patients");if(!all){setErr("Nenhum paciente cadastrado.");setLoading(false);return;}
        const found=Object.values(all).find(p=>p.name.trim().toLowerCase()===pid.trim().toLowerCase());
        if(!found){setErr("Paciente não encontrado.");setLoading(false);return;}
        if(found.password&&found.password!==pass){setErr("Senha incorreta.");setLoading(false);return;}
        onLogin("patient",found.id);}
    }catch(e){setErr("Erro de conexão.");}
    setLoading(false);
  }
  return<div style={{minHeight:"100vh",background:"linear-gradient(160deg,#1e1b4b,#4c1d95,#0c4a6e)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div className="fade-in" style={{width:"100%",maxWidth:360}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{width:72,height:72,borderRadius:22,background:"linear-gradient(135deg,#7c3aed,#0ea5e9)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",boxShadow:"0 8px 32px rgba(124,58,237,.5)",fontSize:36}}>🧠</div>
        <h1 style={{color:"#fff",fontSize:28,fontWeight:900,letterSpacing:"-1px",marginBottom:4}}>MeuPsi</h1>
        <p style={{color:"rgba(255,255,255,.6)",fontSize:12,lineHeight:1.6}}>João Rosa · Psicólogo TCC<br/>CRP 06/227336</p>
      </div>
      <div style={{background:"rgba(255,255,255,.95)",borderRadius:24,padding:28,boxShadow:"0 24px 60px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",marginBottom:22,borderRadius:12,overflow:"hidden",background:"#f3f4f6",padding:4,gap:4}}>
          {["therapist","patient"].map(r=><button key={r} onClick={()=>{setRole(r);setErr("");}} style={{flex:1,padding:"9px 0",background:role===r?"#fff":"transparent",color:role===r?"#6d28d9":"#9ca3af",border:"none",cursor:"pointer",fontWeight:700,fontSize:13,borderRadius:9,boxShadow:role===r?"0 2px 8px rgba(0,0,0,.1)":"none",transition:"all .2s"}}>{r==="therapist"?"Terapeuta":"Paciente"}</button>)}
        </div>
        {role==="patient"&&<input className="inp" placeholder="Seu nome completo" value={pid} onChange={e=>setPid(e.target.value)}/>}
        <input type="password" className="inp" placeholder="Senha" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} style={{marginBottom:16}}/>
        {err&&<p style={{color:"#e11d48",fontSize:12,marginBottom:10}}>{err}</p>}
        <button className="btn-main" onClick={handle} disabled={loading}>{loading?"Entrando...":"Entrar"}</button>
      </div>
    </div>
  </div>;
}

// ── Therapist ──
function TherapistApp({onLogout}){
  const [tab,setTab]=useState("patients");const [patients,setPatients]=useState(null);const [sel,setSel]=useState(null);const [modal,setModal]=useState(null);const [confirmDel,setConfirmDel]=useState(null);
  useEffect(()=>{const u=fbListen("patients",d=>setPatients(d?Object.values(d):[]));return()=>u();},[]);
  async function addPatient(name,pass){
    if(!name)return;
    const all=await fbGet("patients");const list=all?Object.values(all):[];
    if(list.find(p=>p.name.trim().toLowerCase()===name.trim().toLowerCase())){alert(`Já existe um paciente com o nome "${name}".`);return;}
    const id="p"+Date.now();
    await fbSet(`patients/${id}`,{id,name,password:pass||"1234",tasks:{},prontuario:{identificacao:{},demanda:{},evolucao_reg:{},encerramento:{},historia:{},evolucao:{}}});
  }
  async function deletePatient(id){await fbSet(`patients/${id}`,null);setConfirmDel(null);}
  if(patients===null)return<div style={aw}><Header title="MeuPsi" subtitle="Painel do Terapeuta" onBack={onLogout}/><Spinner/></div>;
  if(sel){const p=patients.find(p=>p.id===sel);if(p)return<PatientDetail patient={p} onBack={()=>setSel(null)}/>;}
  return<div style={aw}>
    {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.name}" e todas as suas tarefas?`} onConfirm={()=>deletePatient(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
    {modal&&<PatientModal patient={modal==="new"?null:modal} onClose={()=>setModal(null)}/>}
    <Header title="MeuPsi" subtitle="Painel do Terapeuta" onBack={onLogout}/>
    <TabBar tabs={[["patients","👥 Pacientes"],["overview","📈 Visão Geral"]]} active={tab} onChange={setTab}/>
    <div className="fade-in" style={ct}>
      {tab==="patients"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h2 style={h2s}>Meus Pacientes</h2>
          <button onClick={()=>setModal("new")} style={{...btn(),padding:"9px 16px",borderRadius:10,boxShadow:"0 4px 12px rgba(109,40,217,.3)"}}>+ Novo</button>
        </div>
        {patients.length===0&&<EmptyState icon="👤" text="Nenhum paciente ainda."/>}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {patients.map(p=><div key={p.id} className="card-hover" style={{background:"#fff",borderRadius:16,padding:"14px 18px",boxShadow:"0 2px 10px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

    </div>
  </div>;
}

// ── Patient Detail ──
function PatientDetail({patient,onBack}){
  const [tab,setTab]=useState("tasks");const [lp,setLp]=useState(patient);const [showAdd,setShowAdd]=useState(false);
  const [tt,setTt]=useState("");const [ttitle,setTtitle]=useState("");const [tnote,setTnote]=useState("");
  const [confirmDel,setConfirmDel]=useState(null);const [viewTask,setViewTask]=useState(null);
  useEffect(()=>{const u=fbListen(`patients/${patient.id}`,d=>{if(d)setLp(d);});return()=>u();},[patient.id]);
  async function addTask(){
    if(!tt||!ttitle)return;
    const id="t"+Date.now();
    await fbSet(`patients/${patient.id}/tasks/${id}`,{id,type:tt,title:ttitle,note:tnote,response:null,createdAt:new Date().toLocaleDateString("pt-BR")});
    setTt("");setTtitle("");setTnote("");setShowAdd(false);
  }
  async function deleteTask(tid){await fbSet(`patients/${patient.id}/tasks/${tid}`,null);setConfirmDel(null);setViewTask(null);}
  const tasks=lp.tasks?Object.values(lp.tasks):[];
  const diarios=lp.diarios?Object.values(lp.diarios).reverse():[];

  if(viewTask){
    const ti=getTypeInfo(viewTask.type);
    return<div style={aw}>
      {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}

      <div style={ct}><div style={crd}>

        <h2 style={{fontSize:17,fontWeight:800,color:"#1f2937",margin:"12px 0 4px"}}>{viewTask.title}</h2>
        {viewTask.note&&<div style={{background:"#f3f4f6",borderRadius:10,padding:12,marginBottom:12}}><p style={{fontSize:13,color:"#555"}}><strong>Instruções:</strong> {viewTask.note}</p></div>}
        <span style={{fontSize:13,padding:"4px 10px",borderRadius:20,background:viewTask.response?"#d1fae5":"#fef3c7",color:viewTask.response?"#065f46":"#92400e",fontWeight:600}}>{viewTask.response?"✅ Respondida":"⏳ Pendente"}</span>
        {viewTask.response&&<div style={{marginTop:16}}><h3 style={{fontSize:14,fontWeight:700,color:"#374151",marginBottom:10}}>Resposta:</h3><ResponseView response={viewTask.response} type={viewTask.type}/></div>}
        <div style={{marginTop:20}}><button onClick={()=>setConfirmDel(viewTask)} style={{...btn("#fee2e2"),width:"100%"}}>🗑 Apagar Tarefa</button></div>
      </div></div>
    </div>;
  }

  return<div style={aw}>
    {confirmDel&&<ConfirmModal msg={`Apagar "${confirmDel.title}"?`} onConfirm={()=>deleteTask(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}
    <Header title={`👤 ${patient.name}`} subtitle="Detalhes do paciente" onBack={onBack} backLabel="← Voltar"/>
    <TabBar tabs={[["tasks","📋 Tarefas"],["responses","✅ Respostas"],["diario","📔 Diário"],["prontuario","📁 Prontuário"]]} active={tab} onChange={setTab}/>
    <div className="fade-in" style={ct}>
      {tab==="tasks"&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h2 style={h2s}>Tarefas ({tasks.length})</h2>
          <button onClick={()=>setShowAdd(true)} style={{...btn(),padding:"9px 16px",borderRadius:10}}>+ Nova</button>
        </div>

          <input className="inp" placeholder="Título" value={ttitle} onChange={e=>setTtitle(e.target.value)}/>
          <textarea className="inp" placeholder="Instruções (opcional)" value={tnote} onChange={e=>setTnote(e.target.value)} style={{minHeight:60,resize:"vertical"}}/>
          <div style={{display:"flex",gap:8}}><button onClick={addTask} style={btn()}>Adicionar</button><button onClick={()=>setShowAdd(false)} style={btn("#e5e7eb")}>Cancelar</button></div>
        </div>}
        {tasks.length===0&&<EmptyState icon="📋" text="Nenhuma tarefa ainda."/>}
        {tasks.map(task=>{const ti=getTypeInfo(task.type);return<div key={task.id} className="card-hover" onClick={()=>setViewTask(task)} style={{background:"#fff",borderRadius:16,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,.05)",borderLeft:`4px solid ${ti.color}`}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <span style={{fontSize:11,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label}</span>

      </>}

        <h2 style={h2s}>Respostas</h2>
        {tasks.filter(t=>t.response).length===0&&<EmptyState icon="✅" text="Nenhuma resposta ainda."/>}
        {tasks.filter(t=>t.response).map(task=>{const ti=getTypeInfo(task.type);return<div key={task.id} style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,.05)"}}>

          <ResponseView response={task.response} type={task.type}/>
          {task.answeredAt&&<div style={{fontSize:11,color:"#9ca3af",marginTop:8}}>Respondida em {task.answeredAt}</div>}
        </div>;})}
      </>}
      {tab==="diario"&&<>
        <h2 style={h2s}>📔 Diário ({diarios.length})</h2>
        {diarios.length===0&&<EmptyState icon="📔" text="Nenhum registro ainda."/>}
        {diarios.map((d,i)=>{const em=EMOCOES.find(e=>e.nome===d.emocao)||{emoji:"😐",color:"#888"};return<div key={i} style={{background:"#fff",borderRadius:16,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,.05)",borderLeft:`4px solid ${em.color}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <div style={{width:40,height:40,borderRadius:12,background:`${em.color}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{em.emoji}</div>
            <div><div style={{fontWeight:700,color:em.color,fontSize:14}}>{d.emocao}</div><div style={{fontSize:11,color:"#9ca3af"}}>{d.data} {d.hora}</div></div>
            <div style={{marginLeft:"auto",background:`${em.color}15`,color:em.color,fontSize:12,fontWeight:700,padding:"4px 10px",borderRadius:20}}>Int. {d.intensidade}/10</div>
          </div>
          {d.contexto&&<div style={{fontSize:13,color:"#6b7280",background:"#f9fafb",borderRadius:10,padding:"8px 12px"}}>{d.contexto}</div>}
        </div>;})}
      </>}
      {tab==="prontuario"&&<ProntuarioTab patientId={patient.id} prontuario={lp.prontuario||{}}/>}
    </div>
  </div>;
}

// ── Prontuário ──
function ProntuarioTab({patientId,prontuario}){
  const [ptab,setPtab]=useState("identificacao");

  const [evo,setEvo]=useState("");
  const [anexos]=useState([]);

  const sections=[["identificacao","🪪 Identificação"],["demanda","🎯 Demanda"],["evolucao_reg","📋 Evolução"],["encerramento","🔚 Encerramento"],["anexos","📎 Anexos"]];
  const fields={
    identificacao:[["nome","Nome completo",""],["nasc","Data de nascimento",""],["instituicao","Instituição / Encaminhamento",""],["contato","Contato (tel/email)",""],["responsavel","Responsável (se menor)",""]],
    demanda:[["queixa","Queixa principal","Descreva a demanda..."],["objetivos","Objetivos do trabalho","Defina os objetivos..."],["cid","CID / Hipótese diagnóstica",""],["medicacoes","Medicações em uso",""]],
    evolucao_reg:[["procedimentos","Procedimentos técnico-científicos adotados","Técnicas e abordagens..."],["instrumentos","Instrumentos de avaliação","Testes, escalas..."],["observacoes","Observações clínicas",""]],
    encerramento:[["encaminhamento","Encaminhamento","Para onde/quem..."],["motivo","Motivo do encerramento","Alta, abandono..."],["data_enc","Data de encerramento",""],["consideracoes","Considerações finais",""]],
  };

  async function save(){

    setSaved(true);setTimeout(()=>setSaved(false),2000);
  }
  async function addEvo(){

    await fbSet(`patients/${patientId}/prontuario/evolucao/${id}`,{date:new Date().toLocaleDateString("pt-BR"),text:evo});

  const evolucao=data.evolucao?Object.values(data.evolucao).reverse():[];

    {ptab!=="anexos"&&ptab!=="historia"&&fields[ptab]&&<>
      <div className="fade-in" style={{...crd,marginBottom:14}}>
        {fields[ptab].map(([f,l,ph])=><div key={f} style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",marginBottom:6,textTransform:"uppercase",letterSpacing:".5px"}}>{l}</div>
          {ph?<textarea className="inp" placeholder={ph} value={(data[ptab]||{})[f]||""} onChange={e=>setData({...data,[ptab]:{...(data[ptab]||{}),[f]:e.target.value}})} style={{minHeight:70,resize:"vertical",marginBottom:0}}/>
            :<input className="inp" placeholder={`Digite ${l.toLowerCase()}...`} value={(data[ptab]||{})[f]||""} onChange={e=>setData({...data,[ptab]:{...(data[ptab]||{}),[f]:e.target.value}})} style={{marginBottom:0}}/>}
        </div>)}
        <button className="btn-main" onClick={save} style={{marginTop:4}}>{saved?"✅ Salvo!":"Salvar"}</button>
      </div>
    </>}

    {ptab==="anexos"&&<div className="fade-in">
      <div style={{...crd,marginBottom:14}}>
        <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937",marginBottom:4}}>📎 Anexar Documento</h3>
        <p style={{fontSize:12,color:"#9ca3af",marginBottom:14}}>Testes, atividades ou documentos em PDF</p>
        <div style={{border:"2px dashed #e5e7eb",borderRadius:14,padding:28,textAlign:"center",cursor:"pointer"}}>
          <div style={{fontSize:36,marginBottom:8}}>📄</div>

          <div style={{fontSize:12,color:"#9ca3af"}}>PDF, PNG, JPG · máx 10MB</div>
        </div>
        <select className="inp" style={{marginTop:12}}><option>Tipo: Teste psicológico</option><option>Tipo: Atividade TCC</option><option>Tipo: Relatório</option><option>Tipo: Outro</option></select>
        <button className="btn-main">Anexar</button>
      </div>
      {anexos.length===0&&<EmptyState icon="📎" text="Nenhum documento anexado ainda."/>}
    </div>}

    {/* História Clínica */}
    <div style={{...crd,marginBottom:14}}>
      <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937",marginBottom:4}}>🗂 História Clínica</h3>
      <p style={{fontSize:12,color:"#9ca3af",marginBottom:14}}>Histórico completo do paciente</p>
      {[["familiar","História familiar","Dinâmica familiar, relacionamentos..."],["social","História social","Escolaridade, trabalho, vínculos sociais..."],["saude","Histórico de saúde","Doenças, tratamentos anteriores..."],["psico","Histórico psicológico","Tratamentos anteriores, hospitalizações..."]].map(([f,l,ph])=><div key={f} style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:"#9ca3af",marginBottom:6,textTransform:"uppercase",letterSpacing:".5px"}}>{l}</div>
        <textarea className="inp" placeholder={ph} value={(data.historia||{})[f]||""} onChange={e=>setData({...data,historia:{...(data.historia||{}),[f]:e.target.value}})} style={{minHeight:60,resize:"vertical",marginBottom:0}}/>
      </div>)}
      <button className="btn-main" onClick={save}>{saved?"✅ Salvo!":"Salvar História Clínica"}</button>
    </div>

    {/* Evolução de Sessão */}
    <div style={crd}>
      <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937",marginBottom:4}}>📝 Evolução de Sessão</h3>
      <p style={{fontSize:12,color:"#9ca3af",marginBottom:14}}>Registros por sessão</p>
      <textarea className="inp" value={evo} onChange={e=>setEvo(e.target.value)} placeholder={`Registro — ${new Date().toLocaleDateString("pt-BR")}`} style={{minHeight:80,resize:"vertical"}}/>

      {evolucao.length===0&&<p style={{color:"#aaa",fontSize:13}}>Nenhum registro ainda.</p>}

        <div style={{fontSize:11,color:"#9ca3af",marginBottom:4,fontWeight:600}}>{ev.date}</div>
        <div style={{fontSize:13,color:"#374151",lineHeight:1.5,whiteSpace:"pre-wrap"}}>{ev.text}</div>
      </div>)}
    </div>
  </div>;
}

// ── Patient App ──
function PatientApp({patientId,onLogout}){
  const [patient,setPatient]=useState(null);const [tab,setTab]=useState("tasks");const [sel,setSel]=useState(null);const [viewTask,setViewTask]=useState(null);
  useEffect(()=>{const u=fbListen(`patients/${patientId}`,d=>setPatient(d));return()=>u();},[patientId]);
  async function submitResponse(taskId,response){await fbUpdate(`patients/${patientId}/tasks/${taskId}`,{response,answeredAt:new Date().toLocaleDateString("pt-BR")});setSel(null);}
  if(!patient)return<div style={aw}><Spinner/></div>;

      <span style={{fontSize:12,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label}</span>
      <h2 style={{fontSize:17,fontWeight:800,color:"#1f2937",margin:"12px 0 8px"}}>{viewTask.title}</h2>
      {viewTask.note&&<div style={{background:"#f3f4f6",borderRadius:10,padding:12,marginBottom:12}}><p style={{fontSize:13,color:"#555"}}><strong>Instruções:</strong> {viewTask.note}</p></div>}
      <ResponseView response={viewTask.response} type={viewTask.type}/>
    </div></div>
  </div>;}
  return<div style={aw}>
    <Header title={`Olá, ${patient.name}! 👋`} subtitle="MeuPsi · João Rosa" onBack={onLogout}/>
    <TabBar tabs={[["tasks","📋 Tarefas"],["diario","📔 Diário"],["baralhos","🃏 Baralhos"]]} active={tab} onChange={setTab}/>

      {tab==="tasks"&&<>
        {tasks.length===0&&<EmptyState icon="🎉" text="Nenhuma tarefa ainda. Fale com seu terapeuta."/>}
        {pending.length>0&&<><h2 style={h2s}>⏳ Pendentes ({pending.length})</h2>
          {pending.map(task=>{const ti=getTypeInfo(task.type);return<div key={task.id} onClick={()=>setSel(task.id)} className="card-hover" style={{background:"#fff",borderRadius:16,padding:18,marginBottom:10,boxShadow:"0 4px 14px rgba(0,0,0,.07)",borderLeft:`4px solid ${ti.color}`}}>
            <span style={{fontSize:11,fontWeight:700,color:ti.color,background:`${ti.color}15`,padding:"3px 10px",borderRadius:20}}>{ti.label}</span>
            <div style={{fontWeight:700,color:"#1f2937",marginTop:8,fontSize:15}}>{task.title}</div>
            {task.note&&<div style={{fontSize:12,color:"#9ca3af",marginTop:3}}>{task.note}</div>}
            <div style={{marginTop:12,display:"flex",alignItems:"center",gap:6}}>
              <div style={{flex:1,height:3,background:`${ti.color}20`,borderRadius:4}}/>
              <span style={{fontSize:12,color:ti.color,fontWeight:700}}>Responder →</span>
            </div>
          </div>;})}
        </>}
        {done.length>0&&<><h2 style={{...h2s,marginTop:20}}>✅ Concluídas ({done.length})</h2>
          {done.map(task=>{const ti=getTypeInfo(task.type);return<div key={task.id} onClick={()=>setViewTask(task)} style={{background:"#fff",borderRadius:16,padding:14,marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,.05)",borderLeft:`4px solid ${ti.color}`,opacity:.85,cursor:"pointer"}}>
            <span style={{fontSize:11,color:ti.color,fontWeight:700}}>{ti.label}</span>
            <div style={{fontWeight:600,color:"#374151",marginTop:4}}>{task.title}</div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:4}}>Respondida em {task.answeredAt} · Ver →</div>
          </div>;})}
        </>}
      </>}
      {tab==="diario"&&<DiarioTab patientId={patientId}/>}

// ── Diário Tab ──
function DiarioTab({patientId}){
  const [diarios,setDiarios]=useState([]);
  const [emocaoSel,setEmocaoSel]=useState(null);const [intensidade,setIntensidade]=useState(5);const [contexto,setContexto]=useState("");const [pensamento,setPensamento]=useState("");const [enviado,setEnviado]=useState(false);
  useEffect(()=>{const u=fbListen(`patients/${patientId}/diarios`,d=>setDiarios(d?Object.values(d).reverse():[]));return()=>u();},[patientId]);
  const intDesc=v=>["","Muito leve","Muito leve","Leve","Leve","Moderada","Moderada","Intensa","Intensa","Muito intensa","Muito intensa"][v];
  async function enviar(){
    if(!emocaoSel)return;
    const id="d"+Date.now();
    await fbSet(`patients/${patientId}/diarios/${id}`,{emocao:emocaoSel.nome,emoji:emocaoSel.emoji,intensidade,contexto,pensamento,data:new Date().toLocaleDateString("pt-BR"),hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});
    setEmocaoSel(null);setIntensidade(5);setContexto("");setPensamento("");setEnviado(true);setTimeout(()=>setEnviado(false),2500);
  }
  return<div>
    <div style={crd}>
      <h3 style={{fontSize:15,fontWeight:800,color:"#6d28d9",marginBottom:4}}>📔 Como você está?</h3>
      <p style={{fontSize:12,color:"#9ca3af",marginBottom:14}}>Toque em uma emoção para registrar</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:12}}>
        {EMOCOES.map(em=>{const sel=emocaoSel?.nome===em.nome;return<button key={em.nome} onClick={()=>setEmocaoSel(sel?null:em)} className={`emocao-btn${sel?" sel":""}`} style={{border:`2px solid ${sel?em.color:"#e5e7eb"}`,background:sel?em.bg:"#fff"}}>
          <span style={{fontSize:sel?30:24,transition:"font-size .25s cubic-bezier(.34,1.56,.64,1)"}}>{em.emoji}</span>
          <span style={{fontSize:10,fontWeight:700,color:sel?em.color:"#9ca3af"}}>{em.nome}</span>
        </button>;})}
      </div>
      <div className={`diario-fields ${emocaoSel?"show":"hide"}`}>
        {emocaoSel&&<>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:700,color:"#374151"}}>Intensidade</span><span style={{fontSize:15,fontWeight:800,color:emocaoSel.color}}>{intensidade}/10 — {intDesc(intensidade)}</span></div>
          <div style={{background:"#f3f4f6",borderRadius:20,height:10,overflow:"hidden",marginBottom:6}}><div style={{width:`${(intensidade/10)*100}%`,background:emocaoSel.color,height:"100%",borderRadius:20,transition:"width .15s"}}/></div>
          <input type="range" min={1} max={10} value={intensidade} onChange={e=>setIntensidade(+e.target.value)} style={{width:"100%",marginBottom:14,accentColor:emocaoSel.color}}/>
          <label style={lbl}>O que estava acontecendo?</label>
          <textarea className="inp" value={contexto} onChange={e=>setContexto(e.target.value)} placeholder="Contexto ou situação..." style={{minHeight:60,resize:"vertical"}}/>
          <label style={lbl}>O que passou pela sua cabeça?</label>
          <textarea className="inp" value={pensamento} onChange={e=>setPensamento(e.target.value)} placeholder="Pensamentos no momento..." style={{minHeight:60,resize:"vertical"}}/>
          <button className="btn-main" onClick={enviar} style={{background:`linear-gradient(135deg,${emocaoSel.color},${emocaoSel.color}bb)`}}>{enviado?"✅ Registrado!":"Registrar"}</button>
        </>}
      </div>
      {!emocaoSel&&<p style={{textAlign:"center",color:"#aaa",fontSize:13,padding:"8px 0"}}>Selecione uma emoção acima</p>}
    </div>
    {diarios.length>0&&<div style={{marginTop:16}}>
      <h3 style={{fontSize:15,fontWeight:800,color:"#1f2937",marginBottom:12}}>Meus registros ({diarios.length})</h3>
      {diarios.map((d,i)=>{const em=EMOCOES.find(e=>e.nome===d.emocao)||{emoji:"😐",color:"#888"};return<div key={i} style={{background:"#fff",borderRadius:14,padding:14,marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,.05)",display:"flex",gap:12,alignItems:"center"}}>
        <div style={{width:44,height:44,borderRadius:14,background:`${em.color}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{em.emoji}</div>
        <div style={{flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between"}}>
            <span style={{fontWeight:700,color:em.color,fontSize:14}}>{d.emocao}</span>
            <span style={{fontSize:11,color:"#9ca3af"}}>{d.data} {d.hora}</span>
          </div>
          {d.contexto&&<div style={{fontSize:12,color:"#6b7280",marginTop:3}}>{d.contexto}</div>}
          <div style={{background:"#f3f4f6",borderRadius:20,height:5,marginTop:6,overflow:"hidden"}}><div style={{width:`${(d.intensidade/10)*100}%`,background:em.color,height:"100%",borderRadius:20}}/></div>
        </div>
      </div>;})}
    </div>}
  </div>;
}

// ── Task Forms ──
function TaskForm({task,onSubmit,onBack}){
  const ti=getTypeInfo(task.type);
  return<div style={aw}>
    <Header title={ti.label} subtitle={task.title} onBack={onBack} backLabel="← Voltar"/>
    <div style={ct}>
      {task.note&&<div style={{background:`${ti.color}15`,borderRadius:10,padding:12,marginBottom:16,borderLeft:`3px solid ${ti.color}`}}><p style={{fontSize:13,color:"#374151"}}><strong>Orientação:</strong> {task.note}</p></div>}
      {task.type==="pensamentos"&&<PensamentosForm color={ti.color} onSubmit={onSubmit}/>}
      {task.type==="atencao"&&<AtencaoForm color={ti.color} onSubmit={onSubmit}/>}
      {task.type==="experimento"&&<ExperimentoForm color={ti.color} onSubmit={onSubmit}/>}
      {task.type==="escala"&&<EscalaForm color={ti.color} onSubmit={onSubmit}/>}
      {["csai2r","sas","acsi28"].includes(task.type)&&<EscalaPsiForm tipo={task.type} color={ti.color} onSubmit={onSubmit}/>}
    </div>
  </div>;
}

function PensamentosForm({color,onSubmit}){
  const [s,setS]=useState("");const [p,setP]=useState("");const [e,setE]=useState("");const [i,setI]=useState(5);const [a,setA]=useState("");
  return<div style={crd}>
    <h3 style={{color,fontSize:16,marginBottom:16}}>💭 Registro ABC</h3>
    <label style={lbl}>A — Situação</label><textarea className="inp" value={s} onChange={x=>setS(x.target.value)} placeholder="O que aconteceu?" style={{minHeight:60,resize:"vertical"}}/>
    <label style={lbl}>B — Pensamento automático</label><textarea className="inp" value={p} onChange={x=>setP(x.target.value)} placeholder="O que você pensou?" style={{minHeight:60,resize:"vertical"}}/>
    <label style={lbl}>C — Emoção</label><input className="inp" value={e} onChange={x=>setE(x.target.value)} placeholder="ex: fiquei ansioso..."/>
    <label style={lbl}>Intensidade: {i}/10</label>
    <div style={{background:"#f3f4f6",borderRadius:20,height:10,overflow:"hidden",marginBottom:6}}><div style={{width:`${(i/10)*100}%`,background:color,height:"100%",borderRadius:20,transition:"width .1s"}}/></div>
    <input type="range" min={1} max={10} value={i} onChange={x=>setI(+x.target.value)} style={{width:"100%",marginBottom:12,accentColor:color}}/>
    <label style={lbl}>Pensamento alternativo</label><textarea className="inp" value={a} onChange={x=>setA(x.target.value)} placeholder="Outra forma de ver?" style={{minHeight:60,resize:"vertical"}}/>
    <button className="btn-main" style={{background:color,boxShadow:`0 4px 14px ${color}55`}} onClick={()=>{if(s&&p)onSubmit({situacao:s,pensamento:p,emocao:e,intensidade:i,pensamentoAlternativo:a});}}>Enviar</button>
  </div>;
}

function EscalaForm({color,onSubmit}){
  const [vals,setVals]=useState({humor:50,ansiedade:50,sono:50,estresse:50,tristeza:50});const [obs,setObs]=useState("");
  const desc=v=>v<=20?"Muito baixo":v<=40?"Baixo":v<=60?"Moderado":v<=80?"Alto":"Muito alto";
  return<div style={crd}>
    <h3 style={{color,fontSize:16,marginBottom:16}}>📊 Escala de Bem-Estar</h3>
    {ESCALAS_DEF.map(sc=><div key={sc.id} style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}><span style={{fontSize:13,fontWeight:700,color:"#374151"}}>{sc.emoji} {sc.nome}</span><span style={{fontSize:18,fontWeight:800,color:sc.color}}>{vals[sc.id]}%</span></div>
      <div style={{background:"#f3f4f6",borderRadius:20,height:10,overflow:"hidden",marginBottom:4}}><div style={{width:`${vals[sc.id]}%`,background:sc.color,height:"100%",borderRadius:20,transition:"width .1s"}}/></div>
      <div style={{fontSize:11,color:"#888",marginBottom:6}}>{desc(vals[sc.id])}</div>
      <input type="range" min={0} max={100} value={vals[sc.id]} onChange={e=>setVals({...vals,[sc.id]:+e.target.value})} style={{width:"100%",accentColor:sc.color}}/>
    </div>)}
    <label style={lbl}>Observações</label>
    <textarea className="inp" value={obs} onChange={e=>setObs(e.target.value)} placeholder="Como você está hoje?" style={{minHeight:70,resize:"vertical"}}/>
    <button className="btn-main" style={{background:color}} onClick={()=>onSubmit({...vals,obs})}>Enviar Escala</button>
  </div>;
}

function ExperimentoForm({color,onSubmit}){
  const [h,setH]=useState("");const [a,setA]=useState("");const [r,setR]=useState("");const [ap,setAp]=useState("");
  return<div style={crd}>
    <h3 style={{color,fontSize:16,marginBottom:16}}>🔬 Experimento Comportamental</h3>
    <label style={lbl}>Hipótese</label><textarea className="inp" value={h} onChange={e=>setH(e.target.value)} placeholder="O que você acha que vai acontecer?" style={{minHeight:70,resize:"vertical"}}/>
    <label style={lbl}>Ação planejada</label><textarea className="inp" value={a} onChange={e=>setA(e.target.value)} placeholder="O que vai fazer?" style={{minHeight:60,resize:"vertical"}}/>
    <label style={lbl}>O que aconteceu?</label><textarea className="inp" value={r} onChange={e=>setR(e.target.value)} placeholder="Resultado real..." style={{minHeight:70,resize:"vertical"}}/>
    <label style={lbl}>Aprendizado</label><textarea className="inp" value={ap} onChange={e=>setAp(e.target.value)} placeholder="Reflexão..." style={{minHeight:60,resize:"vertical"}}/>
    <button className="btn-main" style={{background:color}} onClick={()=>{if(h&&a)onSubmit({hipotese:h,acao:a,resultado:r,aprendizado:ap});}}>Enviar</button>
  </div>;
}

// ── Teste de Atenção ──
function AtencaoForm({color,onSubmit}){
  const [fase,setFase]=useState("intro");const [timeLeft,setTimeLeft]=useState(40);
  const [totalScore,setTotalScore]=useState(0);const [totalMisses,setTotalMisses]=useState(0);
  const [currentPage,setCurrentPage]=useState(1);const [items,setItems]=useState([]);
  const [showTurn,setShowTurn]=useState(false);const [result,setResult]=useState(null);
  const timerRef=useRef(null);const scoreRef=useRef(0);const missesRef=useRef(0);const targetsRef=useRef(0);
  const timeRef=useRef(40);const pageRef=useRef(1);const pageClickedRef=useRef(new Set());const pageTargetsRef=useRef(0);
  const SHAPES=["quadrado","circulo","triangulo","losango","estrela"];
  const COLORS=["#6d28d9","#e11d48","#059669","#d97706","#0891b2","#7c3aed","#dc2626","#0284c7","#b45309","#0f766e"];
  const TARGETS=["quadrado","triangulo"];
  function getDiff(p){if(p===1)return{cols:5,rows:6,ratio:.35,size:38};if(p===2)return{cols:6,rows:7,ratio:.30,size:33};if(p===3)return{cols:6,rows:8,ratio:.25,size:30};if(p===4)return{cols:7,rows:8,ratio:.22,size:27};return{cols:7,rows:9,ratio:.20,size:24};}
  function drawShape(type,color,size){const s=size,h=size;if(type==="quadrado")return`<rect x="2" y="2" width="${s-4}" height="${h-4}" rx="3" fill="${color}"/>`;if(type==="circulo")return`<circle cx="${s/2}" cy="${h/2}" r="${s/2-2}" fill="${color}"/>`;if(type==="triangulo")return`<polygon points="${s/2},2 ${s-2},${h-2} 2,${h-2}" fill="${color}"/>`;if(type==="losango")return`<polygon points="${s/2},2 ${s-2},${h/2} ${s/2},${h-2} 2,${h/2}" fill="${color}"/>`;if(type==="estrela"){const cx=s/2,cy=h/2,r1=s/2-2,r2=s/4;let pts="";for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2===0?r1:r2;pts+=`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} `;}return`<polygon points="${pts}" fill="${color}"/>`;}return"";}
  function buildPage(page){
    pageClickedRef.current=new Set();
    const d=getDiff(page);const total=d.cols*d.rows;const nT=Math.max(4,Math.floor(total*d.ratio));
    const arr=[];for(let i=0;i<nT;i++)arr.push(TARGETS[i%2]);
    while(arr.length<total)arr.push(SHAPES.filter(s=>!TARGETS.includes(s))[Math.floor(Math.random()*3)]);
    arr.sort(()=>Math.random()-.5);
    pageTargetsRef.current=nT;targetsRef.current+=nT;
    setItems(arr.map((type,i)=>({type,i,color:COLORS[Math.floor(Math.random()*COLORS.length)],size:d.size+Math.floor(Math.random()*8)-4,cols:d.cols,state:"idle"})));
    setCurrentPage(page);window.scrollTo(0,0);
  }
  function startGame(){
    scoreRef.current=0;missesRef.current=0;targetsRef.current=0;timeRef.current=40;pageRef.current=1;
    setTotalScore(0);setTotalMisses(0);setTimeLeft(40);setCurrentPage(1);
    buildPage(1);setFase("game");
    timerRef.current=setInterval(()=>{timeRef.current--;setTimeLeft(timeRef.current);if(timeRef.current<=0)endGame();},1000);
  }
  function handleClick(idx,type){
    if(pageClickedRef.current.has(idx))return;
    pageClickedRef.current.add(idx);
    if(TARGETS.includes(type)){
      scoreRef.current++;setTotalScore(scoreRef.current);
      setItems(prev=>prev.map((it,i)=>i===idx?{...it,state:"correct"}:it));
      const pa=[...pageClickedRef.current].filter(i=>{const it=items[i];return it&&TARGETS.includes(it.type);}).length;
      if(pa+1>=pageTargetsRef.current)setTimeout(()=>doPageTurn(),300);
    }else{missesRef.current++;setTotalMisses(missesRef.current);setItems(prev=>prev.map((it,i)=>i===idx?{...it,state:"wrong"}:it));}
  }
  function doPageTurn(){
    if(timeRef.current<=0)return;
    setShowTurn(true);const next=pageRef.current+1;pageRef.current=next;
    setTimeout(()=>{buildPage(next);setTimeout(()=>setShowTurn(false),500);},400);
  }
  function endGame(){
    clearInterval(timerRef.current);
    const precisao=(scoreRef.current+missesRef.current)>0?Math.round(scoreRef.current/(scoreRef.current+missesRef.current)*100):0;
    const cobertura=targetsRef.current>0?Math.round(scoreRef.current/targetsRef.current*100):0;
    setResult({paginas:pageRef.current,acertos:scoreRef.current,erros:missesRef.current,precisao,cobertura});
    setFase("result");
  }
  const cols=items[0]?.cols||5;const urgent=timeLeft<=10;
  if(fase==="intro")return<div style={{...crd,textAlign:"center"}}>
    <div style={{fontSize:52,marginBottom:12}}>🎯</div>
    <h3 style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>Teste de Atenção</h3>
    <p style={{fontSize:13,color:"#6b7280",marginBottom:20,lineHeight:1.6}}>Toque em todos os <strong>quadrados</strong> e <strong>triângulos</strong>!</p>
    <div style={{display:"flex",justifyContent:"center",gap:24,marginBottom:20}}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}><svg width="48" height="48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#6d28d9"/></svg><span style={{fontSize:11,fontWeight:700}}>Quadrado ✅</span></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}><svg width="48" height="48"><polygon points="24,4 46,44 2,44" fill="#0891b2"/></svg><span style={{fontSize:11,fontWeight:700}}>Triângulo ✅</span></div>
    </div>
    <div style={{background:"#fef3c7",borderRadius:10,padding:12,fontSize:13,color:"#92400e",fontWeight:600,marginBottom:20}}>⏱ <strong>40 segundos</strong> — Se acertar todos, avança de página!</div>
    <button className="btn-main" style={{background:color}} onClick={startGame}>Começar!</button>
  </div>;
  if(fase==="result")return<div style={crd}>
    <div style={{textAlign:"center",marginBottom:16}}>
      <div style={{fontSize:48,marginBottom:8}}>{result.precisao>=80?"🏆":result.precisao>=60?"🎉":"💪"}</div>
      <h3 style={{fontSize:18,fontWeight:800,color:"#1f2937"}}>{result.precisao>=80?"Excelente!":result.precisao>=60?"Muito bem!":"Continue tentando!"}</h3>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
      {[[result.paginas,"Páginas","#6d28d9"],[result.acertos,"Acertos","#059669"],[result.erros,"Erros","#e11d48"],[`${result.precisao}%`,"Precisão","#0891b2"]].map(([v,l,c])=><div key={l} style={{background:"#f9fafb",borderRadius:12,padding:12,textAlign:"center"}}><div style={{fontSize:24,fontWeight:900,color:c}}>{v}</div><div style={{fontSize:11,color:"#888"}}>{l}</div></div>)}
    </div>
    <button className="btn-main" style={{background:color,marginBottom:8}} onClick={()=>onSubmit(result)}>Salvar resultado</button>
    <button style={{...btn("#e5e7eb"),width:"100%"}} onClick={startGame}>Tentar novamente</button>
  </div>;
  return<div style={{position:"relative"}}>
    {showTurn&&<div style={{position:"fixed",inset:0,zIndex:100,pointerEvents:"none",overflow:"hidden"}}>
      <div style={{position:"absolute",inset:0,background:"linear-gradient(to right,#fafafa,#fff)",transformOrigin:"left center",animation:"slideOut .9s cubic-bezier(.77,0,.18,1) forwards"}}/>
      <div style={{position:"absolute",inset:0,background:"#fff",transform:"translateX(100%)",animation:"slideIn .9s cubic-bezier(.77,0,.18,1) forwards"}}/>
    </div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 4px",marginBottom:8}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:26,fontWeight:900,color:urgent?"#e11d48":"#6d28d9",animation:urgent?"piscar .4s infinite alternate":""}}>{timeLeft}</div>
        <div style={{fontSize:10,color:"#aaa"}}>segundos</div>
      </div>
      <div style={{background:"#ede9fe",color:"#6d28d9",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:800}}>Página {currentPage}</div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:20,fontWeight:800,color:"#059669"}}>{totalScore}</div>
        <div style={{fontSize:10,color:"#aaa"}}>acertos</div>
        <div style={{fontSize:12,fontWeight:700,color:"#e11d48"}}>{totalMisses} erro{totalMisses!==1?"s":""}</div>
      </div>
    </div>
    <div style={{background:"#ede9fe",borderRadius:10,padding:"7px 12px",marginBottom:10,fontSize:12,color:"#5b21b6",fontWeight:600,textAlign:"center"}}>Toque nos <strong>quadrados</strong> e <strong>triângulos</strong>!</div>
    <div style={{display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gap:6}}>
      {items.map((it,idx)=><button key={idx} onClick={()=>handleClick(idx,it.type)} style={{background:it.state==="correct"?"#d1fae5":it.state==="wrong"?"#fee2e2":"transparent",border:"none",cursor:"pointer",padding:2,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",aspectRatio:"1",opacity:it.state==="missed"?.35:1,transition:"background .2s"}}>
        <svg width={it.size} height={it.size} dangerouslySetInnerHTML={{__html:drawShape(it.type,it.color,it.size)}}/>
      </button>)}
    </div>
  </div>;
}

function ResponseView({response,type}){
  if(!response)return null;
  const items=[];
  if(type==="pensamentos")items.push(["Situação",response.situacao],["Pensamento",response.pensamento],["Emoção",response.emocao],["Intensidade",`${response.intensidade}/10`],["Alternativo",response.pensamentoAlternativo]);
  if(type==="atencao")items.push(["Páginas",response.paginas],["Acertos",response.acertos],["Erros",response.erros],["Precisão",`${response.precisao}%`]);
  if(type==="experimento")items.push(["Hipótese",response.hipotese],["Ação",response.acao],["Resultado",response.resultado],["Aprendizado",response.aprendizado]);
  if(type==="escala"){ESCALAS_DEF.forEach(s=>items.push([s.nome,`${response[s.id]}%`]));if(response.obs)items.push(["Obs",response.obs]);}

  if(["csai2r","sas","acsi28"].includes(type)&&response.totais){
    const escalaData=getEscalaData(type);
    if(!escalaData)return null;
    return<div style={{display:"flex",flexDirection:"column",gap:8}}>
      {Object.entries(escalaData.subescalas).map(([key,info])=>{
        const total=response.totais[key]||0;
        const contagem=escalaData.itens.filter(i=>i.sub===key).length;
        const max=contagem*escalaData.escala.length;
        const pct=max>0?Math.round((total/max)*100):0;
        return<div key={key} style={{background:"#f9fafb",borderRadius:10,padding:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{info.nome}</span>
            <span style={{fontSize:13,fontWeight:800,color:info.cor}}>{total}/{max}</span>
          </div>
          <div style={{background:"#e5e7eb",borderRadius:20,height:8,overflow:"hidden"}}>
            <div style={{width:`${pct}%`,background:info.cor,height:"100%",borderRadius:20}}/>
          </div>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{pct}% do máximo</div>
        </div>;
      })}
    </div>;
  }

  return<div style={{display:"flex",flexDirection:"column",gap:6}}>{items.filter(([,v])=>v!=null&&v!=="").map(([k,v])=><div key={k} style={{fontSize:13,padding:"8px 12px",background:"#f9fafb",borderRadius:10}}><strong style={{color:"#374151"}}>{k}:</strong> <span style={{color:"#555"}}>{v}</span></div>)}</div>;
}

// ── Root ──
function App(){
  const [ready,setReady]=useState(window._firebaseReady||false);
  const [session,setSession]=useState({role:null,patientId:null});
  useEffect(()=>{if(!ready){const h=()=>setReady(true);window.addEventListener("firebaseReady",h);return()=>window.removeEventListener("firebaseReady",h);}},[ready]);
  if(!ready)return<div style={{minHeight:"100vh",background:"linear-gradient(160deg,#1e1b4b,#4c1d95,#0c4a6e)",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{color:"#fff",textAlign:"center"}}><div style={{fontSize:40,marginBottom:12}}>🧠</div><div style={{fontSize:16,fontWeight:700}}>MeuPsi</div><div style={{fontSize:13,marginTop:8,opacity:.8}}>Conectando...</div></div>
  </div>;
  if(!session.role)return<LoginScreen onLogin={(role,pid)=>setSession({role,patientId:pid})}/>;
  if(session.role==="therapist")return<TherapistApp onLogout={()=>setSession({role:null,patientId:null})}/>;
  return<PatientApp patientId={session.patientId} onLogout={()=>setSession({role:null,patientId:null})}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
