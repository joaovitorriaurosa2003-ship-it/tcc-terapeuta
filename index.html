function parseDataBR(str) {
  if (!str) return null;
  const partes = str.split("/");
  if (partes.length !== 3) return null;
  const [d, m, y] = partes;
  const dt = new Date(`${y}-${m}-${d}T00:00:00`);
  return isNaN(dt.getTime()) ? null : dt;
}
async function arquivarRespostaSeExistir(patientId, task) {
  if (!task.response) return;
  const id = task.id || ("arq" + Date.now() + Math.random().toString(36).slice(2, 5));
  await fbSet(`patients/${patientId}/respostas_arquivadas/${id}`, {
    ...task,
    arquivadoEm: new Date().toLocaleDateString("pt-BR")
  });
}
async function fbGet(p) {
  const s = await window._get(window._ref(window._db, p));
  return s.exists() ? s.val() : null;
}
async function fbSet(p, v) {
  await window._set(window._ref(window._db, p), v);
}
async function fbUpdate(p, v) {
  await window._update(window._ref(window._db, p), v);
}
function fbListen(p, cb) {
  return window._onValue(window._ref(window._db, p), s => cb(s.exists() ? s.val() : null));
}

function calcEscala(ed, resp) {
  const t = {};
  const c = {};
  Object.keys(ed.subescalas).forEach(k => {
    t[k] = 0;
    c[k] = 0;
  });
  ed.itens.forEach(item => {
    const v = resp[item.id];
    if (v != null) {
      const val = item.inverso ? ed.escala.length + 1 - v : v;
      t[item.sub] += val;
      c[item.sub]++;
    }
  });
  return {
    totais: t,
    contagens: c
  };
}
